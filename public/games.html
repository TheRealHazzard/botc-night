<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game History</title>
<meta name="theme-color" content="#f2e8d3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18130f" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/icons/icon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:wght@500;600;700&family=Spectral:ital,wght@0,400;0,500;1,400&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{
  --ink:#18130f; --ink-2:#241c15; --ink-3:#3a2e22;
  --parchment:#f2e8d3; --parchment-2:#fbf5e6; --parchment-3:#e2d3b3;
  --oxblood:#9a2f35; --oxblood-bright:#c1474d;
  --brass:#b8863f; --brass-bright:#d9a75a;
  --good:#3c5875; --good-bright:#6f93b5; --evil-bright:#d08a86; --ash:#7a7267;

  --bg: var(--parchment); --bg-2: var(--parchment-2); --panel-border: var(--parchment-3);
  --text:#2a2015; --text-dim:#6b5f4c; --accent: var(--oxblood); --accent-text:#fff8ef;
  --shadow: 0 2px 10px rgba(30,20,10,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg: var(--ink); --bg-2: var(--ink-2); --panel-border: var(--ink-3);
    --text:#ece2ce; --text-dim:#ab9d86; --accent: var(--brass-bright); --accent-text:#241a0c;
    --shadow: 0 2px 14px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg: var(--ink); --bg-2: var(--ink-2); --panel-border: var(--ink-3);
  --text:#ece2ce; --text-dim:#ab9d86; --accent: var(--brass-bright); --accent-text:#241a0c;
  --shadow: 0 2px 14px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--text); font-family:'Spectral',Georgia,serif; font-size:16px; line-height:1.55}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif; font-weight:600; margin:0 0 .4em; text-wrap:balance}
.mono{font-family:'Space Mono',monospace; font-variant-numeric:tabular-nums}
button{font-family:inherit; font-size:1rem; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.app{max-width:760px; margin:0 auto; padding:0 18px 60px}
header{display:flex; align-items:baseline; justify-content:space-between; gap:14px; padding:26px 4px 16px; border-bottom:2px solid var(--panel-border)}
.wordmark{font-family:'Cinzel Decorative',serif; font-size:1.4rem; color:var(--accent)}
header a{color:var(--text-dim); font-size:.82rem; text-decoration:underline; text-underline-offset:3px}

.panel{background:var(--bg-2); border:1px solid var(--panel-border); border-radius:6px; box-shadow:var(--shadow); padding:20px; margin-bottom:16px}
.muted{color:var(--text-dim)}
.small{font-size:.85rem}
.backlink{background:none; border:none; padding:0; margin-bottom:16px; color:var(--text-dim); font-size:.85rem; text-decoration:underline; text-underline-offset:3px}

table{width:100%; border-collapse:collapse; font-size:.9rem}
th{text-align:left; font-family:'Cormorant Garamond',serif; font-size:.95rem; color:var(--text-dim); border-bottom:1px solid var(--panel-border); padding:6px 8px}
td{border-bottom:1px solid var(--panel-border); padding:8px}
tr:last-child td{border-bottom:none}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--bg)}
.win{color:var(--good)} .loss{color:var(--oxblood)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .win{color:var(--good-bright)}
  :root:not([data-theme="light"]) .loss{color:var(--evil-bright)}
}

.align-dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:7px; vertical-align:middle}
.align-dot.good{background:var(--good)} .align-dot.evil{background:var(--oxblood)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .align-dot.good{background:var(--good-bright)}
  :root:not([data-theme="light"]) .align-dot.evil{background:var(--evil-bright)}
}
.rolecell.good{color:var(--good)} .rolecell.evil{color:var(--oxblood)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .rolecell.good{color:var(--good-bright)}
  :root:not([data-theme="light"]) .rolecell.evil{color:var(--evil-bright)}
}
.deadname{text-decoration:line-through; color:var(--text-dim)}

.victory{display:flex; align-items:baseline; gap:10px; margin-bottom:4px}
.victory .who{font-family:'Cinzel Decorative',serif; font-size:1.3rem; color:var(--accent)}

.timeline{display:flex; flex-direction:column; gap:14px}
.dayblock{border-left:2px solid var(--panel-border); padding-left:14px}
.dayblock h3{margin-bottom:8px}
.nomline{display:flex; justify-content:space-between; gap:10px; font-size:.9rem; padding:5px 0; border-bottom:1px dashed var(--panel-border)}
.nomline:last-child{border-bottom:none}
.nomline .tally{color:var(--text-dim); white-space:nowrap}
.logline{font-size:.85rem; color:var(--text-dim); margin:3px 0}

.loadmore{width:100%; background:var(--bg-2); border:1px solid var(--panel-border); border-radius:5px; padding:12px; font-weight:600; color:var(--text)}
.loadmore:hover{border-color:var(--accent)}
.empty{color:var(--text-dim); padding:30px 4px; text-align:center}

.lbrow{display:flex; justify-content:space-between; font-size:.9rem; padding:6px 0; border-bottom:1px dashed var(--panel-border)}
.lbrow:last-child{border-bottom:none}
.lbrow .rank{color:var(--text-dim); width:1.6em; display:inline-block}
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="wordmark">Game History</span>
    <span><a href="/stats">Your record</a> &nbsp;·&nbsp; <a href="/hall-of-fame">Hall of Fame</a> &nbsp;·&nbsp; <a href="/">Back to the table</a></span>
  </header>
  <div id="view"></div>
</div>

<script>
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
const fmtPct = x => x == null ? '—' : Math.round(x * 100) + '%';
const isGoodTeam = team => team === 'townsfolk' || team === 'outsider';
const EDITION_NAMES = { tb: 'Trouble Brewing', bmr: 'Bad Moon Rising', sv: 'Sects & Violets', custom: 'Custom script' };

function fmtDate(ms) {
  const d = new Date(ms);
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) +
    ' · ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}

function goToGame(id) { location.href = '/games?id=' + encodeURIComponent(id); }
function goToList() { location.href = '/games'; }

/* -------------------------------------------------------------- leaderboards */

function leaderboardPanel(title, subtitle, rows, renderRow, emptyText) {
  const panel = el('div', 'panel');
  panel.append(el('h3', null, title));
  if (subtitle) panel.append(el('p', 'small muted', subtitle));
  if (!rows.length) {
    panel.append(el('p', 'small muted', emptyText));
    return panel;
  }
  rows.slice(0, 5).forEach((row, i) => panel.append(renderRow(row, i)));
  return panel;
}

function loadLeaderboards(container) {
  fetch('/api/leaderboard/voting').then(r => r.json()).then(rows => {
    container.append(leaderboardPanel(
      'Best good voters', 'Correct alignment calls — voting yes on evil, no on good (needs at least 5 votes on record).',
      rows,
      (row, i) => {
        const line = el('div', 'lbrow');
        line.append(el('span', null), el('span', 'mono', fmtPct(row.accuracy) + ` (${row.correctVotes}/${row.totalVotes})`));
        line.firstChild.append(el('span', 'rank', '#' + (i + 1)), document.createTextNode(row.name));
        return line;
      },
      'Nobody has cast enough votes yet — this fills in as real games get played.',
    ));
  }).catch(() => {});

  fetch('/api/leaderboard/characters').then(r => r.json()).then(rows => {
    container.append(leaderboardPanel(
      'Character win rates', 'How each character has fared across every recorded game.',
      rows,
      (row, i) => {
        const line = el('div', 'lbrow');
        line.append(el('span', null), el('span', 'mono', fmtPct(row.winRate) + ` (${row.wins}/${row.total})`));
        line.firstChild.append(el('span', 'rank', '#' + (i + 1)), document.createTextNode(row.name));
        return line;
      },
      'No completed games yet.',
    ));
  }).catch(() => {});
}

/* -------------------------------------------------------------------- list */

function renderList() {
  const view = document.getElementById('view');
  view.innerHTML = '';
  loadLeaderboards(view);

  const panel = el('div', 'panel');
  panel.append(el('h3', null, 'Past games'));
  const body = el('div');
  panel.append(body);
  view.append(panel);

  function loadPage(before) {
    fetch('/api/games?limit=20' + (before ? '&before=' + before : '')).then(r => r.json()).then(data => {
      if (!before && !data.games.length) {
        body.innerHTML = '';
        body.append(el('p', 'empty', 'No games recorded yet — they show up here as soon as one finishes.'));
        return;
      }
      if (!before) {
        const table = el('table');
        const head = el('tr');
        ['Date', 'Script', 'Players', 'Winner'].forEach(h => head.append(el('th', null, h)));
        table.append(head);
        body.innerHTML = '';
        body.append(table);
      }
      const table = body.querySelector('table');
      data.games.forEach(g => {
        const row = el('tr', 'clickable');
        row.append(
          el('td', null, fmtDate(g.endedAt)),
          el('td', null, EDITION_NAMES[g.edition] || g.edition),
          el('td', 'mono', String(g.playerCount)),
          el('td', g.winner === 'good' ? 'win' : g.winner === 'evil' ? 'loss' : '', g.winner ? (g.winner === 'good' ? 'Good' : 'Evil') : '—'),
        );
        row.onclick = () => goToGame(g.id);
        table.append(row);
      });
      const old = body.querySelector('.loadmore');
      if (old) old.remove();
      if (data.nextBefore) {
        const more = el('button', 'loadmore', 'Load more');
        more.onclick = () => loadPage(data.nextBefore);
        body.append(more);
      }
    }).catch(() => {
      body.append(el('p', 'empty', 'Could not load game history.'));
    });
  }
  loadPage();
}

/* ------------------------------------------------------------------ detail */

function renderDetail(id) {
  const view = document.getElementById('view');
  view.innerHTML = '';
  const back = el('button', 'backlink', '← All games');
  back.onclick = goToList;
  view.append(back);

  fetch('/api/game?id=' + encodeURIComponent(id)).then(r => r.json()).then(g => {
    if (g.error) { view.append(el('p', 'empty', g.error)); return; }

    const summary = el('div', 'panel');
    const v = el('div', 'victory');
    v.append(
      el('span', 'who', g.winner === 'good' ? 'Good wins' : g.winner === 'evil' ? 'Evil wins' : 'Unresolved'),
      el('span', 'muted small', `${EDITION_NAMES[g.edition] || g.edition} · ${g.playerCount} players · ${fmtDate(g.endedAt)}`),
    );
    summary.append(v);
    if (g.reason) summary.append(el('p', null, g.reason));
    const shareLink = el('a', 'small', 'Shareable recap →');
    shareLink.href = '/recap?id=' + encodeURIComponent(id);
    shareLink.target = '_blank';
    shareLink.rel = 'noopener';
    shareLink.style.textDecoration = 'underline';
    shareLink.style.textUnderlineOffset = '3px';
    summary.append(el('p', 'small muted', ''));
    summary.lastChild.append(document.createTextNode('Paste-ready for a group chat: '), shareLink);
    view.append(summary);

    const roster = el('div', 'panel');
    roster.append(el('h3', null, 'Roster'));
    const table = el('table');
    const head = el('tr');
    ['Name', 'Role', 'Outcome'].forEach(h => head.append(el('th', null, h)));
    table.append(head);
    g.players.forEach(p => {
      const good = isGoodTeam(p.team);
      const row = el('tr');
      const nameCell = el('td', null);
      nameCell.append(el('span', p.alive ? null : 'deadname', p.name || p.seatName));
      row.append(nameCell);
      const roleCell = el('td', 'rolecell ' + (good ? 'good' : 'evil'));
      roleCell.append(el('span', 'align-dot ' + (good ? 'good' : 'evil')), document.createTextNode(p.characterName || p.characterId || 'unknown'));
      row.append(roleCell);
      const outcomeText = p.won === null || p.won === undefined ? '—' : p.won ? 'Won' : 'Lost';
      row.append(el('td', p.won ? 'win' : p.won === false ? 'loss' : '', outcomeText));
      table.append(row);
    });
    roster.append(table);
    view.append(roster);

    const timelinePanel = el('div', 'panel');
    timelinePanel.append(el('h3', null, 'Timeline'));
    const timeline = el('div', 'timeline');
    const byDay = {};
    (g.nominations || []).forEach(n => { (byDay[n.day] = byDay[n.day] || []).push(n); });
    (g.log || []).forEach(l => { (byDay[l.night] = byDay[l.night] || []); });
    const days = Object.keys(byDay).map(Number).sort((a, b) => a - b);
    if (!days.length) {
      timelinePanel.append(el('p', 'small muted', 'No recorded nominations or log entries for this game.'));
    }
    days.forEach(day => {
      const block = el('div', 'dayblock');
      block.append(el('h3', null, `Night ${day}`));
      byDay[day].forEach(n => {
        const line = el('div', 'nomline');
        line.append(
          el('span', null, `${n.nominatorName} → ${n.nomineeName}` + (n.virginFired ? ' (Virgin fired)' : '')),
          el('span', 'tally', n.closed ? `${n.yesCount} yes` : 'unresolved'),
        );
        block.append(line);
      });
      (g.log || []).filter(l => l.night === day).forEach(l => block.append(el('div', 'logline', l.text)));
      timeline.append(block);
    });
    timelinePanel.append(timeline);
    view.append(timelinePanel);
  }).catch(() => {
    view.append(el('p', 'empty', 'Could not load this game.'));
  });
}

const params = new URLSearchParams(location.search);
const gameId = params.get('id');
if (gameId) renderDetail(gameId); else renderList();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Record</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:wght@500;600;700&family=Spectral:ital,wght@0,400;0,500;1,400&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{
  --ink:#18130f; --ink-2:#241c15; --ink-3:#3a2e22;
  --parchment:#f2e8d3; --parchment-2:#fbf5e6; --parchment-3:#e2d3b3;
  --oxblood:#9a2f35; --oxblood-bright:#c1474d;
  --brass:#b8863f; --brass-bright:#d9a75a;
  --good:#3c5875; --good-bright:#6f93b5; --evil-bright:#d08a86; --ash:#7a7267;

  --bg: var(--parchment); --bg-2: var(--parchment-2); --panel-border: var(--parchment-3);
  --text:#2a2015; --text-dim:#6b5f4c; --accent: var(--oxblood); --accent-text:#fff8ef;
  --shadow: 0 2px 10px rgba(30,20,10,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg: var(--ink); --bg-2: var(--ink-2); --panel-border: var(--ink-3);
    --text:#ece2ce; --text-dim:#ab9d86; --accent: var(--brass-bright); --accent-text:#241a0c;
    --shadow: 0 2px 14px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg: var(--ink); --bg-2: var(--ink-2); --panel-border: var(--ink-3);
  --text:#ece2ce; --text-dim:#ab9d86; --accent: var(--brass-bright); --accent-text:#241a0c;
  --shadow: 0 2px 14px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--text); font-family:'Spectral',Georgia,serif; font-size:16px; line-height:1.55}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif; font-weight:600; margin:0 0 .4em; text-wrap:balance}
.mono{font-family:'Space Mono',monospace; font-variant-numeric:tabular-nums}
button,input{font-family:inherit; font-size:1rem; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.app{max-width:640px; margin:0 auto; padding:0 18px 60px}
header{display:flex; align-items:baseline; justify-content:space-between; gap:14px; padding:26px 4px 16px; border-bottom:2px solid var(--panel-border)}
.wordmark{font-family:'Cinzel Decorative',serif; font-size:1.4rem; color:var(--accent)}
header a{color:var(--text-dim); font-size:.82rem; text-decoration:underline; text-underline-offset:3px}

.searchrow{display:flex; gap:10px; margin:22px 0}
input[type=text]{flex:1; background:var(--bg-2); border:1px solid var(--panel-border); border-radius:4px; padding:11px 14px}
button{background:var(--accent); color:var(--accent-text); border:none; border-radius:4px; padding:11px 20px; font-weight:600}

.panel{background:var(--bg-2); border:1px solid var(--panel-border); border-radius:6px; box-shadow:var(--shadow); padding:20px; margin-bottom:16px}
.muted{color:var(--text-dim)}
.small{font-size:.85rem}

.tiles{display:flex; gap:10px; flex-wrap:wrap}
.tile{flex:1; min-width:120px; background:var(--bg); border:1px solid var(--panel-border); border-radius:5px; padding:14px; text-align:center}
.tile .n{font-family:'Space Mono',monospace; font-size:1.7rem; font-weight:700; color:var(--accent)}
.tile .lbl{font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); margin-top:2px}

.colorhead{display:flex; align-items:center; gap:12px; margin-bottom:4px}
.colorhead h3{margin:0}
.avatar{
  width:44px; height:44px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-family:'Cinzel Decorative',serif; font-size:1.1rem; color:#f2e8d3;
  border:2px solid var(--panel-border);
}
.colorgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:8px; margin-top:12px}
.swatch{
  border-radius:6px; padding:14px 6px; min-height:40px; text-align:center; cursor:pointer;
  border:2px solid rgba(0,0,0,.12); display:flex; align-items:center; justify-content:center;
}
.swatch-name{font-size:.66rem; font-weight:700; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.7); line-height:1.25}
.swatch.taken{opacity:.3; cursor:not-allowed; filter:grayscale(.7)}
.swatch.mine{border-color:var(--accent); cursor:default}

.split{display:flex; gap:10px; margin-top:10px}
.chip{flex:1; border-radius:5px; padding:10px 14px; font-size:.88rem; text-align:center}
.chip.good{background:#1c2c3c1a; border:1px solid var(--good); color:var(--good)}
.chip.evil{background:#3612131a; border:1px solid var(--oxblood); color:var(--oxblood)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .chip.good{color:var(--good-bright); border-color:var(--good-bright)}
  :root:not([data-theme="light"]) .chip.evil{color:var(--evil-bright); border-color:var(--evil-bright)}
}

.outcomes{display:flex; flex-direction:column; gap:6px; margin-top:8px}
.outcomes div{display:flex; justify-content:space-between; font-size:.9rem; border-bottom:1px dashed var(--panel-border); padding-bottom:5px}

table{width:100%; border-collapse:collapse; font-size:.9rem}
th{text-align:left; font-family:'Cormorant Garamond',serif; font-size:.95rem; color:var(--text-dim); border-bottom:1px solid var(--panel-border); padding:6px 8px}
td{border-bottom:1px solid var(--panel-border); padding:8px}
tr:last-child td{border-bottom:none}
.win{color:var(--good)} .loss{color:var(--oxblood)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .win{color:var(--good-bright)}
  :root:not([data-theme="light"]) .loss{color:var(--evil-bright)}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="wordmark">Your Record</span>
    <span><a href="/games">Game history</a> &nbsp;·&nbsp; <a href="/">Back to the table</a></span>
  </header>

  <div class="searchrow">
    <input type="text" id="nameInput" placeholder="Your name" maxlength="24">
    <button id="lookup">Look up</button>
  </div>

  <div id="result"></div>
</div>

<script>
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
const fmtPct = x => x == null ? '—' : Math.round(x * 100) + '%';
const EDITION_NAMES = { tb: 'Trouble Brewing', bmr: 'Bad Moon Rising', sv: 'Sects & Violets', custom: 'Custom script' };

function outcomeLabel(key) {
  if (key === 'survived') return 'Survived to the reveal';
  const m = key.match(/^(night|execution)(\d+)?$/);
  if (m) {
    const [, phase, num] = m;
    return phase === 'execution' ? `Executed — Day ${num || '?'}` : `Died — Night ${num || '?'}`;
  }
  return key;
}

function render(name, stats, color) {
  const box = document.getElementById('result');
  box.innerHTML = '';
  box.append(colorPanel(name, color));

  if (!stats.gamesPlayed) {
    box.append(el('div', 'panel', `No games on record for ${name} yet — play one and it'll start building.`));
    return;
  }

  const summary = el('div', 'panel');
  summary.append(el('h2', null, name));
  const tiles = el('div', 'tiles');
  tiles.append(
    tile(stats.gamesPlayed, 'Games played'),
    tile(fmtPct(stats.winRate), 'Win rate'),
    tile(fmtPct(stats.survivalRate), 'Survives to reveal'),
  );
  summary.append(tiles);

  const split = el('div', 'split');
  split.append(
    el('div', 'chip good', `As good: ${fmtPct(stats.goodWinRate)} win rate`),
    el('div', 'chip evil', `As evil: ${fmtPct(stats.evilWinRate)} win rate`),
  );
  summary.append(split);

  if (stats.favoriteCharacter) {
    summary.append(el('p', 'small muted', `Most played character: ${stats.favoriteCharacter.name} (${stats.favoriteCharacter.count}×)`));
  }
  box.append(summary);

  const outcomesPanel = el('div', 'panel');
  outcomesPanel.append(el('h3', null, 'How it usually ends'));
  const list = el('div', 'outcomes');
  Object.entries(stats.byOutcome)
    .sort((a, b) => b[1] - a[1])
    .forEach(([key, count]) => {
      const row = el('div');
      row.append(el('span', null, outcomeLabel(key)), el('span', 'mono', String(count)));
      list.append(row);
    });
  outcomesPanel.append(list);
  box.append(outcomesPanel);

  const recentPanel = el('div', 'panel');
  recentPanel.append(el('h3', null, 'Recent games'));
  const table = el('table');
  const head = el('tr');
  ['Script', 'Character', 'Team', 'Outcome'].forEach(h => head.append(el('th', null, h)));
  table.append(head);
  stats.recentGames.forEach(g => {
    const row = el('tr');
    row.append(el('td', null, EDITION_NAMES[g.edition] || g.edition));
    row.append(el('td', null, g.character || '—'));
    row.append(el('td', null, g.team || '—'));
    const outcomeText = g.won === null ? 'Unresolved' : g.won ? 'Won' : 'Lost';
    row.append(el('td', g.won === null ? '' : g.won ? 'win' : 'loss', outcomeText));
    table.append(row);
  });
  recentPanel.append(table);
  box.append(recentPanel);
}

function colorPanel(name, currentColor) {
  const panel = el('div', 'panel');
  const head = el('div', 'colorhead');
  const avatar = el('div', 'avatar', (name[0] || '?').toUpperCase());
  avatar.style.background = currentColor ? currentColor.hex : '#4d5b66';
  head.append(avatar, el('h3', null, 'Your color'));
  panel.append(head);
  panel.append(el('p', 'small muted', currentColor
    ? `Currently ${currentColor.name}. Pick another any time — nobody else can hold it while you do.`
    : "You haven't picked one yet. Nobody else can hold it while you do."));

  const grid = el('div', 'colorgrid');
  panel.append(grid);
  fetch('/api/colors?name=' + encodeURIComponent(name)).then(r => r.json()).then(colors => {
    colors.forEach(c => {
      const mine = currentColor && currentColor.id === c.id;
      const sw = el('div', 'swatch' + (c.takenBy ? ' taken' : '') + (mine ? ' mine' : ''));
      sw.style.background = c.hex;
      sw.append(el('span', 'swatch-name', c.takenBy ? `${c.name} — ${c.takenBy}'s` : c.name));
      if (!c.takenBy && !mine) {
        sw.onclick = () => {
          fetch('/api/profile/color', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, colorId: c.id }),
          }).then(r2 => r2.json()).then(r2 => {
            if (r2.error) { alert(r2.error); return; }
            lookup();
          });
        };
      }
      grid.append(sw);
    });
  }).catch(() => {});
  return panel;
}

function tile(n, lbl) {
  const t = el('div', 'tile');
  t.append(el('div', 'n mono', String(n)), el('div', 'lbl', lbl));
  return t;
}

function lookup() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) return;
  fetch('/api/profile?name=' + encodeURIComponent(name)).then(r => r.json()).then(r => {
    const box = document.getElementById('result');
    box.innerHTML = '';
    if (!r.found) { box.append(el('div', 'panel', `No record for "${name}" yet — the name has to match what you played under.`)); return; }
    render(r.name, r.stats, r.color);
  });
}

document.getElementById('lookup').onclick = lookup;
document.getElementById('nameInput').onkeydown = e => { if (e.key === 'Enter') lookup(); };
</script>
</body>
</html>

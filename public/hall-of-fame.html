<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hall of Fame</title>
<meta name="theme-color" content="#f2e8d3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0811" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/icons/icon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:wght@500;600;700&family=Spectral:ital,wght@0,400;0,500;1,400&family=Space+Mono:wght@400;700&display=swap">
<!-- Loaded unconditionally — its tokens only get CONSUMED below inside
     the dark-mode blocks, so this is a no-op in light mode. See
     clocktower-dark.css's own comment. -->
<link rel="stylesheet" href="/clocktower-dark.css">
<style>
:root{
  --ink:#18130f; --ink-2:#241c15; --ink-3:#3a2e22;
  --parchment:#f2e8d3; --parchment-2:#fbf5e6; --parchment-3:#e2d3b3;
  --oxblood:#9a2f35; --oxblood-bright:#c1474d;
  --brass:#b8863f; --brass-bright:#d9a75a;
  --good:#3c5875; --good-bright:#6f93b5; --evil-bright:#d08a86; --ash:#7a7267;

  --bg: var(--parchment); --bg-2: var(--parchment-2); --panel-border: var(--parchment-3);
  --text:#2a2015; --text-dim:#6b5f4c; --accent: var(--oxblood); --accent-text:#fff8ef;
  --shadow: 0 2px 10px rgba(30,20,10,.10);
}
/* Dark-mode surfaces/text/accent realigned to client/src/theme.css's
   canonical void/surface/line/bone/brass — see games.html's own copy of
   this comment for why. Light mode (above) is untouched. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg: var(--void); --bg-2: var(--surface); --panel-border: var(--line);
    --text: var(--bone); --text-dim: var(--bone-dim); --accent: var(--brass); --accent-text:#241a0c;
    --shadow: 0 2px 14px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg: var(--void); --bg-2: var(--surface); --panel-border: var(--line);
  --text: var(--bone); --text-dim: var(--bone-dim); --accent: var(--brass); --accent-text:#241a0c;
  --shadow: 0 2px 14px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
/* Centers a short report vertically on a big TV screen instead of
   pinning it to the top. min-height, not height — html/body get no
   explicit height at all here, so body is always free to grow past the
   viewport and the page scrolls normally once content actually does;
   pairing this with a fixed height (an earlier version of this rule
   accidentally did) traps overflow behind an un-scrollable clip instead. */
body{margin:0; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; justify-content:center; background:var(--bg); color:var(--text); font-family:'Spectral',Georgia,serif; font-size:16px; line-height:1.55}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif; font-weight:600; margin:0 0 .4em; text-wrap:balance}
.mono{font-family:'Space Mono',monospace; font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.app{max-width:760px; margin:0 auto; padding:0 18px 60px}
header{display:flex; align-items:baseline; justify-content:space-between; gap:14px; padding:26px 4px 16px; border-bottom:2px solid var(--panel-border)}
.wordmark{font-family:'Cinzel Decorative',serif; font-size:1.4rem; color:var(--accent)}
header a{color:var(--text-dim); font-size:.82rem; text-decoration:underline; text-underline-offset:3px}

.panel{background:var(--bg-2); border:1px solid var(--panel-border); border-radius:6px; box-shadow:var(--shadow); padding:20px; margin-bottom:16px}
.muted{color:var(--text-dim)}
.small{font-size:.85rem}
.empty{color:var(--text-dim); padding:30px 4px; text-align:center}

table{width:100%; border-collapse:collapse; font-size:.9rem}
th{text-align:left; font-family:'Cormorant Garamond',serif; font-size:.95rem; color:var(--text-dim); border-bottom:1px solid var(--panel-border); padding:6px 8px}
td{border-bottom:1px solid var(--panel-border); padding:8px}
tr:last-child td{border-bottom:none}
.rank{color:var(--text-dim); width:1.8em}
.namecell{display:flex; align-items:center; gap:8px}
.avatar{
  width:26px; height:26px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-family:'Cinzel Decorative',serif; font-size:.72rem; color:#f2e8d3;
}
.streak{color:var(--brass); font-weight:600}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .streak{color:var(--accent)} }

.lbrow{display:flex; justify-content:space-between; font-size:.9rem; padding:6px 0; border-bottom:1px dashed var(--panel-border)}
.lbrow:last-child{border-bottom:none}
.lbrow .rank{display:inline-block}
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="wordmark">Hall of Fame</span>
    <span><a href="/games">Game history</a> &nbsp;·&nbsp; <a href="/stats">Your record</a> &nbsp;·&nbsp; <a href="/characters">Characters</a> &nbsp;·&nbsp; <a href="/">Back to the table</a></span>
  </header>
  <div id="view"></div>
</div>

<script>
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
const fmtPct = x => x == null ? '—' : Math.round(x * 100) + '%';
const initial = name => (name[0] || '?').toUpperCase();

function avatar(name, color) {
  const a = el('div', 'avatar', initial(name));
  a.style.background = color ? color.hex : '#4d5b66';
  return a;
}

/* ------------------------------------------------------------- profiles */

function profileTable(profiles) {
  const panel = el('div', 'panel');
  panel.append(el('h3', null, 'Every profile, ranked'));
  panel.append(el('p', 'small muted', 'Most wins first, then win rate — every table this app has ever kept score for.'));

  const played = profiles.filter(p => p.gamesPlayed > 0);
  if (!played.length) {
    panel.append(el('div', 'empty', 'Nobody’s finished a game yet — this fills in the first time one does.'));
    return panel;
  }

  const ranked = played.slice().sort((a, b) =>
    b.wins - a.wins || (b.winRate || 0) - (a.winRate || 0) || b.gamesPlayed - a.gamesPlayed);

  const table = el('table');
  const head = el('tr');
  ['', 'Name', 'Games', 'Wins', 'Win rate', 'Streak'].forEach(h => head.append(el('th', null, h)));
  table.append(head);
  ranked.forEach((p, i) => {
    const row = el('tr');
    row.append(el('td', 'rank mono', '#' + (i + 1)));
    const nameCell = el('td');
    const wrap = el('div', 'namecell');
    wrap.append(avatar(p.name, p.color), document.createTextNode(p.name));
    nameCell.append(wrap);
    row.append(nameCell);
    row.append(el('td', 'mono', String(p.gamesPlayed)));
    row.append(el('td', 'mono', String(p.wins)));
    row.append(el('td', 'mono', fmtPct(p.winRate)));
    const streakCell = el('td', 'mono');
    if (p.currentWinStreak > 1) {
      streakCell.append(el('span', 'streak', p.currentWinStreak + ' in a row'));
    } else if (p.longestWinStreak > 1) {
      streakCell.textContent = 'best: ' + p.longestWinStreak;
    } else {
      streakCell.textContent = '—';
    }
    row.append(streakCell);
    table.append(row);
  });
  panel.append(table);
  return panel;
}

/* ----------------------------------------------------------- leaderboards */

function leaderboardPanel(title, subtitle, rows, renderRow, emptyText) {
  const panel = el('div', 'panel');
  panel.append(el('h3', null, title));
  if (subtitle) panel.append(el('p', 'small muted', subtitle));
  if (!rows.length) {
    panel.append(el('p', 'small muted', emptyText));
    return panel;
  }
  rows.forEach((row, i) => panel.append(renderRow(row, i)));
  return panel;
}

function lbRow(name, valueText) {
  const line = el('div', 'lbrow');
  const left = el('span');
  left.append(document.createTextNode(name));
  line.append(left, el('span', 'mono', valueText));
  return line;
}

function loadLeaderboards(view) {
  fetch('/api/leaderboard/voting').then(r => r.json()).then(rows => {
    view.append(leaderboardPanel(
      'Best good voters', 'Correct alignment calls — voting yes on evil, no on good (needs at least 5 votes on record).',
      rows,
      (row, i) => {
        const r = lbRow(row.name, fmtPct(row.accuracy) + ` (${row.correctVotes}/${row.totalVotes})`);
        r.firstChild.prepend(el('span', 'rank', '#' + (i + 1)));
        return r;
      },
      'Nobody has cast enough votes yet — this fills in as real games get played.',
    ));
  }).catch(() => {});

  fetch('/api/leaderboard/characters').then(r => r.json()).then(rows => {
    view.append(leaderboardPanel(
      'Character win rates', 'How each character has fared across every recorded game.',
      rows,
      (row, i) => {
        const r = lbRow(row.name, fmtPct(row.winRate) + ` (${row.wins}/${row.total})`);
        r.firstChild.prepend(el('span', 'rank', '#' + (i + 1)));
        return r;
      },
      'No completed games yet.',
    ));
  }).catch(() => {});
}

/* --------------------------------------------------------------- render */

function render() {
  const view = document.getElementById('view');
  view.innerHTML = '';
  fetch('/api/profiles').then(r => r.json()).then(profiles => {
    view.append(profileTable(profiles));
    loadLeaderboards(view);
  }).catch(() => {
    view.append(el('div', 'empty', 'Could not load the Hall of Fame right now.'));
  });
}

render();
</script>
</body>
</html>

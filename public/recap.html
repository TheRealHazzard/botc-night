<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Recap</title>
<meta name="theme-color" content="#f2e8d3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0811" media="(prefers-color-scheme: dark)">
<meta name="description" content="A finished Blood on the Clocktower game, recapped — who won, and how close it got.">
<link rel="icon" href="/icons/icon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:wght@500;600;700&family=Spectral:ital,wght@0,400;0,500;1,400&family=Space+Mono:wght@400;700&display=swap">
<!-- Loaded unconditionally — its tokens (--void/--surface/--line/--bone/
     --brass/...) only ever get CONSUMED below inside the dark-mode
     blocks, so this is a no-op in light mode, but it's what lets this
     page's own --bg/--text/--accent reference the one real source of
     truth (client/src/theme.css) instead of a second hardcoded copy of
     the same hex values tabletop.html/spectate.html also used to carry
     independently. -->
<link rel="stylesheet" href="/clocktower-dark.css">
<style>
:root{
  --ink:#18130f; --ink-2:#241c15; --ink-3:#3a2e22;
  --parchment:#f2e8d3; --parchment-2:#fbf5e6; --parchment-3:#e2d3b3;
  --oxblood:#9a2f35; --oxblood-bright:#c1474d;
  --brass:#b8863f; --brass-bright:#d9a75a;
  --good:#3c5875; --good-bright:#6f93b5; --evil-bright:#d08a86;

  --bg: var(--parchment); --bg-2: var(--parchment-2); --panel-border: var(--parchment-3);
  --text:#2a2015; --text-dim:#6b5f4c; --accent: var(--oxblood); --accent-text:#fff8ef;
  --shadow: 0 2px 10px rgba(30,20,10,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg: var(--void); --bg-2: var(--surface); --panel-border: var(--line);
    --text: var(--bone); --text-dim: var(--bone-dim); --accent: var(--brass); --accent-text:#241a0c;
    --shadow: 0 2px 14px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg: var(--void); --bg-2: var(--surface); --panel-border: var(--line);
  --text: var(--bone); --text-dim: var(--bone-dim); --accent: var(--brass); --accent-text:#241a0c;
  --shadow: 0 2px 14px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
/* Same shape as games.html/hall-of-fame.html/stats.html/characters.html
   (identical .app{max-width} report layout) — centers a short recap
   vertically instead of pinning it to the top, on whatever screen this
   shared link actually gets opened on. html/body get no explicit height
   here (min-height only), so body is always free to grow past the
   viewport and the page scrolls normally once content actually does. */
body{margin:0; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; justify-content:center; background:var(--bg); color:var(--text); font-family:'Spectral',Georgia,serif; font-size:16px; line-height:1.6}
h1,h2{font-family:'Cormorant Garamond',Georgia,serif; font-weight:600; margin:0 0 .3em; text-wrap:balance}
.mono{font-family:'Space Mono',monospace; font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.app{max-width:520px; margin:0 auto; padding:36px 18px 60px}
.eyebrow{font-family:'Space Mono',monospace; font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; color:var(--text-dim)}
.wordmark{font-family:'Cinzel Decorative',serif; font-size:1.1rem; color:var(--accent); margin-top:4px}

.banner{
  margin:24px 0; padding:26px 24px; border-radius:8px; text-align:center;
  background:var(--bg-2); border:1px solid var(--panel-border); box-shadow:var(--shadow);
}
.banner.good{border-color:var(--good)} .banner.evil{border-color:var(--oxblood)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .banner.good{border-color:var(--good-bright)}
  :root:not([data-theme="light"]) .banner.evil{border-color:var(--evil-bright)}
}
.banner .who{font-family:'Cinzel Decorative',serif; font-size:1.7rem; margin-bottom:6px}
.banner.good .who{color:var(--good)} .banner.evil .who{color:var(--oxblood)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .banner.good .who{color:var(--good-bright)}
  :root:not([data-theme="light"]) .banner.evil .who{color:var(--evil-bright)}
}
.banner .reason{color:var(--text-dim)}
.meta{color:var(--text-dim); font-size:.85rem; margin-top:6px}

.panel{background:var(--bg-2); border:1px solid var(--panel-border); border-radius:6px; box-shadow:var(--shadow); padding:22px; margin-bottom:16px}
.panel h2{font-size:.72rem; text-transform:uppercase; letter-spacing:.14em; color:var(--text-dim); margin-bottom:14px}
.narration p{margin:0 0 12px}
.narration p:last-child{margin-bottom:0}

.empty{color:var(--text-dim); text-align:center; padding:60px 4px}
footer{text-align:center; margin-top:28px}
footer a{color:var(--text-dim); font-size:.82rem; text-decoration:underline; text-underline-offset:3px}
.listenbtn{
  display:inline-flex; align-items:center; gap:8px; margin:0 0 16px; padding:9px 16px;
  border-radius:100px; border:1px solid var(--panel-border); background:var(--bg-2);
  color:var(--text); font-family:'Space Mono',monospace; font-size:.78rem; cursor:pointer;
}
.listenbtn:hover{border-color:var(--accent)}
.listenbtn.playing{color:var(--accent); border-color:var(--accent)}
</style>
</head>
<body>
<div class="app" id="view">
  <div class="empty">Loading the recap…</div>
</div>

<script>
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
const EDITION_NAMES = { tb: 'Trouble Brewing', bmr: 'Bad Moon Rising', sv: 'Sects & Violets', custom: 'a custom script' };

function fmtDate(ms) {
  const d = new Date(ms);
  return d.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });
}

function render(recap) {
  const view = document.getElementById('view');
  view.innerHTML = '';

  const head = el('div');
  head.append(el('div', 'eyebrow', 'botc-night · game recap'));
  head.append(el('div', 'wordmark', 'Blood on the Clocktower'));
  view.append(head);

  const banner = el('div', 'banner ' + (recap.winner === 'good' ? 'good' : 'evil'));
  banner.append(el('div', 'who', recap.winner === 'good' ? 'Good wins' : 'Evil wins'));
  if (recap.reason) banner.append(el('div', 'reason', recap.reason));
  const edition = EDITION_NAMES[recap.edition] || recap.edition;
  banner.append(el('div', 'meta', `${recap.playerCount} players · ${edition} · ${fmtDate(recap.endedAt)}`));
  view.append(banner);

  // A human Storyteller never produces a replayable recap of their own
  // session — this is one botc-night can, built from the exact same
  // narration this page already renders as text, just read aloud instead
  // (or in addition). Feature-detected, same as useSpeak's own speech.js —
  // this is a static page with no bundler, so the handful of lines of
  // Web Speech API calls are duplicated here rather than shared with it.
  if ('speechSynthesis' in window) {
    const listenBtn = el('button', 'listenbtn');
    listenBtn.type = 'button';
    listenBtn.textContent = '▶ Listen to the recap';
    listenBtn.addEventListener('click', () => toggleListen(recap, listenBtn));
    view.append(listenBtn);
  }

  if (recap.narration.length) {
    const panel = el('div', 'panel');
    panel.append(el('h2', null, 'How it went'));
    const narration = el('div', 'narration');
    recap.narration.forEach(line => narration.append(el('p', null, line)));
    panel.append(narration);
    view.append(panel);
  }

  const foot = el('footer');
  foot.append(el('span', null, 'Recapped by botc-night, an AI Storyteller for Blood on the Clocktower.'));
  view.append(foot);
}

let speaking = false;
function toggleListen(recap, btn) {
  if (speaking) {
    window.speechSynthesis.cancel();
    speaking = false;
    btn.classList.remove('playing');
    btn.textContent = '▶ Listen to the recap';
    return;
  }

  const lines = [recap.winner === 'good' ? 'Good wins.' : recap.winner === 'evil' ? 'Evil wins.' : 'The game ended.'];
  if (recap.reason) lines.push(recap.reason);
  (recap.narration || []).forEach(line => lines.push(line));

  speaking = true;
  btn.classList.add('playing');
  btn.textContent = '■ Stop';
  window.speechSynthesis.cancel();
  // Queued, not concatenated into one utterance — speechSynthesis plays
  // several queued utterances back to back on its own, and queuing keeps
  // each sentence's own pacing intact rather than one long run-on line.
  lines.forEach((line, i) => {
    const u = new SpeechSynthesisUtterance(line);
    u.rate = 0.84;
    u.pitch = 0.55;
    if (i === lines.length - 1) {
      u.onend = () => {
        speaking = false;
        btn.classList.remove('playing');
        btn.textContent = '▶ Listen to the recap';
      };
    }
    window.speechSynthesis.speak(u);
  });
}

const id = new URLSearchParams(location.search).get('id');
if (!id) {
  document.getElementById('view').innerHTML = '';
  document.getElementById('view').append(el('div', 'empty', 'No game to show — this page needs a real recap link.'));
} else {
  fetch('/api/recap?id=' + encodeURIComponent(id))
    .then(r => r.json())
    .then(r => {
      if (r.error) {
        document.getElementById('view').innerHTML = '';
        document.getElementById('view').append(el('div', 'empty', 'That recap link isn’t valid anymore.'));
        return;
      }
      render(r);
    })
    .catch(() => {
      document.getElementById('view').innerHTML = '';
      document.getElementById('view').append(el('div', 'empty', 'Could not load this recap right now.'));
    });
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spectate</title>
<meta name="theme-color" content="#0d0811">
<meta name="description" content="Follow a live game of Blood on the Clocktower through the narrator's own voice, without a seat of your own.">
<link rel="icon" href="/icons/icon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:wght@500;600;700&family=Spectral:ital,wght@0,400;0,500;1,400&family=Space+Mono:wght@400;700&display=swap">
<!-- Shared with tabletop.html — see clocktower-dark.css's own comment. -->
<link rel="stylesheet" href="/clocktower-dark.css">
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; min-height:100dvh; background:var(--void); color:var(--bone);
  font-family:'Spectral',Georgia,serif; font-size:16px; line-height:1.6;
  background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScxMjAnIGhlaWdodD0nMTIwJz48ZmlsdGVyIGlkPSduJz48ZmVUdXJidWxlbmNlIHR5cGU9J2ZyYWN0YWxOb2lzZScgYmFzZUZyZXF1ZW5jeT0nMC44NScgbnVtT2N0YXZlcz0nMicgc3RpdGNoVGlsZXM9J3N0aXRjaCcvPjxmZUNvbG9yTWF0cml4IHR5cGU9J3NhdHVyYXRlJyB2YWx1ZXM9JzAnLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0nMTAwJScgaGVpZ2h0PScxMDAlJyBmaWx0ZXI9J3VybCgjbiknIG9wYWNpdHk9JzAuMDUnLz48L3N2Zz4=");
  background-repeat: repeat;
}
.app{max-width:560px; margin:0 auto; padding:28px 18px 60px}
.eyebrow{font-family:'Space Mono',monospace; font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; color:var(--bone-dim)}
.wordmark{font-family:'Cinzel Decorative',serif; font-size:1.05rem; color:var(--brass); margin-top:3px}

.statusbar{
  display:flex; align-items:baseline; justify-content:space-between; gap:10px;
  margin:20px 0 6px; padding-bottom:10px; border-bottom:1px solid var(--line);
}
.statusbar .phase{font-family:'Cormorant Garamond',Georgia,serif; font-weight:700; font-size:1.3rem}
.statusbar .alive{font-family:'Space Mono',monospace; font-size:.8rem; color:var(--bone-dim)}

.now{
  background:var(--surface); border:1px solid var(--line); border-radius:6px;
  padding:12px 14px; margin:14px 0; font-size:.92rem;
}
.now .lbl{font-family:'Space Mono',monospace; font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; color:var(--bone-dim); margin-bottom:4px}

.banner{
  margin:18px 0; padding:22px; border-radius:8px; text-align:center;
  background:var(--surface); border:1px solid var(--line);
  animation: banner-in .5s ease-out;
}
.banner.good{border-color:var(--good)} .banner.evil{border-color:var(--oxblood)}
.banner .who{font-family:'Cinzel Decorative',serif; font-size:1.4rem}
.banner.good .who{color:var(--good-hi)} .banner.evil .who{color:var(--oxblood-hi)}
/* Same flare-then-settle bloom the main dashboard's own end-of-game ring
   glow uses (host/styles.css's ring-verdict-good/evil) — the one real
   "moment" this feed-style page gets, worth more than a plain border swap. */
.banner.good{animation: banner-in .5s ease-out, glow-good 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards}
.banner.evil{animation: banner-in .5s ease-out, glow-evil 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards}
@keyframes banner-in{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
@keyframes glow-good{0%{box-shadow:0 0 0 0 rgba(92,134,171,0)} 45%{box-shadow:0 0 60px 8px rgba(92,134,171,.35)} 100%{box-shadow:0 0 30px 4px rgba(92,134,171,.22)}}
@keyframes glow-evil{0%{box-shadow:0 0 0 0 rgba(142,34,38,0)} 45%{box-shadow:0 0 60px 8px rgba(142,34,38,.35)} 100%{box-shadow:0 0 30px 4px rgba(142,34,38,.22)}}
@media (prefers-reduced-motion: reduce){
  .banner, .banner.good, .banner.evil{animation:none}
  .banner.good{box-shadow:0 0 30px 4px rgba(92,134,171,.22)}
  .banner.evil{box-shadow:0 0 30px 4px rgba(142,34,38,.22)}
}

.feed{margin-top:18px}
.daymark{
  font-family:'Space Mono',monospace; font-size:.7rem; letter-spacing:.12em; text-transform:uppercase;
  color:var(--bone-dim); margin:22px 0 8px; padding-top:14px; border-top:1px dashed var(--line);
}
.feed-line{margin:0 0 10px; animation:fadein .4s ease-out}
@keyframes fadein{from{opacity:0; transform:translateY(3px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion: reduce){ .feed-line{animation:none} }
.empty{color:var(--bone-dim); text-align:center; padding:60px 4px}
footer{text-align:center; margin-top:28px; color:var(--bone-dim); font-size:.82rem}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="eyebrow">botc-night &middot; spectating</div>
  <div class="wordmark">Blood on the Clocktower</div>
  <div id="view"><div class="empty">Connecting&hellip;</div></div>
</div>

<script>
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };

function phaseLabel(S) {
  if (S.phase === 'lobby') return 'In the lobby';
  if (S.phase === 'reveal') return 'Roles revealed';
  if (S.phase === 'night') return `Night ${S.nightNumber}`;
  if (S.phase === 'day') return `Day ${S.nightNumber}`;
  if (S.phase === 'over') return 'Game over';
  return S.phase;
}

// Nothing in g.log carries a "day/night" boundary marker of its own — this
// infers one from each entry's own {night, phase} the same way
// GameHistoryOverlay.jsx's timeline already groups by, so a fresh viewer
// can tell nights and days apart scrolling back through the feed.
function dayMarkFor(entry) {
  return entry.phase === 'night' ? `Night ${entry.night}` : `Day ${entry.night}`;
}

let renderedCount = 0;
let lastDayMark = null;

function renderNew(S) {
  const feed = document.getElementById('feed');
  const log = S.log || [];
  for (let i = renderedCount; i < log.length; i++) {
    const entry = log[i];
    const mark = dayMarkFor(entry);
    if (mark !== lastDayMark) {
      feed.append(el('div', 'daymark', mark));
      lastDayMark = mark;
    }
    feed.append(el('p', 'feed-line', entry.text));
  }
  renderedCount = log.length;
  if (log.length) feed.lastChild.scrollIntoView({ block: 'nearest' });
}

// The one genuinely live thing that ISN'T already in the log feed below —
// every claim and every executed/blocked outcome gets its own logEvent()
// call already (recordClaim, recordExecution, ...), so echoing them here
// too would just show the same line twice. An open nomination has no log
// entry at all until it actually closes, so this is the only gap worth a
// "right now" box for.
function renderNow(S) {
  const nowBox = document.getElementById('nowbox');
  nowBox.innerHTML = '';
  if (S.phase !== 'day') return;
  const open = (S.nominations || []).find(n => n.day === S.nightNumber && !n.closed);
  if (!open) return;
  nowBox.append(el('div', 'lbl', 'Right now'));
  nowBox.append(el('div', null, `${open.nominatorName} has nominated ${open.nomineeName}. Voting is open.`));
}

function ensureSkeleton() {
  if (document.getElementById('feed')) return;
  const view = document.getElementById('view');
  view.innerHTML = '';
  // Built once; render() below only ever updates these two spans'
  // textContent afterward, never rebuilds the skeleton around them.
  const bar = el('div', 'statusbar');
  bar.append(el('span', 'phase', ''));
  bar.append(el('span', 'alive', ''));
  view.append(bar);
  const nowBox = el('div', 'now');
  nowBox.id = 'nowbox';
  view.append(nowBox);
  const bannerSlot = el('div');
  bannerSlot.id = 'bannerslot';
  view.append(bannerSlot);
  const feed = el('div', 'feed');
  feed.id = 'feed';
  view.append(feed);
}

function render(S) {
  if (!S) return;
  ensureSkeleton();
  const view = document.getElementById('view');
  view.querySelector('.statusbar .phase').textContent = phaseLabel(S);
  const alive = (S.players || []).filter(p => p.alive).length;
  view.querySelector('.statusbar .alive').textContent = `${alive} of ${(S.players || []).length} alive`;

  const bannerSlot = document.getElementById('bannerslot');
  bannerSlot.innerHTML = '';
  if ((S.phase === 'over' || S.revealed) && S.victory) {
    const banner = el('div', 'banner ' + (S.victory.winner === 'good' ? 'good' : 'evil'));
    banner.append(el('div', 'who', S.victory.winner === 'good' ? 'Good wins' : 'Evil wins'));
    bannerSlot.append(banner);
  }

  renderNow(S);
  renderNew(S);
}

const es = new EventSource('/spectate-events');
es.onmessage = e => render(JSON.parse(e.data));
// Read-only, best-effort page — EventSource reconnects on its own on a
// drop, same spirit as tabletop.html's own (lack of) a polling fallback.
</script>
</body>
</html>

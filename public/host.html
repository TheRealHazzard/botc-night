/** Tonight's own mini-leaderboard, fetched once — self-removing if there's
    only this one game so far, since it has nothing to compare against yet. */
function sessionStatsCard() {
  const card = sidepanelCard('trend', 'Tonight');
  fetch('/api/session/current').then(r => r.json()).then(s => {
    if (!s.gamesPlayed || s.gamesPlayed <= 1) { card.remove(); return; }
    const rows = el('div', 'dayreport-rows');
    [
      ['Games played', s.gamesPlayed],
      ['Good wins', s.goodWins],
      ['Evil wins', s.evilWins],
    ].forEach(([lbl, val]) => {
      const stat = el('div', 'stat');
      stat.append(el('div', 'stat-n mono', String(val)), el('div', 'stat-lbl', lbl));
      rows.append(stat);
    });
    card.append(rows);

    if (s.players.length) {
      const list = el('div', 'rosterlist');
      s.players.slice(0, 6).forEach(p => {
        const row = el('div', 'rosterrow');
        const top = el('div', 'rosterrow-top');
        top.append(el('strong', null, p.name), el('span', 'rosterrole', `${p.wins}W / ${p.gamesPlayed}`));
        row.append(top);
        list.append(row);
      });
      card.append(list);
    }
  }).catch(() => card.remove());
  return card;
}

/** An <img> for this character's token, falling back to a plain circle
    (too small at power-log scale for a readable initial) if the art is
    missing or fails to load. */
function tokenOrFallback(characterId, imgClass, fallbackClass) {
  const src = TOKENS[characterId];
  if (src) {
    const img = document.createElement('img');
    img.className = imgClass;
    img.src = src;
    img.alt = '';
    img.onerror = () => img.replaceWith(el('div', fallbackClass));
    return img;
  }
  return el('div', fallbackClass);
}

/** Every real "choose a player" moment of the whole game, one row per
    character, one column per night/day — a full-screen lightbox rather
    than a sidepanel card, since a long game with a full table makes for a
    genuinely wide/tall grid that needs its own scrollable space instead of
    competing with the fixed-height dashboard for room. Both the acting
    role and every target get their actual token art, not just a name —
    text alone was hard to scan at a glance. */
function powerLogOverlay() {
  const overlay = el('div', 'powerlog-overlay');

  const header = el('div', 'powerlog-header');
  header.append(el('h2', null, 'Power log'));
  const close = withIcon(el('button', 'ghostbtn', 'Close'), 'close');
  close.onclick = () => overlay.remove();
  header.append(close);
  overlay.append(header);

  const body = el('div', 'powerlog-body');
  const table = el('table', 'powerlog-table');

  const nights = [];
  for (let n = 1; n <= S.nightNumber; n++) nights.push(n);

  const headRow = el('tr');
  headRow.append(el('th', null, 'Role'));
  nights.forEach(n => headRow.append(el('th', null, `Night ${n}`), el('th', null, `Day ${n}`)));
  table.append(headRow);

  const playersByName = {};
  S.players.forEach(p => { playersByName[p.name] = p; });

  S.players.forEach(p => {
    const row = el('tr');
    const label = el('td');
    const roleCell = el('div', 'powerlog-role-cell');
    roleCell.append(tokenOrFallback(p.characterId, 'powerlog-token', 'powerlog-token-fallback'));
    const text = el('div');
    text.append(el('span', 'powerlog-role', p.character || 'Unknown'), el('span', 'powerlog-name', p.name));
    roleCell.append(text);
    label.append(roleCell);
    row.append(label);

    nights.forEach(n => {
      ['night', 'day'].forEach(phase => {
        const entries = S.actionLog.filter(a => a.playerId === p.id && a.night === n && a.phase === phase);
        const cell = el('td', entries.length ? 'used' : 'empty');
        if (entries.length) {
          entries.forEach((e, ei) => {
            if (ei > 0) cell.append(document.createTextNode('; '));
            e.targets.forEach((name, ti) => {
              if (ti > 0) cell.append(document.createTextNode(' & '));
              const targetPlayer = playersByName[name];
              const chip = el('span', 'powerlog-target');
              chip.append(
                tokenOrFallback(targetPlayer && targetPlayer.characterId, 'powerlog-target-token', 'powerlog-target-token-fallback'),
                document.createTextNode(name),
              );
              cell.append(chip);
            });
          });
        } else {
          cell.textContent = '—';
        }
        row.append(cell);
      });
    });
    table.append(row);
  });

  body.append(table);
  overlay.append(body);
  document.body.append(overlay);
}

/* The host still declares who nominated whom — that part stays a live,
   spoken thing at the table. Voting itself now happens on each player's own
   phone over a timed window; this panel just shows the shared read of the
   room (the live tally) while that's running, same as everyone watching
   hands go up together. */
function nominationPanel() {
  const box = el('div', 'nompanel');
  const title = el('div', 'dayreport-title');
  title.append(wrapIcon('hand', 14), el('span', null, 'Nominations'));
  box.append(title);

  const todays = S.nominations.filter(n => n.day === S.nightNumber);
  if (todays.length) {
    const list = el('div', 'nomlist');
    todays.forEach(n => {
      const yesCount = n.closed ? n.yesCount : n.votes.filter(v => v.vote === 'yes').length;
      const status = n.closed ? `${yesCount} yes` : 'voting…';
      const line = el('div', 'nomline');
      if (n.virginFired) line.append(wrapIcon('bolt', 13));
      line.append(el('span', null, `${n.nominatorName} → ${n.nomineeName} — ${status}` + (n.virginFired ? '  —  Virgin fired, nominator executed' : '')));
      list.append(line);
    });
    box.append(list);
  }

  const openNom = todays.find(n => !n.closed);
  if (openNom) {
    const eligible = S.players.filter(p => p.alive || !p.ghostVoteUsed).length;
    const yes = openNom.votes.filter(v => v.vote === 'yes').length;
    const no = openNom.votes.length - yes;
    // The real rule an execution needs: a majority of the LIVING (not of
    // whoever still has an unused ghost vote to cast) — same threshold
    // engine.js's own close-of-vote majority check uses.
    const threshold = Math.max(1, Math.floor(S.players.filter(p => p.alive).length / 2) + 1);
    box.append(countdown(openNom.windowEndsAt, S.config.voteWindowSeconds));
    box.append(voteBar(yes, threshold));
    box.append(el('div', 'sub', `${no} no · ${eligible - openNom.votes.length} not yet voted`));
    return box;
  }

  const living = S.players.filter(p => p.alive);
  if (living.length < 2) { box.append(el('p', 'sub', 'Need at least two living players.')); return box; }

  const nominatorSel = el('select');
  const nomineeSel = el('select');
  living.forEach(p => { nominatorSel.append(new Option(p.name, p.id)); nomineeSel.append(new Option(p.name, p.id)); });
  const row = el('div', 'nomrow');
  row.append(nominatorSel, wrapIcon('arrows', 16), nomineeSel);
  box.append(row);

  const submit = withIcon(el('button', null, 'Open for voting'), 'check');
  submit.onclick = () => {
    post('/api/table/nominate', { nominatorId: nominatorSel.value, nomineeId: nomineeSel.value }).then(r => {
      if (r.error) { alert(r.error); return; }
      if (r.virginFired) alert('The Virgin was nominated by a Townsfolk — the nominator is executed immediately.');
    });
  };
  box.append(submit);
  return box;
}

function voteBar(yes, threshold) {
  const met = yes >= threshold;
  const wrap = el('div', 'votebar');
  const track = el('div', 'votebar-track');
  const fill = el('div', 'votebar-fill' + (met ? ' met' : ''));
  fill.style.width = Math.min(100, (yes / threshold) * 100) + '%';
  track.append(fill);
  wrap.append(track, el('div', 'votebar-label', `${yes} / ${threshold} needed to execute`));
  return wrap;
}

function countdown(windowEndsAt, total) {
  if (!windowEndsAt) return null;
  total = total || 1;
  const left = Math.max(0, Math.ceil((windowEndsAt - Date.now()) / 1000));
  const frac = Math.max(0, Math.min(1, left / total));
  const urgent = left <= 10;

  // A fixed viewBox with the actual rendered size left to CSS (100% of
  // whatever box this lands in) — needed so this can shrink to fit inside
  // the seating ring instead of forcing its own fixed pixel footprint.
  const size = 200, stroke = 10, r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const wrap = el('div', 'clockwrap');
  wrap.innerHTML =
    `<svg viewBox="0 0 ${size} ${size}" class="ring-svg${urgent ? ' urgent' : ''}">
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}"/>
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="currentColor" stroke-width="${stroke}"
        stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - frac)).toFixed(1)}"
        transform="rotate(-90 ${size / 2} ${size / 2})"/>
    </svg>`;
  wrap.append(el('div', 'clock' + (urgent ? ' urgent' : ''), String(left)));
  return wrap;
}

/* Renders are debounced through a brief fade whenever the phase itself
   changes, so dusk-to-night reads as a ritual rather than a page reload.
   A countdown re-render each second is not a phase change and skips this. */
/* Not gated by the phase-fade debounce below — a reconnect request can land
   mid-night and someone needs to see it immediately, not after the next
   phase change. */
function renderReclaimBanner() {
  const box = document.getElementById('reclaimBanner');
  box.innerHTML = '';
  (S.pendingReclaims || []).forEach(r => {
    const row = el('div', 'reclaim');
    const ask = el('span', 'ask');
    ask.append(wrapIcon('users', 15), el('span', null, `A new device wants to reconnect as ${r.name}.`));
    row.append(ask);
    const btns = el('div', 'btns');
    const approve = withIcon(el('button', 'primary', 'Approve'), 'check');
    approve.onclick = () => post('/api/table/reclaim/approve', { requestId: r.requestId });
    const deny = el('button', null, 'Deny');
    deny.onclick = () => post('/api/table/reclaim/deny', { requestId: r.requestId });
    btns.append(approve, deny);
    row.append(btns);
    box.append(row);
  });
}

let lastScriptFetched = null;
function syncScriptChars() {
  if (S.script === lastScriptFetched) return;
  lastScriptFetched = S.script;
  SCRIPT_CHARS = null;
  fetch('/api/script').then(r => r.json()).then(data => {
    if (data.edition !== S.script) return; // stale response for a script we've since left
    SCRIPT_CHARS = data.characters;
    render();
  }).catch(() => {});
}

/** A handful of game endings are dramatic enough to earn a beat of their
    own before the usual reveal fades in, in place of the plain phase fade —
    the sequencing check in render() below guarantees this only ever fires
    once for a given ending, the same instant that ending is first seen.
    Checked in priority order: the Slayer's shot is the one ending that's a
    single public, named action rather than a night/day's worth of build-up,
    so it comes first; the Evil Twin's and Vortox's win conditions are
    twists specific enough to name outright; anything else that ended the
    game via an execution or a night kill still gets the same beat, just
    narrated more plainly. Returns null for endings with no fresh single
    moment to point at (e.g. a Mastermind bonus day that simply expired). */
function pickFatalBlow(state) {
  const lastDeath = state.deaths[state.deaths.length - 1];
  const reason = state.victory && state.victory.reason;
  if (lastDeath && lastDeath.cause === 'slayer') {
    return { icon: 'crosshair', text: `${lastDeath.name} falls.` };
  }
  if (reason === "The Evil Twin's twin was executed.") {
    return { icon: 'eye', text: lastDeath ? `${lastDeath.name} was the Evil Twin's twin all along.` : reason };
  }
  if (reason === 'No one was executed, and the Vortox lives.') {
    return { icon: 'bolt', text: 'Every read was false. The Vortox wins.' };
  }
  if (lastDeath && lastDeath.cause === 'execution') {
    return { icon: 'scroll', text: `${lastDeath.name} is executed.` };
  }
  const nightKillCauses = ['demon', 'minion', 'gossip', 'gambler', 'tinker', 'grandmother-link', 'fanggu-transform'];
  if (lastDeath && nightKillCauses.includes(lastDeath.cause)) {
    return { icon: 'moon', text: `The night claims ${lastDeath.name}.` };
  }
  return null;
}
function playFatalBlow(blow, onDone) {
  const overlay = el('div', 'fatal-flash');
  overlay.append(wrapIcon(blow.icon, 88), el('div', 'fatal-flash-text', blow.text));
  document.body.append(overlay);
  requestAnimationFrame(() => overlay.classList.add('show'));
  setTimeout(() => {
    overlay.classList.remove('show');
    setTimeout(() => { overlay.remove(); onDone(); }, 380);
  }, 2200);
}

let lastPhaseKey = '';
function render() {
  if (!S) return;
  syncScriptChars();
  renderReclaimBanner();
  const stage = document.getElementById('stage');
  const controls = document.getElementById('controls');
  const key = `${S.phase}:${S.nightNumber}:${S.wave}`;
  const changed = key !== lastPhaseKey;
  lastPhaseKey = key;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (changed && S.phase === 'over' && !reduceMotion) {
    const blow = pickFatalBlow(S);
    if (blow) {
      playImpactSting();
      playFatalBlow(blow, () => {
        renderNow();
        if (S.victory) playVictory(S.victory.winner);
      });
      return;
    }
  }

  if (changed) {
    if (S.phase === 'night') playNightFalls();
    else if (S.phase === 'day') playDayBreaks();
    else if (S.phase === 'over' && S.victory) playVictory(S.victory.winner);
  }

  if (changed && !reduceMotion && stage.childNodes.length) {
    // Same fade, same debounce timing on every phase change — only the
    // duration and filter (set via this class, in the stylesheet) vary by
    // destination phase, so each one reads with its own mood rather than
    // a single neutral crossfade for everything.
    const transKind =
      S.phase === 'night' ? 'dusk' : S.phase === 'day' ? 'dawn'
      : S.phase === 'over' ? 'over' : S.phase === 'reveal' ? 'reveal' : 'plain';
    const transMs = { dusk: 460, dawn: 280, over: 560, reveal: 300, plain: 380 }[transKind];
    stage.classList.add('fading', 'trans-' + transKind);
    controls.classList.add('fading', 'trans-' + transKind);
    setTimeout(() => {
      renderNow();
      stage.classList.remove('fading', 'trans-' + transKind);
      controls.classList.remove('fading', 'trans-' + transKind);
    }, transMs);
  } else {
    renderNow();
  }
}

function renderNow() {
  const stage = document.getElementById('stage');
  const controls = document.getElementById('controls');
  stage.innerHTML = '';
  controls.innerHTML = '';

  // The room's own color read shifts to match who actually won, once the
  // game is over — good tilts the whole screen blue, evil stays (and
  // sharpens) the oxblood it's had all along. Reverts the moment a new
  // game starts, since nothing sets it outside this one condition.
  const root = document.documentElement;
  if (S.phase === 'over' && S.victory) {
    root.style.setProperty('--primary', S.victory.winner === 'good' ? 'var(--good)' : 'var(--oxblood-hi)');
    root.style.setProperty('--primary-hi', S.victory.winner === 'good' ? 'var(--good-hi)' : '#c23438');
  } else {
    root.style.removeProperty('--primary');
    root.style.removeProperty('--primary-hi');
  }

  const brandIcon = document.getElementById('brandIcon');
  if (!brandIcon.children.length) brandIcon.append(wrapIcon('brandmark', 22));

  const phaseEl = document.getElementById('phase');
  phaseEl.innerHTML = '';
  const phaseLabel =
    S.phase === 'night' ? `Night ${S.nightNumber}${S.wave === 2 ? ' — again' : ''}`
    : S.phase === 'day' ? `Day ${S.nightNumber}`
    : S.phase;
  phaseEl.append(wrapIcon(S.phase === 'night' ? 'moon' : S.phase === 'day' ? 'sun' : 'clock', 14), el('span', null, phaseLabel));

  if (S.phase === 'lobby') {
    stage.append(el('div', 'narration', S.players.length ? 'The town gathers.' : 'The town is still empty.'));

    const columns = el('div', 'lobby-columns');

    const joinwrap = el('div', 'joinwrap');
    if (JOIN_ADDR && typeof QRCodeGen !== 'undefined') {
      const qrBox = el('div', 'joinqr');
      // A URL too long for even the largest version this vendored encoder
      // supports (e.g. an unusually long tunnel hostname) would throw —
      // fall back to the text-only address rather than losing the lobby.
      try { qrBox.append(renderQR(JOIN_ADDR)); joinwrap.append(qrBox); } catch (e) {}
    }
    const joinbar = el('div', 'joinbar');
    const lbl = el('span', 'lbl');
    lbl.append(wrapIcon('users', 16), el('span', null, 'Join at'));
    // Always the server's real LAN address, never derived from this
    // browser's own location — the TV is very often just pointed at
    // localhost, which means nothing on anyone's phone but their own.
    joinbar.append(lbl, el('span', 'joinaddr', JOIN_ADDR || 'finding the address…'));
    joinwrap.append(joinbar);
    columns.append(joinwrap);

    if (SCRIPTS) {
      const activeMeta = SCRIPTS.find(m => m.id === S.script) || SCRIPTS[0];
      if (activeMeta) columns.append(scriptHero(activeMeta));
    } else {
      columns.append(el('div', 'sub', 'Loading scripts…'));
    }
    stage.append(columns);

    const room = el('div', 'waitingroom');
    const roomTitle = el('div', 'waitingroom-title');
    roomTitle.append(wrapIcon('users', 14), el('span', null, `${S.players.length} seated`));
    room.append(roomTitle);
    if (S.players.length) room.append(ringSeats(S.players));
    else room.append(el('div', 'sub', 'Open that address on your phone to take a seat.'));
    stage.append(room);

    const SCRIPT_NAMES = {};
    (SCRIPTS || []).forEach(m => { SCRIPT_NAMES[m.id] = m.name; });
    const deal = withIcon(el('button', 'primary', `Deal ${SCRIPT_NAMES[S.script] || S.script} to ${S.players.length}`), 'moon');
    deal.disabled = S.players.length < 5;
    deal.onclick = () => post('/api/table/deal').then(r => r.error && alert(r.error));
    controls.append(deal);

    const clearLobby = withIcon(el('button', 'ghostbtn', 'Clear the lobby'), 'close');
    clearLobby.disabled = !S.players.length;
    clearLobby.onclick = () => confirm(`Remove all ${S.players.length} seated player${S.players.length === 1 ? '' : 's'} and start the count over?`) &&
      post('/api/table/clear-lobby').then(r => r.error && alert(r.error));
    controls.append(clearLobby);

    const history = withIcon(el('button', 'ghostbtn', 'Game history'), 'scroll');
    history.onclick = () => window.open('/games', '_blank');
    controls.append(history);
  }

  if (S.phase === 'reveal') {
    speak('Look at your hands. Learn what you are.', { dread: true });

    const main = el('div', 'stage-main');
    main.append(
      el('div', 'narration dread', 'Look at your hands.'),
      el('div', 'sub', 'Each of you now knows only yourself. No one in this room knows the rest.'),
      ringSeats(S.players),
    );

    const left = el('div', 'sidepanel');
    left.append(scriptRosterCard());

    const right = el('div', 'sidepanel');
    right.append(controlPanelRow());
    const go = withIcon(el('button', 'primary', 'Night falls'), 'moon');
    go.onclick = () => post('/api/table/night');
    const actions = el('div', 'sidepanel-actions');
    actions.append(go);
    right.append(actions);

    stage.append(dashboardLayout({ left, main, right }));
  }

  if (S.phase === 'night') {
    const line = S.wave === 2
      ? 'Something is not finished.'
      : 'Close your eyes. The town sleeps.';
    speak(line, { dread: S.wave === 2 });
    const acted = S.players.filter(p => p.submitted).length;
    const living = S.players.filter(p => p.alive).length;

    const main = el('div', 'stage-main');
    main.append(
      dayCounterLabel(`Night ${S.nightNumber}${S.wave === 2 ? ' — again' : ''}`),
      el('div', 'narration dread', line),
      ringSeats(S.players),
    );
    const nightTrivia = triviaLine();
    if (nightTrivia) main.append(nightTrivia);

    const left = el('div', 'sidepanel');
    left.append(scriptRosterCard());

    const right = el('div', 'sidepanel');
    right.append(controlPanelRow());
    const timerCard = sidepanelCard('clock', S.wave === 2 ? 'Second window' : 'Night window');
    const timer = countdown(S.windowEndsAt, S.wave === 2 ? S.config.wave2Seconds : S.config.windowSeconds);
    if (timer) { timer.classList.add('timerbox'); timerCard.append(timer); }
    timerCard.append(el('div', 'sub', `${acted} of ${living} have answered.`));
    right.append(timerCard);

    stage.append(dashboardLayout({ left, main, right }));
  }

  if (S.phase === 'day') {
    const lastNight = S.deaths.filter(d => d.night === S.nightNumber && d.cause !== 'execution');
    const line = lastNight.length
      ? `${lastNight.map(d => d.name).join(' and ')} did not wake.`
      : 'Everyone wakes. That should worry you.';
    speak(line, { dread: !!lastNight.length });

    const main = el('div', 'stage-main');
    main.append(dayCounterLabel(`Day ${S.nightNumber}`), el('div', 'narration', 'Dawn.'));
    const deathsLine = el('div', 'deaths');
    if (lastNight.length) deathsLine.append(wrapIcon('skull', 18));
    deathsLine.append(el('span', null, line));
    main.append(deathsLine);

    if (S.mastermindExtraDay) {
      const h = el('div', 'hint');
      h.append(wrapIcon('bolt', 16), el('span', null, 'The Demon has fallen — but the Mastermind\'s power lingers. Play one more day. If a good player is executed now, evil wins. If evil is, good does.'));
      main.append(h);
    }
    // The Storyteller hint used to render here — pulled for now, since a
    // long one could push the ring itself out of the viewport. Revisiting
    // with a layout that can't do that (a fixed-height slot, a toast,
    // something outside the flex column the ring lives in) rather than
    // just shrinking the text and hoping.
    main.append(ringSeats(S.players));

    const anyOpen = voteIsOpen();
    // Only worth killing time over while there's actually a wait — the rest
    // of the day is nominations and talk, not idle hands on phones.
    if (anyOpen) {
      const dayTrivia = triviaLine();
      if (dayTrivia) main.append(dayTrivia);
    }

    // The left panel is reference-only now (the script's own roster) — every
    // interactive thing, nominations included, lives on the right with the
    // rest of the controls, instead of splitting the day's actions in half.
    const left = el('div', 'sidepanel');
    left.append(scriptRosterCard());

    const right = el('div', 'sidepanel');
    right.append(controlPanelRow(), nominationPanel(), dayReport());

    const actions = el('div', 'sidepanel-actions');
    const tally = withIcon(el('button', 'primary', 'Tally the votes'), 'skull');
    tally.disabled = anyOpen;
    tally.onclick = () => post('/api/table/tally').then(r => r.error && alert(r.error));
    const nightBtn = withIcon(el('button', null, 'Night falls'), 'moon');
    nightBtn.disabled = anyOpen;
    nightBtn.onclick = () => post('/api/table/night');
    actions.append(tally, nightBtn);

    // A quiet correction path, not the primary flow — for when what the
    // phones tallied doesn't match what actually happened in the room.
    const sel = el('select');
    sel.append(new Option('Override: no execution', ''));
    S.players.filter(p => p.alive).forEach(p => sel.append(new Option(p.name, p.id)));
    const override = withIcon(el('button', 'ghostbtn', 'Force this instead'), 'skull');
    override.disabled = anyOpen;
    override.onclick = () => {
      if (confirm('Override the digital tally and manually record who was executed?')) {
        post('/api/table/execute', { playerId: sel.value || null });
      }
    };
    actions.append(sel, override);
    right.append(actions);

    stage.append(dashboardLayout({ left, main, right }));
  }

  if (S.phase === 'over' || S.revealed) {
    stage.innerHTML = '';

    const main = el('div', 'stage-main');
    main.append(el('div', 'narration', 'The truth, then.'));
    if (S.victory) {
      const banner = el('div', 'victory-banner');
      const badge = el('div', 'icon-badge');
      badge.append(wrapIcon(S.victory.winner === 'good' ? 'sun' : 'skull', 24));
      const text = el('div');
      text.append(el('div', 'who', S.victory.winner === 'good' ? 'Good wins' : 'Evil wins'), el('div', null, S.victory.reason));
      banner.append(badge, text);
      main.append(banner);
    }
    // Same ring the table's watched all game — avatars swap for the real
    // token art now that it's revealed, with a shroud over anyone who died.
    main.append(ringSeats(S.players, { revealed: true }));

    const left = el('div', 'sidepanel');
    if (S.gameSummary) left.append(gameSummaryCard(S.gameSummary));
    const logCard = sidepanelCard('scroll', 'What actually happened');
    const log = el('div', 'log');
    S.log.forEach(l => log.append(el('p', null, `Night ${l.night}: ${l.text}`)));
    logCard.append(log);
    left.append(logCard);

    const right = el('div', 'sidepanel');
    right.append(controlPanelRow());
    if (S.actionLog && S.actionLog.length) {
      const powerLogBtn = withIcon(el('button', null, 'Power log'), 'scroll');
      powerLogBtn.onclick = () => powerLogOverlay();
      right.append(powerLogBtn);
    }
    // Only worth a card once there's a second game tonight to compare
    // against — sessionStatsCard() removes itself if there isn't one.
    right.append(sessionStatsCard());
    const rosterCard = sidepanelCard('users', 'Full roster');
    const list = el('div', 'rosterlist');
    S.players.forEach(p => {
      const row = el('div', 'rosterrow');
      if (p.color) row.style.borderLeftColor = p.color.hex;
      const top = el('div', 'rosterrow-top');
      top.append(
        el('strong', p.alive ? null : 'deadname', p.name),
        el('span', 'rosterrole', p.character || 'unknown'),
      );
      const career = el('div', 'career');
      // A game just got written to this name's record — show the updated line.
      fetch('/api/profile?name=' + encodeURIComponent(p.name)).then(r => r.json()).then(r => {
        if (r.found && r.stats && r.stats.gamesPlayed) {
          career.append(wrapIcon('trend', 12), el('span', null, `${r.stats.gamesPlayed} games · ${Math.round((r.stats.winRate || 0) * 100)}% win rate`));
        }
      }).catch(() => {});
      row.append(top, career);
      list.append(row);
    });
    rosterCard.append(list);
    right.append(rosterCard);

    stage.append(dashboardLayout({ left, main, right }));
  }
}

fetch('/api/tokens')
  .then(r => r.json())
  .then(t => { TOKENS = t; render(); })
  .catch(() => {});

fetch('/api/scripts')
  .then(r => r.json())
  .then(s => { SCRIPTS = s; render(); })
  .catch(() => {});

// Whatever address loaded this very page is, by definition, one every
// other device can already reach it by too — true whether that's the LAN
// IP typed in directly, or a tunnel's public hostname (Cloudflare/ngrok/etc)
// for a game hosted online. The one address that's *not* usable elsewhere
// is localhost/127.0.0.1 — the TV's own loopback, meaningless to a phone —
// so that's the only case that still asks the server for the real LAN IP.
if (/^(localhost|127\.0\.0\.1|\[::1\])(:\d+)?$/.test(location.host)) {
  fetch('/api/join-address')
    .then(r => r.json())
    .then(r => { JOIN_ADDR = r.url; render(); })
    .catch(() => {});
} else {
  JOIN_ADDR = location.origin;
}

fetch('/trivia.json')
  .then(r => r.json())
  .then(t => { TRIVIA = t; })
  .catch(() => {});

function pollHostState() {
  fetch('/api/host-state').then(r => r.json()).then(data => { S = data; render(); }).catch(() => {});
}

let hostLiveMessageReceived = false;
const es = new EventSource('/host-events');
es.onmessage = e => { hostLiveMessageReceived = true; S = JSON.parse(e.data); render(); };
// A proxy in front of this server (a tunnel, most likely) can hold this
// connection open without ever delivering anything — the TV would just sit
// on "finding the address…" forever with no sign anything's actually wrong.
setTimeout(() => {
  if (hostLiveMessageReceived) return;
  es.close();
  pollHostState();
  setInterval(pollHostState, 1500);
}, 4000);
// Also covers a day with an open vote — that countdown used to only tick
// forward on an SSE push (someone actually casting a vote), not every
// second, and it's the same redraw the trivia rotation below needs anyway.
setInterval(() => { if (S && (S.phase === 'night' || voteIsOpen())) render(); }, 1000);
// Rerolled independently of the render cycle so it doesn't change every
// time someone casts a vote — only ever while it's actually on screen.
setInterval(() => {
  if (!S || !(S.phase === 'night' || voteIsOpen())) return;
  triviaFact = null;
  render();
}, 14000);
</script>
</body>
</html>

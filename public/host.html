<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Clocktower Wakes</title>
<meta name="theme-color" content="#0a0806">
<link rel="icon" href="/icons/icon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:wght@400;600;700&family=Spectral:ital,wght@0,400;0,500;1,400&family=Space+Mono:wght@700&display=swap">
<style>
:root{
  --void:#0a0806;
  --ash:#151009;
  --smoke:#241b12;
  --bone:#e8dcc4;
  --bone-dim:#95886e;
  --bone-faint:#5f5645;
  --oxblood:#8e2226;
  --oxblood-hi:#a92c2f;
  --ember:#c4553a;
  --brass:#b8863f;
  --good:#5c86ab;
  --good-hi:#7aa0c2;
  --surface:#130e08;
  --surface-2:#1b130a;
  --line:#2a1e14;
  --line-soft:#20170e;
  /* The brand/accent color, everywhere except semantic uses (danger,
     death, urgency) that must stay oxblood regardless of who's winning.
     Set inline once a game ends, so the room's own color read shifts with
     the result — cleared back to this default the moment a new game starts. */
  --primary: var(--oxblood);
  --primary-hi: var(--oxblood-hi);
}
*{box-sizing:border-box}
html,body{height:100%; overflow:hidden}
body{
  margin:0; height:100vh; height:100dvh; background:var(--void); color:var(--bone);
  font-family:'Spectral',Georgia,serif;
  display:flex; flex-direction:column;
  /* A soft grain instead of the old radial vignette — a smooth multi-stop
     gradient over this much dark area is exactly the case TV panels band
     on. A small repeating noise tile reads as aged parchment/candlelit
     texture instead, and has no smooth transition left to band. */
  background-image:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScxMjAnIGhlaWdodD0nMTIwJz48ZmlsdGVyIGlkPSduJz48ZmVUdXJidWxlbmNlIHR5cGU9J2ZyYWN0YWxOb2lzZScgYmFzZUZyZXF1ZW5jeT0nMC44NScgbnVtT2N0YXZlcz0nMicgc3RpdGNoVGlsZXM9J3N0aXRjaCcvPjxmZUNvbG9yTWF0cml4IHR5cGU9J3NhdHVyYXRlJyB2YWx1ZXM9JzAnLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0nMTAwJScgaGVpZ2h0PScxMDAlJyBmaWx0ZXI9J3VybCgjbiknIG9wYWNpdHk9JzAuMDUnLz48L3N2Zz4=");
  background-repeat:repeat;
}
.mono{font-family:'Space Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums}

/* ---------------------------------------------------------------- icons */
.icon{width:1em; height:1em; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; vertical-align:-.15em}

/* --------------------------------------------------------------- header */
header{
  flex:0 0 auto;
  display:flex; align-items:center; justify-content:space-between; gap:20px;
  padding:14px 40px; border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:11px}
.brand .icon{width:24px; height:24px; color:var(--primary)}
.mark{font-family:'Cinzel Decorative',Georgia,serif; font-size:1.2rem; color:var(--primary); letter-spacing:.05em}
.phase{
  display:flex; align-items:center; gap:9px;
  font-size:.72rem; text-transform:uppercase; letter-spacing:.2em; color:var(--bone-dim);
  border:1px solid var(--line); border-radius:999px; padding:8px 18px 8px 14px;
}
.phase .icon{width:15px; height:15px; color:var(--brass)}
.header-right{display:flex; align-items:center; gap:14px}
.mutebtn{
  width:auto; margin:0; padding:7px; background:transparent; border:1px solid transparent;
  border-radius:999px; color:var(--bone-dim);
}
.mutebtn:hover:not(:disabled){background:var(--surface); border-color:var(--line); color:var(--bone)}
.mutebtn .icon{width:17px; height:17px}
.mutebtn.on{color:var(--brass)}

main{
  flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:20px 40px; text-align:center; gap:16px; width:100%; overflow:hidden;
}
/* No cap here on purpose — a TV screen's whole width is real estate the
   dashboard below should actually use (its own side columns pin themselves
   to the edges and the ring fills whatever's left), not a fixed column
   floating centered in a sea of unused black. */
.view{width:100%; min-height:0; display:flex; flex-direction:column; align-items:center; gap:16px}
/* The phase fade shares one mechanism (opacity + filter, debounced from
   render() by the same setTimeout pattern) across every phase change, but
   each destination phase tunes duration/filter to its own mood — dawn
   quick and warm, dusk a little slower and dipping dark, the game's end
   heavier still, a fresh reveal a bright quick flash. Plain opacity-only
   for anything else (e.g. into the lobby). */
#stage, #controls{transition-property:opacity, filter; transition-duration:.38s; transition-timing-function:ease}
#stage.fading, #controls.fading{opacity:0}
#stage.trans-dawn.fading, #controls.trans-dawn.fading{transition-duration:.28s; filter:brightness(1.18) saturate(1.08)}
#stage.trans-dusk.fading, #controls.trans-dusk.fading{transition-duration:.46s; filter:brightness(.5)}
#stage.trans-over.fading, #controls.trans-over.fading{transition-duration:.56s; filter:brightness(.32) saturate(.75)}
#stage.trans-reveal.fading, #controls.trans-reveal.fading{transition-duration:.3s; filter:brightness(1.3)}
@media (prefers-reduced-motion:reduce){#stage,#controls{transition:none}}

.narration{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:clamp(1.8rem,4.4vw,3.4rem); line-height:1.22; max-width:22ch;
  text-wrap:balance; color:var(--bone);
}
.narration.dread{color:var(--ember)}
.sub{color:var(--bone-dim); max-width:56ch; font-size:1.05rem}

.clockwrap{display:grid; place-items:center; width:100%; height:100%}
.clockwrap > *{grid-area:1/1}
.clockwrap svg{width:100%; height:100%}
.ring-svg{color:var(--oxblood); transition:stroke-dashoffset 1s linear}
.ring-svg.urgent{color:var(--ember)}
.clock{
  font-family:'Cinzel Decorative',Georgia,serif; font-size:clamp(1.8rem,5vw,3.2rem);
  color:var(--oxblood); font-variant-numeric:tabular-nums; line-height:1;
  text-shadow:0 0 34px rgba(142,34,38,.42);
}
.clock.urgent{color:var(--ember); animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.clock.urgent{animation:none}}

/* the town, laid out as it sits at the table — sized to fill whichever of
   the stage's two dimensions is tighter, now that the dashboard's own side
   columns (not this) are what pin the layout to the screen's edges, so the
   ring is free to grow into genuinely all the space that's left. */
.ring{position:relative; width:min(68vh,42vw,900px); height:min(68vh,42vw,900px); margin:0 auto; flex-shrink:0}
.ring::before{content:''; position:absolute; inset:9%; border:1px dashed var(--line); border-radius:50%}
.rseat{
  position:absolute; transform:translate(-50%,-50%); white-space:nowrap;
  display:flex; flex-direction:column; align-items:center; gap:7px;
}
.rseat-avatar{
  position:relative; width:88px; height:88px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-family:'Cinzel Decorative',Georgia,serif; font-size:1.9rem; font-weight:700;
  color:var(--bone); background:var(--surface-2); border:3px solid var(--line);
}
.rseat-avatar .icon{width:36px; height:36px}
/* Rounded on the image itself, not via overflow:hidden on the parent — the
   parent has to stay unclipped so the team badge below can sit half outside
   the circle instead of getting cut off at the avatar's own edge. */
.rseat-token{width:100%; height:100%; object-fit:cover; display:block; border-radius:50%}
.rseat-avatar .team-badge{
  position:absolute; right:-3px; bottom:-3px; width:26px; height:26px; border-radius:50%;
  object-fit:cover; border:2px solid var(--surface); background:var(--surface-2);
}
/* The real table's shroud: a dark cloth laid over a dead player's token,
   not swapped for a different picture — same idea here, a dimming veil
   over their own true likeness rather than replacing it with an icon. */
.rseat-avatar.shrouded::after{
  content:''; position:absolute; inset:0; border-radius:50%;
  background:rgba(8,6,4,.72); backdrop-filter:grayscale(1);
}
.rseat-name{font-size:clamp(.92rem,1.6vw,1.12rem); color:var(--bone)}
/* Dead reads as an unmistakably different shape at a glance from across a
   room — a skull in place of the initial, not just a smaller/greyer dot. */
.rseat.dead .rseat-avatar{background:var(--surface) !important; border-color:var(--line-soft) !important; color:var(--bone-faint) !important}
.rseat.dead .rseat-name{color:var(--bone-faint); text-decoration:line-through}
.rseat.offline .rseat-avatar{opacity:.5}
/* Past ~10 seats the ring gets crowded enough that full-size avatars would
   start to overlap their neighbours — this keeps them from ever touching. */
.ring.dense .rseat-avatar{width:64px; height:64px; font-size:1.3rem; border-width:2px}
.ring.dense .rseat-avatar .icon{width:26px; height:26px}
.ring.dense .rseat-avatar .team-badge{width:20px; height:20px; border-width:1.5px}
.ring.dense .rseat-name{font-size:.88rem}

.daycounter{
  font-family:'Cinzel Decorative',Georgia,serif; font-size:.8rem; text-transform:uppercase; letter-spacing:.28em;
  color:var(--brass); display:flex; align-items:center; gap:10px; justify-content:center;
}
.daycounter .icon{width:15px; height:15px}

#reclaimBanner{display:flex; flex-direction:column; gap:8px; padding:0 40px}
#reclaimBanner:empty{display:none}
.reclaim{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:space-between;
  border:1px solid var(--brass); background:#1a1206; border-radius:8px; padding:12px 18px; margin-top:14px;
}
.reclaim .ask{display:flex; align-items:center; gap:9px; font-family:'Cormorant Garamond',Georgia,serif; font-size:1.15rem; color:var(--brass)}
.reclaim .btns{display:flex; gap:8px}
.reclaim button{width:auto; margin:0}

/* ---------------------------------------------------------------- lobby */
.joinwrap{display:flex; align-items:center; gap:22px; flex-wrap:wrap; justify-content:center}
.joinqr{
  flex-shrink:0; width:220px; height:220px; padding:14px; box-sizing:border-box;
  background:var(--bone); border-radius:14px; border:1px solid var(--brass);
}
.joinqr svg{width:100%; height:100%; display:block}
.joinbar{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:center;
  border:1px solid var(--line); border-radius:999px; background:var(--surface);
  padding:10px 10px 10px 22px;
}
.joinbar .lbl{display:flex; align-items:center; gap:8px; color:var(--bone-dim); font-size:.92rem}
.joinbar .lbl .icon{width:16px; height:16px; color:var(--brass)}
.joinaddr{
  font-family:'Cinzel Decorative',Georgia,serif; font-size:1.3rem; color:var(--brass);
  border-radius:999px; padding:9px 22px; background:var(--surface-2); border:1px solid var(--line);
}

/* The join block and the active script used to stack — different natural
   widths (a wide QR+pill row over a narrower card) made the column edges
   zigzag instead of lining up, and stacking them tall left a lot of dead
   space above and below on a TV-sized canvas. Side by side, each keeps its
   own natural width without needing to match the other, and it actually
   uses the width a TV screen has to spare. */
.lobby-columns{display:flex; align-items:center; justify-content:center; gap:48px; width:100%; flex-wrap:wrap}

/* One script front and center, not a grid to scan — a grid stopped making
   sense once there could be any number of scripts (auto-fit with a 1fr max
   stretched every card to fill whatever was left in a short last row,
   noticeably wider than a full row above it; grouping into sections just
   made 9 small cards feel more cluttered, not less). The lobby now shows
   only the active script; "Change script" opens .script-picker-overlay's
   split-view browser below for everything else. */
.script-hero{display:flex; flex-direction:column; align-items:center; gap:20px; width:100%}
.script-hero .script-card{cursor:default; max-width:440px}
.script-hero .script-card:hover{border-color:var(--line); transform:none}
.script-hero .icon-badge{width:150px; height:150px}
.script-hero .icon-badge .icon{width:56px; height:56px}
.script-hero .card-head h3{font-size:1.7rem}

.script-picker-overlay{
  position:fixed; inset:0; z-index:46; background:var(--void); display:flex; flex-direction:column;
  opacity:0; transition:opacity .2s ease;
}
.script-picker-overlay.show{opacity:1}
@media (prefers-reduced-motion:reduce){.script-picker-overlay{transition:none}}
.script-picker-body{flex:1; min-height:0; overflow:hidden; padding:24px 32px}

/* A scannable list beside an unhurried detail pane, not a carousel — a
   carousel could only ever show one script's cast at a legible size at a
   time, which was the actual complaint this replaced. Agent-select screens
   (Valorant) are the model: pick from the list, read everything about the
   choice on the right, nothing to step through to see what else exists. */
.script-picker-split{display:flex; width:100%; height:100%; border:1px solid var(--line); border-radius:16px; overflow:hidden; background:var(--surface)}

/* Wide enough for the longest script name on one line ("Minotaur's
   Labyrinth") at this font/weight without truncating; the h4 below still
   allows wrapping to a second line rather than an ellipsis as a safety net
   for anything longer added later — a cut-off name defeats the point of a
   list you're supposed to be able to read. */
.script-list{width:320px; flex-shrink:0; overflow-y:auto; border-right:1px solid var(--line); background:var(--surface-2)}
.script-list-row{
  display:flex; align-items:center; gap:12px; width:100%; padding:14px 18px; cursor:pointer;
  background:none; border:none; border-bottom:1px solid var(--line-soft); text-align:left; margin:0;
  transition:background .12s ease;
}
.script-list-row:hover{background:rgba(255,255,255,.03)}
.script-list-row.browsed{background:var(--surface)}
.script-list-row .icon-badge{width:40px; height:40px; flex-shrink:0}
.script-list-row .icon-badge .icon{width:18px; height:18px}
.script-list-row-name{flex:1; min-width:0; display:flex; flex-direction:column; gap:5px}
.script-list-row-name h4{margin:0; font-family:'Cinzel Decorative',Georgia,serif; font-size:.96rem; color:var(--bone); font-weight:700; line-height:1.25}
.script-list-row-name .difficulty{justify-content:flex-start}
.script-list-row.locked .script-list-row-name h4{color:var(--bone-dim)}
.script-list-row-active-dot{width:7px; height:7px; border-radius:50%; background:var(--oxblood); flex-shrink:0}

/* The detail pane fills the space rather than centering a narrow column
   in it — three columns, image/description/cast, each doing one job
   instead of one stacked card leaving most of a wide pane empty. */
.script-detail{flex:1; min-width:0; overflow-y:auto; padding:36px}
.script-detail-inner{width:100%; max-width:1440px; margin:0 auto; opacity:1; transition:opacity .12s ease}
.script-detail-inner.stepping{opacity:0}
@media (prefers-reduced-motion:reduce){.script-detail-inner{transition:none}}

/* image / description / cast — the cast column is sized for 4-5 token
   columns at .roster-grid's own 72px minimum, not 3, and the image column
   is wide enough for the artwork itself to be the point, not a caption
   squeezed beside it. */
.detail-columns{display:grid; grid-template-columns:320px minmax(360px,1fr) 420px; gap:40px; align-items:start}
.detail-col-image{display:flex; flex-direction:column; align-items:center; gap:18px; text-align:center; position:sticky; top:0}
/* A big square showcase, not the small circular badge used everywhere
   else (list rows, the lobby hero) — those stay circular since they're
   compact icons; this is meant to actually show the artwork off. */
.detail-col-image .icon-badge{width:300px; height:300px; border-radius:20px}
.detail-col-image .icon-badge img{border-radius:18px}
.detail-col-image .icon-badge .icon{width:96px; height:96px}
.detail-image-name{margin:0; font-family:'Cinzel Decorative',Georgia,serif; font-size:1.35rem; color:var(--bone); font-weight:700; line-height:1.25}
.detail-col-desc{display:flex; flex-direction:column; gap:24px; min-width:0}
.detail-col-desc .desc{max-width:60ch; font-size:1rem}
/* .script-stats/.script-counts center themselves inside scriptCard's own
   centered layout — here they sit under a left-reading paragraph instead,
   so they need to left-align too rather than looking adrift in the middle
   of the column. */
.detail-col-desc .script-stats{align-items:flex-start}
.detail-col-desc .script-counts{justify-content:flex-start}
.detail-col-cast{min-width:0}

.script-picker-footer{flex:0 0 auto; padding:20px 32px; border-top:1px solid var(--line); display:flex; justify-content:center}
.script-picker-footer button{min-width:240px; margin:0}

.script-card{
  position:relative; text-align:center; border:1px solid var(--line); border-radius:16px;
  background:var(--surface); padding:30px 26px 24px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:16px;
  transition:border-color .15s ease, background .15s ease, transform .15s ease;
}
.script-card:hover{border-color:var(--brass); transform:translateY(-2px)}
.script-card.active{border-color:var(--oxblood); background:linear-gradient(165deg,#1c0f0e,#130e08 65%)}
.script-card.locked{cursor:not-allowed}
.script-card.locked:hover{transform:none; border-color:var(--line)}
.script-card.locked .card-head, .script-card.locked .desc{opacity:.4}
@media (prefers-reduced-motion:reduce){.script-card{transition:none}}

.card-head{display:flex; flex-direction:column; align-items:center; gap:12px}
.icon-badge{
  width:120px; height:120px; border-radius:50%; display:grid; place-items:center; flex-shrink:0;
  background:var(--surface-2); border:2px solid var(--line); color:var(--brass);
}
.script-card.active .icon-badge{border-color:var(--oxblood); color:var(--ember)}
.icon-badge .icon{width:46px; height:46px}
.icon-badge img{width:100%; height:100%; object-fit:cover; border-radius:50%}
.card-head h3{margin:0; font-family:'Cinzel Decorative',Georgia,serif; font-size:1.4rem; color:var(--bone); font-weight:700; line-height:1.2}
.difficulty{display:flex; align-items:center; justify-content:center; gap:7px; font-size:.68rem; text-transform:uppercase; letter-spacing:.14em; color:var(--bone-dim)}
.difficulty .dots{display:flex; gap:3px}
.difficulty .dot{width:6px; height:6px; border-radius:50%; background:var(--line)}
.difficulty .dot.on{background:var(--brass)}

.desc{font-size:.92rem; color:var(--bone-dim); line-height:1.6; max-width:36ch}

.script-stats{display:flex; flex-direction:column; align-items:center; gap:12px; width:100%; padding-top:16px; border-top:1px dashed var(--line-soft)}
.script-counts{display:flex; align-items:center; gap:20px; flex-wrap:wrap; justify-content:center}
.script-stat{display:flex; align-items:center; gap:7px; font-size:.82rem; color:var(--bone-dim)}
.script-stat .icon{width:15px; height:15px; color:var(--brass)}
.script-stat b{color:var(--bone)}
.winchips{display:flex; gap:10px; width:100%}
.winchip{flex:1; border-radius:8px; padding:10px 6px; text-align:center; font-size:.78rem}
.winchip .n{display:block; font-family:'Space Mono',monospace; font-size:1.2rem; margin-bottom:2px}
.winchip.good{background:rgba(92,134,171,.12); border:1px solid var(--good); color:var(--good)}
.winchip.evil{background:rgba(142,34,38,.12); border:1px solid var(--oxblood); color:var(--ember)}

.badge-corner{position:absolute; top:18px; right:18px}
.badge-check{
  width:24px; height:24px; border-radius:50%; background:var(--oxblood); color:#fff2e8;
  display:grid; place-items:center;
}
.badge-check .icon{width:13px; height:13px}
.badge-soon{
  font-size:.62rem; text-transform:uppercase; letter-spacing:.12em; color:var(--bone-dim);
  border:1px solid var(--line); border-radius:999px; padding:4px 11px;
}

.waitingroom{display:flex; flex-direction:column; align-items:center; gap:18px; width:100%; padding-top:6px}
.waitingroom-title{font-size:.72rem; text-transform:uppercase; letter-spacing:.2em; color:var(--bone-dim); display:flex; align-items:center; gap:8px}
.waitingroom-title .icon{width:14px; height:14px; color:var(--brass)}

.hint{
  display:flex; align-items:flex-start; gap:12px;
  border-left:2px solid var(--oxblood); padding:16px 24px; max-width:52ch;
  font-style:italic; color:#cbb894; font-size:1.15rem; text-align:left; background:var(--surface); border-radius:0 8px 8px 0;
}
.hint .icon{width:18px; height:18px; margin-top:3px; color:var(--oxblood); flex-shrink:0; font-style:normal}

/* Deliberately not styled like .hint above — a wiki fact is a curiosity for
   idle hands, not a Storyteller's dread-toned warning, so it gets brass
   instead of oxblood and no italic urgency. */
.trivia{
  display:flex; align-items:flex-start; gap:10px;
  border-left:2px solid var(--brass); padding:12px 20px; max-width:52ch;
  color:var(--bone-dim); font-size:.95rem; text-align:left; background:var(--surface); border-radius:0 8px 8px 0;
}
.trivia .icon{width:16px; height:16px; margin-top:2px; color:var(--brass); flex-shrink:0}

/* ---------------------------------------------------------- the dashboard
   Center is always the ring — the one thing everyone at the table actually
   watches — with contextual side panels for whatever info/controls that
   phase needs, instead of stacking everything in one tall column above the
   ring (which is what pushed content below the fold in the first place).
   Column count is set inline per call, since night only ever needs a right
   panel while day needs both. */
.dashboard{display:grid; gap:36px; width:100%; align-items:start}
@media (max-width:860px){.dashboard{grid-template-columns:1fr !important}}
.stage-main{display:flex; flex-direction:column; align-items:center; gap:14px; min-width:0}
.sidepanel{display:flex; flex-direction:column; gap:14px; text-align:left; min-width:0}
/* Reveal / New game used to float as a quiet corner link, visually
   disconnected from the bordered buttons below — now it's just the first
   row in the same stack, same border, same weight, same gap rhythm. */
.control-panel{display:flex; gap:8px}
.control-panel button{flex:1; margin:0}

.roster-group-title{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  font-size:.66rem; text-transform:uppercase; letter-spacing:.16em; color:var(--bone-dim);
  margin:16px 0 8px;
}
.roster-group-title:first-child{margin-top:0}
.roster-group-label{display:flex; align-items:center; gap:7px}
.roster-group-icon{width:15px; height:15px; border-radius:50%; object-fit:cover; flex-shrink:0}
.roster-group-count{color:var(--bone-faint); font-family:'Space Mono',monospace; letter-spacing:0}
.roster-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(72px,1fr)); gap:10px}
.roster-token{
  width:100%; aspect-ratio:1; border-radius:50%; object-fit:cover;
  border:1px solid var(--line); background:var(--surface-2); display:block;
}
.roster-token-fallback{
  width:100%; aspect-ratio:1; border-radius:50%; background:var(--surface-2); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:.66rem; color:var(--bone-dim); text-align:center; padding:3px;
}

/* The script picker's cast grid reuses the sidepanel's own token art and
   grouping above, but wraps each one with a name that's always visible —
   the sidepanel's hover-only title is fine glanced at all game with a
   mouse in hand, not fine for a picker whose whole job is answering "what's
   actually in this script" on a screen nobody's hovering. */
.cast-token{display:flex; flex-direction:column; align-items:center; gap:5px}
.cast-token-label{font-size:.68rem; color:var(--bone-dim); text-align:center; line-height:1.25; width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sidepanel-card{border:1px solid var(--line); border-radius:12px; background:var(--surface); padding:18px 20px}
.sidepanel-title{
  font-size:.68rem; text-transform:uppercase; letter-spacing:.18em; color:var(--bone-dim);
  display:flex; align-items:center; gap:8px; margin-bottom:12px;
}
.sidepanel-title .icon{width:13px; height:13px; color:var(--brass)}
.sidepanel .timerbox{max-width:170px; margin:0 auto 10px}
.sidepanel-actions{display:flex; flex-direction:column; gap:8px}
.sidepanel-actions button, .sidepanel-actions select{width:100%; margin:0}
button.ghost{
  width:auto; margin:0; padding:9px 16px; font-size:.9rem;
  border:1px solid var(--brass); color:var(--brass); background:var(--surface-2);
}
button.ghost.spent{
  border-color:var(--line-soft); color:var(--bone-faint); text-decoration:line-through; background:var(--surface);
}
.deaths{font-size:1.3rem; color:var(--ember); display:flex; align-items:center; gap:10px; justify-content:center}
.deaths .icon{width:20px; height:20px}

.dayreport{width:100%; border:1px solid var(--line); border-radius:12px; background:var(--surface); padding:18px}
.dayreport-title{font-size:.72rem; text-transform:uppercase; letter-spacing:.2em; color:var(--bone-dim); margin-bottom:12px; display:flex; align-items:center; gap:8px; justify-content:flex-start}
.dayreport-title .icon{width:14px; height:14px; color:var(--brass)}
.dayreport-rows{display:flex; gap:10px; flex-wrap:wrap}
.stat{flex:1; min-width:110px; border:1px solid var(--line); border-radius:8px; padding:12px; background:var(--surface-2); display:flex; flex-direction:column; align-items:flex-start; gap:2px}
.stat-n{font-size:1.35rem; color:var(--brass)}
.stat-lbl{font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--bone-dim)}

.career{font-size:.78rem; color:var(--brass); margin-top:2px; display:flex; align-items:center; gap:6px}
.career .icon{width:12px; height:12px}

.nompanel{width:100%; border:1px solid var(--line); border-radius:12px; padding:18px 20px; background:var(--surface); text-align:left}
.nomlist{margin-bottom:10px}
.nomline{font-size:.88rem; color:var(--bone-dim); padding:6px 0; border-bottom:1px dashed var(--line-soft); display:flex; align-items:center; gap:8px}
.nomline .icon{width:13px; height:13px; color:var(--ember); flex-shrink:0}
.nomline:last-child{border-bottom:none}
.nomrow{display:flex; align-items:center; gap:10px; margin:10px 0; flex-wrap:wrap}
.nomrow select{min-width:0; flex:1}
.nomrow .icon{width:16px; height:16px; color:var(--bone-dim); flex-shrink:0}
.nomrow select{flex:1}
/* How close a live vote is to passing reads faster as a filled shape than
   as a sentence — filled toward the actual majority threshold, not a
   plain yes/no split, and it tips from brass to oxblood the instant that
   threshold is reached (the room can see it's going to stick before the
   window even closes). */
.votebar{margin:12px 0 6px}
.votebar-track{position:relative; height:14px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.votebar-fill{height:100%; background:var(--brass); transition:width .3s ease, background .3s ease}
.votebar-fill.met{background:var(--oxblood)}
.votebar-label{font-size:.8rem; color:var(--bone-dim); text-align:center; margin-top:6px; font-variant-numeric:tabular-nums}
.voterlist{display:flex; flex-wrap:wrap; gap:8px 14px; margin:10px 0 16px}
.voterchip{display:flex; align-items:center; gap:6px; font-size:.85rem; color:var(--bone-dim); cursor:pointer}

.victory-banner{border:1px solid var(--primary); border-radius:12px; padding:18px 22px; margin-bottom:6px; background:var(--surface); display:flex; align-items:center; gap:16px; text-align:left}
.victory-banner .icon-badge{width:52px; height:52px; border-color:var(--primary); color:var(--primary)}
.victory-banner .icon-badge .icon{width:26px; height:26px}
.victory-banner .who{font-family:'Cinzel Decorative',Georgia,serif; font-size:1.4rem; color:var(--primary)}

/* The fatal blow that ends the game gets its own beat before the usual
   reveal fades in — a flat oxblood fill, not a gradient (a smooth radial
   over this much of the screen is exactly what banded on the TV before).
   One shared treatment for every way a game can end (a public gunshot, an
   execution, a night kill, the Evil Twin's or Vortox's win), varying only
   the icon and line underneath. */
.fatal-flash{
  position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
  background:var(--oxblood); color:#fff2e8; opacity:0; transition:opacity .35s ease;
}
.fatal-flash.show{opacity:1}
.fatal-flash .icon{width:88px; height:88px; animation:fatal-pulse 1.1s ease-in-out infinite}
.fatal-flash-text{font-family:'Cinzel Decorative',Georgia,serif; font-size:2.2rem; letter-spacing:.03em; text-align:center; padding:0 20px}
@keyframes fatal-pulse{0%,100%{transform:scale(1)} 50%{transform:scale(1.14)}}
@media (prefers-reduced-motion:reduce){.fatal-flash .icon{animation:none}}

/* A wide/tall grid like this scrolls in its own full-screen layer instead
   of squeezing into a sidepanel column or risking the dashboard's own
   fixed-height, no-page-scroll layout (main has overflow:hidden on
   purpose — anything that could outgrow it needs a lightbox like this). */
.powerlog-overlay{position:fixed; inset:0; z-index:45; background:var(--void); display:flex; flex-direction:column}
.powerlog-header{
  flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:16px 32px; border-bottom:1px solid var(--line);
}
.powerlog-header h2{margin:0; font-family:'Cinzel Decorative',Georgia,serif; font-size:1.3rem; color:var(--primary)}
.powerlog-body{flex:1; min-height:0; overflow:auto; padding:24px 32px}
.powerlog-table{border-collapse:collapse; width:max-content; min-width:100%}
.powerlog-table th, .powerlog-table td{border:1px solid var(--line); padding:8px 14px; text-align:left; white-space:nowrap; font-size:.86rem}
.powerlog-table th{
  background:var(--surface-2); position:sticky; top:0; z-index:1;
  color:var(--bone-dim); font-weight:600; text-transform:uppercase; font-size:.68rem; letter-spacing:.08em;
}
.powerlog-table td:first-child, .powerlog-table th:first-child{position:sticky; left:0; z-index:2; background:var(--surface)}
.powerlog-table th:first-child{z-index:3}
.powerlog-table td.used{color:var(--brass)}
.powerlog-table td.empty{color:var(--bone-faint)}
.powerlog-role-cell{display:flex; align-items:center; gap:10px}
.powerlog-role{display:block; color:var(--bone)}
.powerlog-name{display:block; font-size:.76rem; color:var(--bone-dim); font-weight:400; text-transform:none; letter-spacing:0}
.powerlog-token{width:36px; height:36px; border-radius:50%; object-fit:cover; border:1px solid var(--line); background:var(--surface-2); flex-shrink:0}
.powerlog-token-fallback{width:36px; height:36px; border-radius:50%; flex-shrink:0; background:var(--surface-2); border:1px solid var(--line)}
.powerlog-target{display:inline-flex; align-items:center; gap:5px}
.powerlog-target-token{width:18px; height:18px; border-radius:50%; object-fit:cover; border:1px solid var(--line); background:var(--surface-2); flex-shrink:0; vertical-align:middle}
.powerlog-target-token-fallback{width:18px; height:18px; border-radius:50%; flex-shrink:0; background:var(--surface-2); border:1px solid var(--line); display:inline-block; vertical-align:middle}

/* ----------------------------------------------------------- settings */
.settings-overlay{position:fixed; inset:0; z-index:45; background:var(--void); display:flex; flex-direction:column}
.settings-header{
  flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:16px 32px; border-bottom:1px solid var(--line);
}
.settings-header h2{margin:0; font-family:'Cinzel Decorative',Georgia,serif; font-size:1.3rem; color:var(--primary)}
.settings-body{flex:1; min-height:0; overflow:auto; padding:24px 32px; max-width:640px; margin:0 auto; width:100%}
.settings-section{margin-bottom:34px}
.settings-section:last-child{margin-bottom:0}
.settings-section h3{
  font-size:.68rem; text-transform:uppercase; letter-spacing:.18em; color:var(--bone-dim);
  margin:0 0 14px; padding-bottom:8px; border-bottom:1px solid var(--line);
}
.settings-row{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:10px 0}
.settings-row .lbl{display:flex; flex-direction:column; gap:2px; flex:1; min-width:0}
.settings-row .lbl b{font-weight:500; color:var(--bone); font-size:.92rem}
.settings-row .lbl span{font-size:.78rem; color:var(--bone-faint)}
.settings-row input[type="range"]{width:150px; accent-color:var(--brass)}
.settings-row input[type="number"]{
  width:72px; background:var(--surface-2); border:1px solid var(--line); border-radius:6px;
  color:var(--bone); padding:6px 8px; font-size:.9rem; text-align:right;
}
.settings-row .val{font-family:'Space Mono',monospace; font-size:.82rem; color:var(--bone-dim); width:2.4em; text-align:right}
.settings-nights{display:flex; gap:8px}
.settings-nights label{
  display:flex; align-items:center; gap:5px; font-size:.82rem; color:var(--bone-dim);
  border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer;
}
.settings-nights input{accent-color:var(--brass)}
.toggle{position:relative; width:42px; height:24px; flex-shrink:0}
.toggle input{position:absolute; inset:0; opacity:0; margin:0; cursor:pointer}
.toggle .track{
  position:absolute; inset:0; background:var(--surface-2); border:1px solid var(--line); border-radius:999px;
  transition:background .15s;
}
.toggle .track::after{
  content:''; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;
  background:var(--bone-faint); transition:transform .15s, background .15s;
}
.toggle input:checked + .track{background:var(--oxblood)}
.toggle input:checked + .track::after{transform:translateX(18px); background:var(--bone)}
.llm-status{font-size:.82rem; margin-top:6px}
.llm-status.ok{color:var(--verdigris,#6b9b7c)}
.llm-status.off{color:var(--bone-faint)}

/* -------------------------------------------------------------- footer */
footer{flex:0 0 auto; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; padding:14px 40px; border-top:1px solid var(--line)}
button{
  display:inline-flex; align-items:center; gap:8px; justify-content:center;
  font-family:'Spectral',Georgia,serif; font-size:1rem; font-weight:600;
  background:var(--surface); color:var(--bone); border:1px solid var(--line); border-radius:8px;
  padding:11px 22px; cursor:pointer; letter-spacing:.02em;
  transition:border-color .15s ease, background .15s ease, color .15s ease;
}
button .icon{width:16px; height:16px}
button:hover:not(:disabled){border-color:var(--oxblood); color:#fff}
button:disabled{opacity:.32; cursor:not-allowed}
button.primary{background:var(--primary); border-color:var(--primary); color:#fff2e8}
button.primary:hover:not(:disabled){background:var(--primary-hi); border-color:var(--primary-hi)}
button.ghostbtn{background:transparent; border-color:transparent; color:var(--bone-dim)}
button.ghostbtn:hover:not(:disabled){color:var(--bone); border-color:var(--line)}
select{
  background:var(--surface); color:var(--bone); border:1px solid var(--line); border-radius:8px;
  padding:11px 14px; font-family:inherit; font-size:1rem;
}
:focus-visible{outline:2px solid var(--brass); outline-offset:2px}
@media (prefers-reduced-motion:reduce){button{transition:none}}

/* -------------------------------------------------------------- reveal */
/* Grows to fit however many players there are, rather than scrolling its
   own tiny window inside a page that otherwise never scrolls. */
.rosterlist{display:flex; flex-direction:column}
.rosterrow{padding:8px 6px; border-bottom:1px dashed var(--line-soft); border-left:3px solid transparent; padding-left:10px}
.rosterrow:last-child{border-bottom:none}
.rosterrow-top{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.rosterrole{font-size:.78rem; color:var(--bone-dim); text-align:right; flex-shrink:0}
.deadname{color:var(--bone-faint); text-decoration:line-through}
.log{max-width:100%; text-align:left; color:var(--bone-dim); font-size:.88rem; max-height:34vh; overflow:auto; border:1px solid var(--line); border-radius:8px; padding:14px 18px; background:var(--surface)}
.log p{margin:.3em 0}
</style>
</head>
<body>
<header>
  <span class="brand"><span id="brandIcon"></span><span class="mark">The Clocktower Wakes</span></span>
  <span class="header-right">
    <button id="settingsBtn" class="mutebtn" title="Table settings"></button>
    <button id="fullscreenBtn" class="mutebtn" title="Enter fullscreen" hidden></button>
    <button id="muteBtn" class="mutebtn" title="Mute sound"></button>
    <span class="phase" id="phase"></span>
  </span>
</header>

<div id="reclaimBanner"></div>

<main><div class="view" id="stage"></div></main>

<footer id="controls"></footer>

<script src="/qrcode.js"></script>
<script>
/* ------------------------------------------------------------- icons */
// Hand-drawn, single-weight line icons — 24x24, stroke=currentColor. Kept
// to one small dictionary so every icon on the screen shares the same
// stroke width and cap style rather than mismatched glyphs from a library.
const ICON_PATHS = {
  moon: '<path d="M20 14.7A8.5 8.5 0 1 1 9.3 4a7 7 0 0 0 10.7 10.7Z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v3M12 18.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  skull: '<path d="M12 3a7 7 0 0 0-7 7c0 2.5 1.2 3.9 2 4.8V18h2v-1.6h2V18h2v-1.6h2V18h2v-3.2c.8-.9 2-2.3 2-4.8a7 7 0 0 0-7-7Z"/><circle cx="9.4" cy="10" r="1.05" fill="currentColor" stroke="none"/><circle cx="14.6" cy="10" r="1.05" fill="currentColor" stroke="none"/><path d="M11 21h2"/>',
  ghost: '<path d="M6 20V11a6 6 0 0 1 12 0v9l-2.2-1.6L14 20l-2-1.6L10 20l-1.8-1.6L6 20Z"/><circle cx="9.6" cy="10.6" r=".9" fill="currentColor" stroke="none"/><circle cx="14.4" cy="10.6" r=".9" fill="currentColor" stroke="none"/>',
  users: '<circle cx="8.6" cy="8" r="3"/><path d="M2.6 19c0-3.3 2.6-5.4 6-5.4s6 2.1 6 5.4"/><circle cx="16.6" cy="9" r="2.3"/><path d="M15 13.7c2.5.3 4.4 2.3 4.4 5.3"/>',
  check: '<path d="M5 13l4.5 4.5L19 8"/>',
  refresh: '<path d="M4 12a8 8 0 0 1 13.6-5.7M20 12a8 8 0 0 1-13.6 5.7"/><path d="M17.2 2.8v4h-4M6.8 21.2v-4h4"/>',
  eye: '<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.6"/>',
  trend: '<path d="M3 17l5-5 4 4 8.5-9.5"/><path d="M14.5 6h6v6"/>',
  mug: '<path d="M5.5 8h11v7a4 4 0 0 1-4 4h-3a4 4 0 0 1-4-4V8Z"/><path d="M16.5 9.5H18a2.3 2.3 0 0 1 0 4.6h-1.5"/><path d="M8.3 5.6c0-.9.7-1.3.7-2.2M11.7 5.6c0-.9.7-1.3.7-2.2"/>',
  cloud: '<path d="M7 18a4 4 0 0 1-.6-7.95A5.5 5.5 0 0 1 17 9a4.2 4.2 0 0 1-.6 9H7Z"/>',
  bolt: '<path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/>',
  scroll: '<path d="M6 4h11a2 2 0 0 1 2 2v13a1.5 1.5 0 0 1-3 0V6H8"/><path d="M6 4a2 2 0 0 0-2 2v11a2.5 2.5 0 0 0 2.5 2.5H16"/><path d="M8 8h6M8 11.5h6"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.3 2"/>',
  hand: '<path d="M4 22c0-5 2.6-8 5.5-8h5c2.9 0 5.5 3 5.5 8"/><circle cx="12" cy="7" r="4.5"/>',
  arrows: '<path d="M8 3v13M8 16l-3.5-3.5M8 16l3.5-3.5"/><path d="M16 21V8M16 8l-3.5 3.5M16 8l3.5 3.5"/>',
  bulb: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1.1 1.3 1.1 2.2h5c0-.9.5-1.7 1.1-2.2A6 6 0 0 0 12 3Z"/>',
  crosshair: '<circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><path d="M12 1.5v3.2M12 19.3v3.2M1.5 12h3.2M19.3 12h3.2"/>',
  close: '<path d="M5 5l14 14M19 5L5 19"/>',
  expand: '<path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/>',
  collapse: '<path d="M9 3v5H4M15 3v5h5M9 21v-5H4M15 21v-5h5"/>',
  // The brand mark — one hand, fixed at a dramatic hour rather than the
  // ordinary two-handed 'clock' used elsewhere, same idea as the generated
  // app icon. Static on purpose: the phase pill already spells out night
  // vs. day in full, so this doesn't need to duplicate that.
  brandmark: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><path d="M12 12 16.6 16.3"/>',
  speaker: '<path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19.3 6a8.5 8.5 0 0 1 0 12"/>',
  speakerOff: '<path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82A1.65 1.65 0 0 0 3 13.09H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>',
};
function wrapIcon(name, size) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 24 24');
  s.setAttribute('class', 'icon');
  if (size) { s.style.width = size + 'px'; s.style.height = size + 'px'; }
  s.innerHTML = ICON_PATHS[name] || '';
  return s;
}

// Vendored qrcode.js loads as a plain <script> tag before this one — absent
// entirely only if that request failed, which the join address text next to
// it already covers on its own.
function renderQR(text) {
  const { size, modules } = QRCodeGen.encode(text, { level: 'M' });
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
  svg.setAttribute('shape-rendering', 'crispEdges');
  const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  bg.setAttribute('width', size); bg.setAttribute('height', size);
  bg.style.fill = 'var(--bone)';
  svg.append(bg);
  let d = '';
  for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) if (modules[r][c]) d += `M${c} ${r}h1v1h-1z`;
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', d);
  path.style.fill = 'var(--void)';
  svg.append(path);
  return svg;
}

let S = null;
let SCRIPTS = null;
let spoken = '';
let TOKENS = {};
let JOIN_ADDR = null;
let SCRIPT_CHARS = null; // the current script's own roster, for the reference grid
let scriptRosterCardCache = null;
let scriptRosterCardCacheKey; // deliberately unset — differs from any real SCRIPT_CHARS, including null
let TRIVIA = [];
let triviaFact = null; // the line currently on screen — rerolled on its own timer, not on every render

const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
const withIcon = (btn, name) => { btn.prepend(wrapIcon(name, 15)); return btn; };

function speak(line, { dread = false } = {}) {
  if (!line || line === spoken) return;
  spoken = line;
  if (soundMuted || !('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(line);
  u.rate = dread ? 0.78 : 0.86;
  u.pitch = dread ? 0.5 : 0.65;
  u.volume = 1;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

/* ------------------------------------------------------------ sound cues
   Synthesized, not sampled — same reasoning as the generated app icons:
   no external audio file to license or ship, and it costs nothing to add
   a cue. A handful of short tones layered with delays stand in for real
   instruments well enough for something this brief. */
let soundMuted = localStorage.getItem('botc-host-muted') === '1';
let audioCtx = null;
let masterBus = null;
let reverbSend = null;

/** A cavernous, generated impulse response stands in for a real reverb
    plugin — no audio file to ship, but it's what actually separates "dark
    hall" from "phone notification": every tone gets a wet send into this so
    nothing plays perfectly dry. Built once, lazily, the first time sound is
    ever needed. */
function buildReverb(ctx) {
  const duration = 2.4;
  const rate = ctx.sampleRate;
  const length = Math.max(1, Math.floor(rate * duration));
  const impulse = ctx.createBuffer(2, length, rate);
  for (let ch = 0; ch < impulse.numberOfChannels; ch++) {
    const data = impulse.getChannelData(ch);
    for (let i = 0; i < length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.6);
    }
  }
  const convolver = ctx.createConvolver();
  convolver.buffer = impulse;
  return convolver;
}

function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // Everything (dry signal and the reverb's wet tail alike) glues together
    // through one compressor — the single biggest reason layered oscillators
    // read as "a produced sound" instead of "several beeps at once".
    masterBus = audioCtx.createDynamicsCompressor();
    masterBus.threshold.value = -18;
    masterBus.ratio.value = 4;
    masterBus.connect(audioCtx.destination);
    reverbSend = buildReverb(audioCtx);
    reverbSend.connect(masterBus);
  }
  return audioCtx;
}

/** One layered, filtered note: two slightly detuned oscillators (a clean
    single sine is what makes a synthesized tone read as "computerish" —
    real instruments are never that pure) through a lowpass filter, split
    to a dry path and a reverb send. */
function tone(freq, {
  duration = 0.6, type = 'sine', gain = 0.14, delay = 0, attack = 0.06,
  detune = 5, filterFreq = 1200, filterQ = 0.7, wet = 0.3,
} = {}) {
  if (soundMuted) return;
  const ctx = getAudioCtx();
  const t0 = ctx.currentTime + delay;

  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = filterFreq;
  filter.Q.value = filterQ;
  const dry = ctx.createGain();
  dry.gain.value = 1 - wet;
  const send = ctx.createGain();
  send.gain.value = wet;
  filter.connect(dry); dry.connect(masterBus);
  filter.connect(send); send.connect(reverbSend);

  [-detune, detune].forEach(cents => {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    osc.detune.value = cents;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain * 0.6, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(g); g.connect(filter);
    osc.start(t0); osc.stop(t0 + duration + 0.05);
  });
}

/** Filtered noise — the texture a pure oscillator can never give: breath,
    wind, the crack of an impact. */
function noiseBurst({ duration = 0.3, gain = 0.2, filterFreq = 500, filterType = 'lowpass', filterQ = 0.7, delay = 0, wet = 0.3 } = {}) {
  if (soundMuted) return;
  const ctx = getAudioCtx();
  const t0 = ctx.currentTime + delay;
  const length = Math.max(1, Math.floor(ctx.sampleRate * duration));
  const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;

  const src = ctx.createBufferSource();
  src.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = filterType;
  filter.frequency.value = filterFreq;
  filter.Q.value = filterQ;
  const g = ctx.createGain();
  g.gain.setValueAtTime(gain, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  const dry = ctx.createGain(); dry.gain.value = 1 - wet;
  const send = ctx.createGain(); send.gain.value = wet;
  src.connect(filter); filter.connect(g);
  g.connect(dry); dry.connect(masterBus);
  g.connect(send); send.connect(reverbSend);
  src.start(t0); src.stop(t0 + duration + 0.02);
}

function playNightFalls() {
  // A slow, low swell that never resolves — no clean beep has an attack
  // this long. C2 against the tritone above it (Gb2) is the "devil's
  // interval," the same clash horror scoring leans on for unease.
  tone(65.41, { duration: 3.0, attack: 0.7, gain: 0.16, filterFreq: 320, detune: 4, wet: 0.5 });
  tone(92.50, { duration: 2.6, attack: 0.9, delay: 0.35, gain: 0.12, filterFreq: 380, detune: 5, wet: 0.55 });
  noiseBurst({ duration: 2.8, gain: 0.05, filterFreq: 220, wet: 0.6 }); // wind, not hiss
}
function playDayBreaks() {
  // Warmer and quicker to arrive than night's dread, but still filtered
  // and reverberant — dawn in the same dark world, not a phone chime.
  tone(196.00, { duration: 1.1, type: 'triangle', attack: 0.1, gain: 0.16, filterFreq: 1100, detune: 4, wet: 0.22 });
  tone(293.66, { duration: 1.5, type: 'triangle', attack: 0.14, delay: 0.16, gain: 0.14, filterFreq: 1300, detune: 4, wet: 0.28 });
}
function playImpactSting() {
  // A sub-bass thud, a short bandpass "crack" for the transient, and a low
  // rumble tail — three different textures, the way a real impact layers,
  // rather than one square wave standing in for all of it. Shared by every
  // fatal-blow reveal (Slayer, execution, night kill, Evil Twin, Vortox),
  // not just the Slayer's shot the name once implied.
  tone(52, { duration: 0.5, attack: 0.003, gain: 0.32, filterFreq: 200, detune: 2, wet: 0.35 });
  noiseBurst({ duration: 0.16, gain: 0.24, filterFreq: 1800, filterType: 'bandpass', filterQ: 1.2, wet: 0.3 });
  noiseBurst({ duration: 0.7, gain: 0.06, delay: 0.02, filterFreq: 260, wet: 0.55 });
}
function playVictory(winner) {
  if (winner === 'good') {
    // A warm, resolved triad in a low-mid register — relief, not a jingle.
    [196.00, 246.94, 293.66, 392.00].forEach((f, i) => tone(f, {
      duration: 1.8, type: 'triangle', attack: 0.18, delay: i * 0.16, gain: 0.13, filterFreq: 1100, detune: 4, wet: 0.35,
    }));
  } else {
    // A close, dissonant cluster (E2/F2 — a half-step clash) over a low
    // tritone, run through a hard lowpass so the sawtooth growls instead
    // of buzzing — the same filtered-saw trick real dark-ambient patches use.
    [82.41, 87.31, 61.74].forEach((f, i) => tone(f, {
      duration: 2.8, type: 'sawtooth', attack: 0.35, delay: i * 0.2, gain: 0.11, filterFreq: 340, detune: 8, wet: 0.5,
    }));
    noiseBurst({ duration: 2.2, gain: 0.05, delay: 0.1, filterFreq: 200, wet: 0.6 });
  }
}

function setMuted(next) {
  soundMuted = next;
  localStorage.setItem('botc-host-muted', next ? '1' : '0');
  if (next) speechSynthesis.cancel();
  const btn = document.getElementById('muteBtn');
  btn.classList.toggle('on', !next);
  btn.innerHTML = '';
  btn.append(wrapIcon(next ? 'speakerOff' : 'speaker', 17));
  btn.title = next ? 'Sound is off — tap to unmute' : 'Sound is on — tap to mute';
}

document.getElementById('muteBtn').onclick = () => setMuted(!soundMuted);
setMuted(soundMuted);

document.getElementById('settingsBtn').append(wrapIcon('gear', 17));
document.getElementById('settingsBtn').onclick = () => settingsOverlay();
// AudioContext can't produce sound until a real user gesture has happened
// on the page at least once — the host will have clicked something (Deal,
// the mute button, anything) long before the first cue would ever fire,
// but this makes sure that first click actually wakes it up either way.
document.body.addEventListener('pointerdown', () => { if (!soundMuted) getAudioCtx().resume(); }, { once: true });

/* ---------------------------------------------------------- wake lock */
// Keeps the TV from dimming or sleeping mid-session. Wake Lock requires a
// secure context (HTTPS or localhost) and this app is routinely loaded over
// a plain-HTTP LAN address, so every step here is feature-detected and
// silent on failure — it either quietly keeps the screen on, or does
// nothing, never an error the host has to deal with.
let wakeLock = null;
async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); }
  catch (e) { wakeLock = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') requestWakeLock();
});
requestWakeLock();

/* ---------------------------------------------------------- fullscreen */
// Browser chrome (address bar, tabs) breaks the "this is a shared screen,
// not a browser" illusion a TV mode depends on. Hidden entirely if the
// browser doesn't support the Fullscreen API rather than showing a button
// that would just fail.
const fullscreenBtn = document.getElementById('fullscreenBtn');
if (document.documentElement.requestFullscreen) {
  fullscreenBtn.hidden = false;
  fullscreenBtn.append(wrapIcon('expand', 17));
  fullscreenBtn.onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  };
  document.addEventListener('fullscreenchange', () => {
    const on = !!document.fullscreenElement;
    fullscreenBtn.innerHTML = '';
    fullscreenBtn.append(wrapIcon(on ? 'collapse' : 'expand', 17));
    fullscreenBtn.title = on ? 'Exit fullscreen' : 'Enter fullscreen';
  });
}

function post(url, body) {
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  }).then(r => r.json());
}

/** A player's own color as a light tint (blended toward white) for an
    avatar's fill, keeping the full-strength hex for the border and the
    text — border and letter read as "their color," the fill just gives it
    somewhere to sit without turning the whole badge into a solid block. */
function lightenHex(hex, amount) {
  const n = parseInt(hex.replace('#', ''), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const light = c => Math.round(c + (255 - c) * amount);
  return `rgb(${light(r)}, ${light(g)}, ${light(b)})`;
}

/* The town square, laid out in the same circle the players actually sit in —
   the one shared visual everyone at the table looks at together. Once the
   game is revealed, each seat shows that player's real character token
   instead of their colored initial, with a dark "shroud" veil over anyone
   dead — the same idea as the physical shroud token laid over a role at
   the real table, not a different picture swapped in for a dead one. */
function ringSeats(players, { revealed = false } = {}) {
  const wrap = el('div', 'ring' + (players.length > 10 ? ' dense' : ''));
  const n = players.length;
  players.forEach((p, i) => {
    const angle = (i / n) * 2 * Math.PI - Math.PI / 2;
    const left = 50 + 41 * Math.cos(angle);
    const top = 50 + 41 * Math.sin(angle);
    const s = el('div', 'rseat' + (p.alive ? '' : ' dead') + (p.connected ? '' : ' offline'));
    s.style.left = left + '%';
    s.style.top = top + '%';

    const avatar = el('div', 'rseat-avatar');
    const showFallbackInitial = () => {
      avatar.textContent = (p.name[0] || '?').toUpperCase();
      if (p.color && p.connected) {
        avatar.style.borderColor = p.color.hex;
        avatar.style.background = lightenHex(p.color.hex, 0.78);
        avatar.style.color = p.color.hex;
      }
    };

    if (revealed) {
      const src = TOKENS[p.characterId];
      if (src) {
        const img = document.createElement('img');
        img.className = 'rseat-token';
        img.src = src;
        img.alt = '';
        img.onerror = () => { img.remove(); showFallbackInitial(); };
        avatar.append(img);
        if (p.color) avatar.style.borderColor = p.color.hex;
        if (!p.alive) avatar.classList.add('shrouded');
        if (p.team) {
          const teamBadge = document.createElement('img');
          teamBadge.className = 'team-badge';
          teamBadge.src = '/team-icons/' + p.team + '.png';
          teamBadge.alt = '';
          teamBadge.onerror = () => teamBadge.remove();
          avatar.append(teamBadge);
        }
      } else {
        showFallbackInitial();
      }
    } else if (!p.alive) {
      // Dead reads as a genuinely different shape (a skull, not just a
      // smaller/greyer version of the same badge) — legible from across a
      // real room, not just up close. A chosen color only shows through in
      // the normal alive-and-connected state, so it never masks a problem
      // (dead or disconnected) worth noticing.
      avatar.append(wrapIcon('skull', 26));
    } else {
      showFallbackInitial();
    }
    s.append(avatar, el('span', 'rseat-name', p.name));
    wrap.append(s);
  });
  return wrap;
}

/** The ring always owns the center. Left and right use the exact same
    column width whenever both are present, so the center track — and the
    ring inside it — sits genuinely in the middle of the screen rather than
    just the middle of whatever's left over between two mismatched panels. */
function dashboardLayout({ left, main, right }) {
  const dash = el('div', 'dashboard');
  const cols = [];
  // The side columns pin to the screen's edges at a comfortable reading
  // width; the ring's own 1fr track is what actually absorbs a wide TV's
  // remaining space, same effect as flex's justify-content:space-between
  // would give a 3-up row, but with a middle track that can grow.
  if (left) cols.push('minmax(300px,400px)');
  cols.push('1fr');
  if (right) cols.push('minmax(300px,400px)');
  dash.style.gridTemplateColumns = cols.join(' ');
  if (left) dash.append(left);
  dash.append(main);
  if (right) dash.append(right);
  return dash;
}

function sidepanelCard(iconName, title) {
  const card = el('div', 'sidepanel-card');
  const t = el('div', 'sidepanel-title');
  t.append(wrapIcon(iconName, 13), el('span', null, title));
  card.append(t);
  return card;
}

function dayCounterLabel(text) {
  const label = el('div', 'daycounter');
  label.append(wrapIcon(text.startsWith('Night') ? 'moon' : 'sun', 14), el('span', null, text));
  return label;
}

/** Whichever facts actually apply to tonight's script — a Bad Moon Rising
    game has no business surfacing a Trouble Brewing character's trivia. */
function eligibleTrivia() {
  return TRIVIA.filter(t => !t.scripts || t.scripts.includes(S.script));
}

function voteIsOpen() {
  return !!(S && S.nominations.some(n => n.day === S.nightNumber && !n.closed));
}

/** Rerolled on its own timer (see the interval near the bottom of this
    file), not on every render — a fact that changed every time someone cast
    a vote would be more distracting than idle time ever was. */
function rollTrivia() {
  const pool = eligibleTrivia();
  if (!pool.length) { triviaFact = null; return; }
  if (pool.length === 1) { triviaFact = pool[0].fact; return; }
  let next;
  do { next = pool[Math.floor(Math.random() * pool.length)].fact; } while (next === triviaFact);
  triviaFact = next;
}

function triviaLine() {
  if (!triviaFact) rollTrivia();
  if (!triviaFact) return null;
  const box = el('div', 'trivia');
  box.append(wrapIcon('bulb', 15), el('span', null, triviaFact));
  return box;
}

/** Every character that could possibly turn up this game — not who's
    actually holding them, just the script's own roster, laid out as small
    portraits. Fills what would otherwise be an empty side of the screen,
    and doubles as a reference the table can glance at all night. Fetched
    once per script and cached, same pattern as TOKENS/SCRIPTS. */
const TEAM_LABELS = { townsfolk: 'Townsfolk', outsider: 'Outsiders', minion: 'Minions', demon: 'Demons' };
const TEAM_ORDER = ['townsfolk', 'outsider', 'minion', 'demon'];

/** Townsfolk/Outsider/Minion/Demon, in that order, each only present if the
    list actually has one — shared by the in-game sidepanel below and the
    script picker's cast grid, the two places a character list needs
    grouping rather than a flat scan. */
function groupByTeam(characters) {
  const byTeam = {};
  characters.forEach(c => { (byTeam[c.team] = byTeam[c.team] || []).push(c); });
  return TEAM_ORDER.filter(team => byTeam[team] && byTeam[team].length).map(team => ({ team, list: byTeam[team] }));
}

function teamGroupHeading(team, count) {
  const heading = el('div', 'roster-group-title');
  const label = el('span', 'roster-group-label');
  const badge = document.createElement('img');
  badge.className = 'roster-group-icon';
  badge.src = '/team-icons/' + team + '.png';
  badge.alt = '';
  badge.onerror = () => badge.remove();
  label.append(badge, document.createTextNode(TEAM_LABELS[team] || team));
  heading.append(label, el('span', 'roster-group-count', String(count)));
  return heading;
}

/** The whole left panel, once nothing else shares it with this card — worth
    isolating by type rather than one flat grid, so "how many minions are
    even in this script" is a glance instead of a count.

    SCRIPT_CHARS is fixed for the whole game once dealt, so this card's
    content never actually changes — but render() rebuilds the entire stage
    on every SSE push (any player answering, any vote), and re-running this
    unconditionally rebuilt the same tokens/grid from scratch every time,
    which read as this one panel "re-rendering" for no reason while
    everything around it legitimately updated. Cache the built node and
    hand back the same one until SCRIPT_CHARS itself actually changes. */
function scriptRosterCard() {
  if (SCRIPT_CHARS === scriptRosterCardCacheKey && scriptRosterCardCache) return scriptRosterCardCache;
  scriptRosterCardCacheKey = SCRIPT_CHARS;

  const card = sidepanelCard('scroll', `In this script${SCRIPT_CHARS ? ' (' + SCRIPT_CHARS.length + ')' : ''}`);
  if (!SCRIPT_CHARS) { card.append(el('div', 'roster-grid')); scriptRosterCardCache = card; return card; }

  groupByTeam(SCRIPT_CHARS).forEach(({ team, list }) => {
    card.append(teamGroupHeading(team, list.length));

    const grid = el('div', 'roster-grid');
    list.forEach(c => {
      const src = TOKENS[c.id];
      let node;
      if (src) {
        node = document.createElement('img');
        node.className = 'roster-token';
        node.src = src;
        node.alt = c.name;
        node.title = c.name;
        node.onerror = () => { node.replaceWith(fallbackToken(c.name)); };
      } else {
        node = fallbackToken(c.name);
      }
      grid.append(node);
    });
    card.append(grid);
  });
  scriptRosterCardCache = card;
  return card;
}

function fallbackToken(name) {
  const f = el('div', 'roster-token-fallback', name);
  f.title = name;
  return f;
}

/** The script picker's own cast display — same grouping, same token art
    (TOKENS/fallback) as the in-game sidepanel above, but every token gets a
    visible name label underneath instead of a hover-only title. The
    sidepanel's title-only names are fine glanced at all game with a mouse
    in hand; this is the one screen whose entire job is answering "what's
    actually in this script," read on a TV with nobody hovering anything. */
function castGrid(characters) {
  const wrap = el('div', 'cast-grid-wrap');
  groupByTeam(characters).forEach(({ team, list }) => {
    wrap.append(teamGroupHeading(team, list.length));

    const grid = el('div', 'roster-grid');
    list.forEach(c => {
      const src = TOKENS[c.id];
      let img;
      if (src) {
        img = document.createElement('img');
        img.className = 'roster-token';
        img.src = src;
        img.alt = '';
        img.onerror = () => { img.replaceWith(el('div', 'roster-token-fallback')); };
      } else {
        img = el('div', 'roster-token-fallback');
      }
      const tok = el('div', 'cast-token');
      tok.append(img, el('span', 'cast-token-label', c.name));
      grid.append(tok);
    });
    wrap.append(grid);
  });
  return wrap;
}

/** Reveal-everything / new-game live at the top of whatever control panel
    the phase has, not in a separate footer bar competing for attention
    with the actual primary action underneath it — same bordered button
    look as everything below, so the whole panel reads as one stack. */
function controlPanelRow() {
  const row = el('div', 'control-panel');
  const reveal = withIcon(el('button', null, 'Reveal'), 'eye');
  reveal.onclick = () => confirm('End the game and reveal every role?') && post('/api/table/reveal');
  const reset = withIcon(el('button', null, 'New game'), 'refresh');
  reset.onclick = () => confirm('Clear the table and start over?') && post('/api/table/reset').then(() => location.reload());
  row.append(reveal, reset);
  return row;
}

/* --------------------------------------------------------- script cards */
const SCRIPT_ICON = { tb: 'mug', bmr: 'cloud', sv: 'eye' };

/** The real script logo when one's been dropped in; the hand-drawn icon is
    the fallback, not a second thing shown alongside it. Shared by
    scriptCard() and the picker's list rows — sizing is CSS-driven per
    ancestor class either way, so this never needs a size parameter. */
function scriptBadge(meta) {
  const badge = el('div', 'icon-badge');
  const logoImg = document.createElement('img');
  logoImg.src = '/scripts/' + meta.id + '.png';
  logoImg.alt = '';
  logoImg.onerror = () => { logoImg.remove(); badge.prepend(wrapIcon(SCRIPT_ICON[meta.id] || 'scroll', 22)); };
  badge.append(logoImg);
  return badge;
}

/** Dots + "Easy"/"Medium"/"Hard" — shared by scriptCard(), the picker's
    list rows, and the picker detail pane's image column, so the three
    never drift out of sync on how a difficulty renders. */
function scriptDifficultyRow(meta) {
  const diff = el('div', 'difficulty');
  const dots = el('div', 'dots');
  for (let i = 1; i <= 3; i++) dots.append(el('span', 'dot' + (i <= meta.difficulty ? ' on' : '')));
  diff.append(dots, el('span', null, ['', 'Easy', 'Medium', 'Hard'][meta.difficulty] || ''));
  return diff;
}

/** Characters/games-played counts plus the good/evil win-rate chips — the
    script's own track record, shared by scriptCard() and the picker
    detail pane's description column (which uses it in place of anything
    like a written review: nobody's authoring those in a shared table tool
    with no accounts, but "here's how it's actually gone" is real data we
    already have). */
function scriptStatsBlock(meta) {
  const stats = el('div', 'script-stats');
  const charStat = el('div', 'script-stat');
  charStat.append(wrapIcon('scroll', 14), el('b', null, String(meta.characterCount || 0)), el('span', null, ' characters'));
  const gamesStat = el('div', 'script-stat');
  gamesStat.append(wrapIcon('users', 14), el('b', null, String(meta.gamesPlayed || 0)), el('span', null, meta.gamesPlayed === 1 ? ' game played' : ' games played'));
  const countsRow = el('div', 'script-counts');
  countsRow.append(charStat, gamesStat);
  stats.append(countsRow);

  if (meta.goodWinRate != null) {
    const goodPct = Math.round(meta.goodWinRate * 100);
    const evilPct = 100 - goodPct;
    const chips = el('div', 'winchips');
    const good = el('div', 'winchip good');
    good.append(el('span', 'n', goodPct + '%'), el('span', null, 'Good wins'));
    const evil = el('div', 'winchip evil');
    evil.append(el('span', 'n', evilPct + '%'), el('span', null, 'Evil wins'));
    chips.append(good, evil);
    stats.append(chips);
  }
  return stats;
}

/** A pure display card — no click-to-select of its own. Its only remaining
    caller is the lobby's scriptHero; the picker's detail pane composes
    scriptBadge()/scriptDifficultyRow()/scriptStatsBlock() directly into its
    own 3-column layout instead of using this whole stacked-card shape. */
function scriptCard(meta, active) {
  const locked = meta.playable === false;
  const card = el('div', 'script-card' + (active ? ' active' : '') + (locked ? ' locked' : ''));

  const head = el('div', 'card-head');
  const titleWrap = el('div');
  titleWrap.append(el('h3', null, meta.name), scriptDifficultyRow(meta));
  head.append(scriptBadge(meta), titleWrap);
  card.append(head);

  card.append(el('div', 'desc', meta.description || ''));
  card.append(scriptStatsBlock(meta));

  const corner = el('div', 'badge-corner');
  if (locked) {
    corner.append(el('span', 'badge-soon', 'Coming soon'));
  } else if (active) {
    const chk = el('div', 'badge-check');
    chk.append(wrapIcon('check', 12));
    corner.append(chk);
  }
  card.append(corner);

  return card;
}

/** The picker's detail pane, three columns rather than one stacked card:
    artwork gets its own column at real size (the source images run
    1.8-3MB — worth actually showing at a size that uses that, not a
    120px circle), with the name and difficulty moved underneath it since
    they now read as a caption for the art rather than a title beside it;
    the middle column is for reading about the script (its stats stand in
    for a review here — nobody's authoring real ones in a shared table
    tool with no accounts, but "here's how it's actually gone" is real
    data); the cast lives on the right, same content as before. Composes
    scriptBadge()/scriptDifficultyRow()/scriptStatsBlock() directly rather
    than reusing scriptCard() — the two layouts don't share enough shape
    for that. No active-checkmark/locked-soon corner here, unlike
    scriptCard() — the list row's own marker and the footer's "Choose X"
    vs. "Coming soon" button already say that without repeating it. */
function scriptDetailBody(meta) {
  const wrap = el('div', 'detail-columns');

  const imageCol = el('div', 'detail-col-image');
  imageCol.append(scriptBadge(meta), el('h3', 'detail-image-name', meta.name), scriptDifficultyRow(meta));

  const descCol = el('div', 'detail-col-desc');
  descCol.append(el('div', 'desc', meta.description || ''), scriptStatsBlock(meta));

  const castCol = el('div', 'detail-col-cast');
  if (meta.characters && meta.characters.length) castCol.append(castGrid(meta.characters));

  wrap.append(imageCol, descCol, castCol);
  return wrap;
}

/** The lobby's own display of whichever script is active right now — the
    same scriptCard(), just bigger. Everything else lives behind
    scriptPickerOverlay(). */
function scriptHero(meta) {
  const wrap = el('div', 'script-hero');
  wrap.append(scriptCard(meta, true));
  const changeBtn = withIcon(el('button', null, 'Change script'), 'scroll');
  changeBtn.onclick = () => scriptPickerOverlay();
  wrap.append(changeBtn);
  return wrap;
}

let scriptBrowseIndex = 0;

/** A scannable list beside a roomy detail pane, not a carousel — a carousel
    could only ever show one script's cast at a legible size, which was the
    actual complaint this replaced (agent-select screens like Valorant's are
    the model: pick from the list, read everything about the choice on the
    right, nothing to step through to see what else exists). Follows
    settingsOverlay()'s shape (an opaque full-screen layer appended to
    document.body, a header with a close button) but — unlike settings —
    actually fades in and out, the same requestAnimationFrame-then-class
    idiom playFatalBlow() uses for its own overlay, since this is meant to
    feel like a considered choice screen rather than a form. */
function scriptPickerOverlay() {
  if (!SCRIPTS || !SCRIPTS.length) return;
  const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const startIdx = SCRIPTS.findIndex(m => m.id === S.script);
  scriptBrowseIndex = startIdx === -1 ? 0 : startIdx;

  const overlay = el('div', 'script-picker-overlay');

  const header = el('div', 'settings-header');
  header.append(el('h2', null, 'Choose a script'));
  const closeBtn = withIcon(el('button', 'ghostbtn', 'Close'), 'close');
  closeBtn.onclick = () => closeOverlay();
  header.append(closeBtn);
  overlay.append(header);

  const list = el('div', 'script-list');
  const detail = el('div', 'script-detail');
  const split = el('div', 'script-picker-split');
  split.append(list, detail);
  const body = el('div', 'script-picker-body');
  body.append(split);
  overlay.append(body);

  const footer = el('div', 'script-picker-footer');
  overlay.append(footer);

  document.body.append(overlay);
  requestAnimationFrame(() => overlay.classList.add('show'));

  function onKey(e) {
    if (e.key === 'ArrowUp') step(-1);
    else if (e.key === 'ArrowDown') step(1);
    else if (e.key === 'Enter') confirmChoice();
    else if (e.key === 'Escape') closeOverlay();
  }
  document.addEventListener('keydown', onKey);

  function closeOverlay() {
    document.removeEventListener('keydown', onKey);
    if (reduceMotion()) { overlay.remove(); return; }
    overlay.classList.remove('show');
    setTimeout(() => overlay.remove(), 200);
  }

  function jump(i) { scriptBrowseIndex = i; renderAll(); }
  function step(delta) { jump((scriptBrowseIndex + delta + SCRIPTS.length) % SCRIPTS.length); }

  let confirmBtn = null;
  function confirmChoice() {
    const meta = SCRIPTS[scriptBrowseIndex];
    if (meta.playable === false) return;
    confirmBtn.disabled = true;
    post('/api/table/script', { script: meta.id }).then(r => {
      if (r.error) { confirmBtn.disabled = false; alert(r.error); return; }
      closeOverlay();
    });
  }

  function buildList() {
    list.innerHTML = '';
    SCRIPTS.forEach((m, i) => {
      const locked = m.playable === false;
      const row = el('button', 'script-list-row' + (i === scriptBrowseIndex ? ' browsed' : '') + (locked ? ' locked' : ''));
      row.append(scriptBadge(m));

      const nameWrap = el('div', 'script-list-row-name');
      nameWrap.append(el('h4', null, m.name), scriptDifficultyRow(m));
      row.append(nameWrap);

      if (m.id === S.script) {
        const activeDot = el('span', 'script-list-row-active-dot');
        activeDot.title = 'Current script';
        row.append(activeDot);
      }
      if (locked) row.append(el('span', 'badge-soon', 'Soon'));

      row.onclick = () => jump(i);
      list.append(row);
    });
  }

  function buildDetail() {
    const meta = SCRIPTS[scriptBrowseIndex];
    const inner = el('div', 'script-detail-inner' + (reduceMotion() ? '' : ' stepping'));
    inner.append(scriptDetailBody(meta));
    detail.innerHTML = '';
    detail.append(inner);
    if (!reduceMotion()) requestAnimationFrame(() => inner.classList.remove('stepping'));

    const locked = meta.playable === false;
    footer.innerHTML = '';
    confirmBtn = locked
      ? el('button', 'primary', 'Coming soon')
      : withIcon(el('button', 'primary', `Choose ${meta.name}`), 'check');
    confirmBtn.disabled = locked;
    confirmBtn.onclick = confirmChoice;
    footer.append(confirmBtn);
  }

  function renderAll() {
    // The list re-renders instantly (which row is highlighted is cheap
    // feedback that should feel immediate); the bigger detail pane gets one
    // last fade-out first if it's not the very first render, same idiom the
    // carousel's focal card used, just retargeted at this container.
    buildList();
    const currentInner = detail.children[0];
    if (currentInner && !reduceMotion()) {
      currentInner.classList.add('stepping');
      setTimeout(buildDetail, 140);
    } else {
      buildDetail();
    }
  }

  renderAll();
}

/* Everything here is already public at the table — nobody's role, just the
   shape of the day. Same rule the rest of this screen already follows. */
function dayReport() {
  const executedToday = S.deaths.find(d => d.night === S.nightNumber && d.cause === 'execution');
  const dead = S.players.filter(p => !p.alive);
  const box = el('div', 'dayreport');
  const title = el('div', 'dayreport-title');
  title.append(wrapIcon('sun', 14), el('span', null, `Day ${S.nightNumber} report`));
  box.append(title);
  const rows = el('div', 'dayreport-rows');
  [
    ['Seated', S.players.length],
    ['Alive', S.players.filter(p => p.alive).length],
    ['Executed today', executedToday ? executedToday.name : '—'],
    ['Ghost votes spent', `${dead.filter(p => p.ghostVoteUsed).length} / ${dead.length}`],
  ].forEach(([lbl, val]) => {
    const stat = el('div', 'stat');
    stat.append(el('div', 'stat-n mono', String(val)), el('div', 'stat-lbl', lbl));
    rows.append(stat);
  });
  box.append(rows);
  return box;
}

/** How the whole game actually went, not just today — same tile layout as
    dayReport(), built from the gameSummary the server only ever sends once
    revealed (voting accuracy, who voted which way, is all otherwise kept
    close, same as any character info). */
function gameSummaryCard(gs) {
  const box = el('div', 'dayreport');
  const title = el('div', 'dayreport-title');
  title.append(wrapIcon('scroll', 14), el('span', null, 'This game'));
  box.append(title);

  const survivorText = survivor ? `${survivor.name}${survivor.survived ? ' — made it' : ' — fell N' + survivor.night}` : '—';
  [
    ['Nominations', String(gs.nominations), true],
    ['Town accuracy', gs.voteAccuracy == null ? '—' : Math.round(gs.voteAccuracy * 100) + '%', true],
    ['Ghost votes used', `${gs.ghostVotesUsed} / ${gs.ghostVotesEligible}`, true],
    ['Longest-lived evil', survivorText, false],
  ].forEach(([lbl, val, mono]) => {
    const stat = el('div', 'stat');
    stat.append(el('div', 'stat-n' + (mono ? ' mono' : ''), val), el('div', 'stat-lbl', lbl));

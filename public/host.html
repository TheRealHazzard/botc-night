<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Clocktower Wakes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:wght@400;600;700&family=Spectral:ital,wght@0,400;0,500;1,400&family=Space+Mono:wght@700&display=swap">
<style>
:root{
  --void:#0a0806;
  --ash:#151009;
  --smoke:#241b12;
  --bone:#e8dcc4;
  --bone-dim:#95886e;
  --bone-faint:#5f5645;
  --oxblood:#8e2226;
  --oxblood-hi:#a92c2f;
  --ember:#c4553a;
  --brass:#b8863f;
  --good:#5c86ab;
  --good-hi:#7aa0c2;
  --surface:#130e08;
  --surface-2:#1b130a;
  --line:#2a1e14;
  --line-soft:#20170e;
  /* The brand/accent color, everywhere except semantic uses (danger,
     death, urgency) that must stay oxblood regardless of who's winning.
     Set inline once a game ends, so the room's own color read shifts with
     the result — cleared back to this default the moment a new game starts. */
  --primary: var(--oxblood);
  --primary-hi: var(--oxblood-hi);
}
*{box-sizing:border-box}
html,body{height:100%; overflow:hidden}
body{
  margin:0; height:100vh; height:100dvh; background:var(--void); color:var(--bone);
  font-family:'Spectral',Georgia,serif;
  display:flex; flex-direction:column;
  /* A soft grain instead of the old radial vignette — a smooth multi-stop
     gradient over this much dark area is exactly the case TV panels band
     on. A small repeating noise tile reads as aged parchment/candlelit
     texture instead, and has no smooth transition left to band. */
  background-image:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScxMjAnIGhlaWdodD0nMTIwJz48ZmlsdGVyIGlkPSduJz48ZmVUdXJidWxlbmNlIHR5cGU9J2ZyYWN0YWxOb2lzZScgYmFzZUZyZXF1ZW5jeT0nMC44NScgbnVtT2N0YXZlcz0nMicgc3RpdGNoVGlsZXM9J3N0aXRjaCcvPjxmZUNvbG9yTWF0cml4IHR5cGU9J3NhdHVyYXRlJyB2YWx1ZXM9JzAnLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0nMTAwJScgaGVpZ2h0PScxMDAlJyBmaWx0ZXI9J3VybCgjbiknIG9wYWNpdHk9JzAuMDUnLz48L3N2Zz4=");
  background-repeat:repeat;
}
.mono{font-family:'Space Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums}

/* ---------------------------------------------------------------- icons */
.icon{width:1em; height:1em; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; vertical-align:-.15em}

/* --------------------------------------------------------------- header */
header{
  flex:0 0 auto;
  display:flex; align-items:center; justify-content:space-between; gap:20px;
  padding:14px 40px; border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:11px}
.brand .icon{width:24px; height:24px; color:var(--primary)}
.mark{font-family:'Cinzel Decorative',Georgia,serif; font-size:1.2rem; color:var(--primary); letter-spacing:.05em}
.phase{
  display:flex; align-items:center; gap:9px;
  font-size:.72rem; text-transform:uppercase; letter-spacing:.2em; color:var(--bone-dim);
  border:1px solid var(--line); border-radius:999px; padding:8px 18px 8px 14px;
}
.phase .icon{width:15px; height:15px; color:var(--brass)}

main{
  flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:20px 40px; text-align:center; gap:16px; width:100%; overflow:hidden;
}
/* No cap here on purpose — a TV screen's whole width is real estate the
   dashboard below should actually use (its own side columns pin themselves
   to the edges and the ring fills whatever's left), not a fixed column
   floating centered in a sea of unused black. */
.view{width:100%; min-height:0; display:flex; flex-direction:column; align-items:center; gap:16px}
#stage, #controls{transition:opacity .38s ease}
#stage.fading, #controls.fading{opacity:0}
@media (prefers-reduced-motion:reduce){#stage,#controls{transition:none}}

.narration{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:clamp(1.8rem,4.4vw,3.4rem); line-height:1.22; max-width:22ch;
  text-wrap:balance; color:var(--bone);
}
.narration.dread{color:var(--ember)}
.sub{color:var(--bone-dim); max-width:56ch; font-size:1.05rem}

.clockwrap{display:grid; place-items:center; width:100%; height:100%}
.clockwrap > *{grid-area:1/1}
.clockwrap svg{width:100%; height:100%}
.ring-svg{color:var(--oxblood); transition:stroke-dashoffset 1s linear}
.ring-svg.urgent{color:var(--ember)}
.clock{
  font-family:'Cinzel Decorative',Georgia,serif; font-size:clamp(1.8rem,5vw,3.2rem);
  color:var(--oxblood); font-variant-numeric:tabular-nums; line-height:1;
  text-shadow:0 0 34px rgba(142,34,38,.42);
}
.clock.urgent{color:var(--ember); animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.clock.urgent{animation:none}}

/* the town, laid out as it sits at the table — sized to fill whichever of
   the stage's two dimensions is tighter, now that the dashboard's own side
   columns (not this) are what pin the layout to the screen's edges, so the
   ring is free to grow into genuinely all the space that's left. */
.ring{position:relative; width:min(68vh,42vw,900px); height:min(68vh,42vw,900px); margin:0 auto; flex-shrink:0}
.ring::before{content:''; position:absolute; inset:9%; border:1px dashed var(--line); border-radius:50%}
.rseat{
  position:absolute; transform:translate(-50%,-50%); white-space:nowrap;
  display:flex; flex-direction:column; align-items:center; gap:7px;
}
.rseat-avatar{
  position:relative; width:88px; height:88px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-family:'Cinzel Decorative',Georgia,serif; font-size:1.9rem; font-weight:700;
  color:var(--bone); background:var(--surface-2); border:3px solid var(--line);
}
.rseat-avatar .icon{width:36px; height:36px}
/* Rounded on the image itself, not via overflow:hidden on the parent — the
   parent has to stay unclipped so the team badge below can sit half outside
   the circle instead of getting cut off at the avatar's own edge. */
.rseat-token{width:100%; height:100%; object-fit:cover; display:block; border-radius:50%}
.rseat-avatar .team-badge{
  position:absolute; right:-3px; bottom:-3px; width:26px; height:26px; border-radius:50%;
  object-fit:cover; border:2px solid var(--surface); background:var(--surface-2);
}
/* The real table's shroud: a dark cloth laid over a dead player's token,
   not swapped for a different picture — same idea here, a dimming veil
   over their own true likeness rather than replacing it with an icon. */
.rseat-avatar.shrouded::after{
  content:''; position:absolute; inset:0; border-radius:50%;
  background:rgba(8,6,4,.72); backdrop-filter:grayscale(1);
}
.rseat-name{font-size:clamp(.92rem,1.6vw,1.12rem); color:var(--bone)}
/* Dead reads as an unmistakably different shape at a glance from across a
   room — a skull in place of the initial, not just a smaller/greyer dot. */
.rseat.dead .rseat-avatar{background:var(--surface) !important; border-color:var(--line-soft) !important; color:var(--bone-faint) !important}
.rseat.dead .rseat-name{color:var(--bone-faint); text-decoration:line-through}
.rseat.offline .rseat-avatar{opacity:.5}
/* Past ~10 seats the ring gets crowded enough that full-size avatars would
   start to overlap their neighbours — this keeps them from ever touching. */
.ring.dense .rseat-avatar{width:64px; height:64px; font-size:1.3rem; border-width:2px}
.ring.dense .rseat-avatar .icon{width:26px; height:26px}
.ring.dense .rseat-avatar .team-badge{width:20px; height:20px; border-width:1.5px}
.ring.dense .rseat-name{font-size:.88rem}

.daycounter{
  font-family:'Cinzel Decorative',Georgia,serif; font-size:.8rem; text-transform:uppercase; letter-spacing:.28em;
  color:var(--brass); display:flex; align-items:center; gap:10px; justify-content:center;
}
.daycounter .icon{width:15px; height:15px}

#reclaimBanner{display:flex; flex-direction:column; gap:8px; padding:0 40px}
#reclaimBanner:empty{display:none}
.reclaim{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:space-between;
  border:1px solid var(--brass); background:#1a1206; border-radius:8px; padding:12px 18px; margin-top:14px;
}
.reclaim .ask{display:flex; align-items:center; gap:9px; font-family:'Cormorant Garamond',Georgia,serif; font-size:1.15rem; color:var(--brass)}
.reclaim .btns{display:flex; gap:8px}
.reclaim button{width:auto; margin:0}

/* ---------------------------------------------------------------- lobby */
.joinbar{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:center;
  border:1px solid var(--line); border-radius:999px; background:var(--surface);
  padding:10px 10px 10px 22px;
}
.joinbar .lbl{display:flex; align-items:center; gap:8px; color:var(--bone-dim); font-size:.92rem}
.joinbar .lbl .icon{width:16px; height:16px; color:var(--brass)}
.joinaddr{
  font-family:'Cinzel Decorative',Georgia,serif; font-size:1.3rem; color:var(--brass);
  border-radius:999px; padding:9px 22px; background:var(--surface-2); border:1px solid var(--line);
}

.script-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:24px; width:100%}
.script-card{
  position:relative; text-align:center; border:1px solid var(--line); border-radius:16px;
  background:var(--surface); padding:30px 26px 24px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:16px;
  transition:border-color .15s ease, background .15s ease, transform .15s ease;
}
.script-card:hover{border-color:var(--brass); transform:translateY(-2px)}
.script-card.active{border-color:var(--oxblood); background:linear-gradient(165deg,#1c0f0e,#130e08 65%)}
.script-card.locked{cursor:not-allowed}
.script-card.locked:hover{transform:none; border-color:var(--line)}
.script-card.locked .card-head, .script-card.locked .desc{opacity:.4}
@media (prefers-reduced-motion:reduce){.script-card{transition:none}}

.card-head{display:flex; flex-direction:column; align-items:center; gap:12px}
.icon-badge{
  width:120px; height:120px; border-radius:50%; display:grid; place-items:center; flex-shrink:0;
  background:var(--surface-2); border:2px solid var(--line); color:var(--brass);
}
.script-card.active .icon-badge{border-color:var(--oxblood); color:var(--ember)}
.icon-badge .icon{width:46px; height:46px}
.icon-badge img{width:100%; height:100%; object-fit:cover; border-radius:50%}
.card-head h3{margin:0; font-family:'Cinzel Decorative',Georgia,serif; font-size:1.4rem; color:var(--bone); font-weight:700; line-height:1.2}
.difficulty{display:flex; align-items:center; justify-content:center; gap:7px; font-size:.68rem; text-transform:uppercase; letter-spacing:.14em; color:var(--bone-dim)}
.difficulty .dots{display:flex; gap:3px}
.difficulty .dot{width:6px; height:6px; border-radius:50%; background:var(--line)}
.difficulty .dot.on{background:var(--brass)}

.desc{font-size:.92rem; color:var(--bone-dim); line-height:1.6; max-width:36ch}

.script-stats{display:flex; flex-direction:column; align-items:center; gap:12px; width:100%; padding-top:16px; border-top:1px dashed var(--line-soft)}
.script-counts{display:flex; align-items:center; gap:20px; flex-wrap:wrap; justify-content:center}
.script-stat{display:flex; align-items:center; gap:7px; font-size:.82rem; color:var(--bone-dim)}
.script-stat .icon{width:15px; height:15px; color:var(--brass)}
.script-stat b{color:var(--bone)}
.winchips{display:flex; gap:10px; width:100%}
.winchip{flex:1; border-radius:8px; padding:10px 6px; text-align:center; font-size:.78rem}
.winchip .n{display:block; font-family:'Space Mono',monospace; font-size:1.2rem; margin-bottom:2px}
.winchip.good{background:rgba(92,134,171,.12); border:1px solid var(--good); color:var(--good)}
.winchip.evil{background:rgba(142,34,38,.12); border:1px solid var(--oxblood); color:var(--ember)}

.badge-corner{position:absolute; top:18px; right:18px}
.badge-check{
  width:24px; height:24px; border-radius:50%; background:var(--oxblood); color:#fff2e8;
  display:grid; place-items:center;
}
.badge-check .icon{width:13px; height:13px}
.badge-soon{
  font-size:.62rem; text-transform:uppercase; letter-spacing:.12em; color:var(--bone-dim);
  border:1px solid var(--line); border-radius:999px; padding:4px 11px;
}

.waitingroom{display:flex; flex-direction:column; align-items:center; gap:18px; width:100%; padding-top:6px}
.waitingroom-title{font-size:.72rem; text-transform:uppercase; letter-spacing:.2em; color:var(--bone-dim); display:flex; align-items:center; gap:8px}
.waitingroom-title .icon{width:14px; height:14px; color:var(--brass)}

.hint{
  display:flex; align-items:flex-start; gap:12px;
  border-left:2px solid var(--oxblood); padding:16px 24px; max-width:52ch;
  font-style:italic; color:#cbb894; font-size:1.15rem; text-align:left; background:var(--surface); border-radius:0 8px 8px 0;
}
.hint .icon{width:18px; height:18px; margin-top:3px; color:var(--oxblood); flex-shrink:0; font-style:normal}

/* Deliberately not styled like .hint above — a wiki fact is a curiosity for
   idle hands, not a Storyteller's dread-toned warning, so it gets brass
   instead of oxblood and no italic urgency. */
.trivia{
  display:flex; align-items:flex-start; gap:10px;
  border-left:2px solid var(--brass); padding:12px 20px; max-width:52ch;
  color:var(--bone-dim); font-size:.95rem; text-align:left; background:var(--surface); border-radius:0 8px 8px 0;
}
.trivia .icon{width:16px; height:16px; margin-top:2px; color:var(--brass); flex-shrink:0}

/* ---------------------------------------------------------- the dashboard
   Center is always the ring — the one thing everyone at the table actually
   watches — with contextual side panels for whatever info/controls that
   phase needs, instead of stacking everything in one tall column above the
   ring (which is what pushed content below the fold in the first place).
   Column count is set inline per call, since night only ever needs a right
   panel while day needs both. */
.dashboard{display:grid; gap:36px; width:100%; align-items:start}
@media (max-width:860px){.dashboard{grid-template-columns:1fr !important}}
.stage-main{display:flex; flex-direction:column; align-items:center; gap:14px; min-width:0}
.sidepanel{display:flex; flex-direction:column; gap:14px; text-align:left; min-width:0}
/* Reveal / New game used to float as a quiet corner link, visually
   disconnected from the bordered buttons below — now it's just the first
   row in the same stack, same border, same weight, same gap rhythm. */
.control-panel{display:flex; gap:8px}
.control-panel button{flex:1; margin:0}

.roster-group-title{
  display:flex; align-items:baseline; justify-content:space-between; gap:8px;
  font-size:.66rem; text-transform:uppercase; letter-spacing:.16em; color:var(--bone-dim);
  margin:16px 0 8px;
}
.roster-group-title:first-child{margin-top:0}
.roster-group-count{color:var(--bone-faint); font-family:'Space Mono',monospace; letter-spacing:0}
.roster-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(72px,1fr)); gap:10px}
.roster-token{
  width:100%; aspect-ratio:1; border-radius:50%; object-fit:cover;
  border:1px solid var(--line); background:var(--surface-2); display:block;
}
.roster-token-fallback{
  width:100%; aspect-ratio:1; border-radius:50%; background:var(--surface-2); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:.66rem; color:var(--bone-dim); text-align:center; padding:3px;
}
.sidepanel-card{border:1px solid var(--line); border-radius:12px; background:var(--surface); padding:18px 20px}
.sidepanel-title{
  font-size:.68rem; text-transform:uppercase; letter-spacing:.18em; color:var(--bone-dim);
  display:flex; align-items:center; gap:8px; margin-bottom:12px;
}
.sidepanel-title .icon{width:13px; height:13px; color:var(--brass)}
.sidepanel .timerbox{max-width:170px; margin:0 auto 10px}
.sidepanel-actions{display:flex; flex-direction:column; gap:8px}
.sidepanel-actions button, .sidepanel-actions select{width:100%; margin:0}
button.ghost{
  width:auto; margin:0; padding:9px 16px; font-size:.9rem;
  border:1px solid var(--brass); color:var(--brass); background:var(--surface-2);
}
button.ghost.spent{
  border-color:var(--line-soft); color:var(--bone-faint); text-decoration:line-through; background:var(--surface);
}
.deaths{font-size:1.3rem; color:var(--ember); display:flex; align-items:center; gap:10px; justify-content:center}
.deaths .icon{width:20px; height:20px}

.dayreport{width:100%; border:1px solid var(--line); border-radius:12px; background:var(--surface); padding:18px}
.dayreport-title{font-size:.72rem; text-transform:uppercase; letter-spacing:.2em; color:var(--bone-dim); margin-bottom:12px; display:flex; align-items:center; gap:8px; justify-content:flex-start}
.dayreport-title .icon{width:14px; height:14px; color:var(--brass)}
.dayreport-rows{display:flex; gap:10px; flex-wrap:wrap}
.stat{flex:1; min-width:110px; border:1px solid var(--line); border-radius:8px; padding:12px; background:var(--surface-2); display:flex; flex-direction:column; align-items:flex-start; gap:2px}
.stat-n{font-size:1.35rem; color:var(--brass)}
.stat-lbl{font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--bone-dim)}

.career{font-size:.78rem; color:var(--brass); margin-top:2px; display:flex; align-items:center; gap:6px}
.career .icon{width:12px; height:12px}

.nompanel{width:100%; border:1px solid var(--line); border-radius:12px; padding:18px 20px; background:var(--surface); text-align:left}
.nomlist{margin-bottom:10px}
.nomline{font-size:.88rem; color:var(--bone-dim); padding:6px 0; border-bottom:1px dashed var(--line-soft); display:flex; align-items:center; gap:8px}
.nomline .icon{width:13px; height:13px; color:var(--ember); flex-shrink:0}
.nomline:last-child{border-bottom:none}
.nomrow{display:flex; align-items:center; gap:10px; margin:10px 0; flex-wrap:wrap}
.nomrow select{min-width:0; flex:1}
.nomrow .icon{width:16px; height:16px; color:var(--bone-dim); flex-shrink:0}
.nomrow select{flex:1}
.voterlist{display:flex; flex-wrap:wrap; gap:8px 14px; margin:10px 0 16px}
.voterchip{display:flex; align-items:center; gap:6px; font-size:.85rem; color:var(--bone-dim); cursor:pointer}

.victory-banner{border:1px solid var(--primary); border-radius:12px; padding:18px 22px; margin-bottom:6px; background:var(--surface); display:flex; align-items:center; gap:16px; text-align:left}
.victory-banner .icon-badge{width:52px; height:52px; border-color:var(--primary); color:var(--primary)}
.victory-banner .icon-badge .icon{width:26px; height:26px}
.victory-banner .who{font-family:'Cinzel Decorative',Georgia,serif; font-size:1.4rem; color:var(--primary)}

/* A public gunshot that ends the game gets its own beat before the usual
   reveal fades in — a flat oxblood fill, not a gradient (a smooth radial
   over this much of the screen is exactly what banded on the TV before). */
.slayer-flash{
  position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
  background:var(--oxblood); color:#fff2e8; opacity:0; transition:opacity .35s ease;
}
.slayer-flash.show{opacity:1}
.slayer-flash .icon{width:88px; height:88px; animation:slayer-pulse 1.1s ease-in-out infinite}
.slayer-flash-text{font-family:'Cinzel Decorative',Georgia,serif; font-size:2.2rem; letter-spacing:.03em; text-align:center; padding:0 20px}
@keyframes slayer-pulse{0%,100%{transform:scale(1)} 50%{transform:scale(1.14)}}
@media (prefers-reduced-motion:reduce){.slayer-flash .icon{animation:none}}

/* A wide/tall grid like this scrolls in its own full-screen layer instead
   of squeezing into a sidepanel column or risking the dashboard's own
   fixed-height, no-page-scroll layout (main has overflow:hidden on
   purpose — anything that could outgrow it needs a lightbox like this). */
.powerlog-overlay{position:fixed; inset:0; z-index:45; background:var(--void); display:flex; flex-direction:column}
.powerlog-header{
  flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:16px 32px; border-bottom:1px solid var(--line);
}
.powerlog-header h2{margin:0; font-family:'Cinzel Decorative',Georgia,serif; font-size:1.3rem; color:var(--primary)}
.powerlog-body{flex:1; min-height:0; overflow:auto; padding:24px 32px}
.powerlog-table{border-collapse:collapse; width:max-content; min-width:100%}
.powerlog-table th, .powerlog-table td{border:1px solid var(--line); padding:8px 14px; text-align:left; white-space:nowrap; font-size:.86rem}
.powerlog-table th{
  background:var(--surface-2); position:sticky; top:0; z-index:1;
  color:var(--bone-dim); font-weight:600; text-transform:uppercase; font-size:.68rem; letter-spacing:.08em;
}
.powerlog-table td:first-child, .powerlog-table th:first-child{position:sticky; left:0; z-index:2; background:var(--surface)}
.powerlog-table th:first-child{z-index:3}
.powerlog-table td.used{color:var(--brass)}
.powerlog-table td.empty{color:var(--bone-faint)}
.powerlog-role-cell{display:flex; align-items:center; gap:10px}
.powerlog-role{display:block; color:var(--bone)}
.powerlog-name{display:block; font-size:.76rem; color:var(--bone-dim); font-weight:400; text-transform:none; letter-spacing:0}
.powerlog-token{width:36px; height:36px; border-radius:50%; object-fit:cover; border:1px solid var(--line); background:var(--surface-2); flex-shrink:0}
.powerlog-token-fallback{width:36px; height:36px; border-radius:50%; flex-shrink:0; background:var(--surface-2); border:1px solid var(--line)}
.powerlog-target{display:inline-flex; align-items:center; gap:5px}
.powerlog-target-token{width:18px; height:18px; border-radius:50%; object-fit:cover; border:1px solid var(--line); background:var(--surface-2); flex-shrink:0; vertical-align:middle}
.powerlog-target-token-fallback{width:18px; height:18px; border-radius:50%; flex-shrink:0; background:var(--surface-2); border:1px solid var(--line); display:inline-block; vertical-align:middle}

/* -------------------------------------------------------------- footer */
footer{flex:0 0 auto; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; padding:14px 40px; border-top:1px solid var(--line)}
button{
  display:inline-flex; align-items:center; gap:8px; justify-content:center;
  font-family:'Spectral',Georgia,serif; font-size:1rem; font-weight:600;
  background:var(--surface); color:var(--bone); border:1px solid var(--line); border-radius:8px;
  padding:11px 22px; cursor:pointer; letter-spacing:.02em;
  transition:border-color .15s ease, background .15s ease, color .15s ease;
}
button .icon{width:16px; height:16px}
button:hover:not(:disabled){border-color:var(--oxblood); color:#fff}
button:disabled{opacity:.32; cursor:not-allowed}
button.primary{background:var(--primary); border-color:var(--primary); color:#fff2e8}
button.primary:hover:not(:disabled){background:var(--primary-hi); border-color:var(--primary-hi)}
button.ghostbtn{background:transparent; border-color:transparent; color:var(--bone-dim)}
button.ghostbtn:hover:not(:disabled){color:var(--bone); border-color:var(--line)}
select{
  background:var(--surface); color:var(--bone); border:1px solid var(--line); border-radius:8px;
  padding:11px 14px; font-family:inherit; font-size:1rem;
}
:focus-visible{outline:2px solid var(--brass); outline-offset:2px}
@media (prefers-reduced-motion:reduce){button{transition:none}}

/* -------------------------------------------------------------- reveal */
/* Grows to fit however many players there are, rather than scrolling its
   own tiny window inside a page that otherwise never scrolls. */
.rosterlist{display:flex; flex-direction:column}
.rosterrow{padding:8px 6px; border-bottom:1px dashed var(--line-soft); border-left:3px solid transparent; padding-left:10px}
.rosterrow:last-child{border-bottom:none}
.rosterrow-top{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.rosterrole{font-size:.78rem; color:var(--bone-dim); text-align:right; flex-shrink:0}
.deadname{color:var(--bone-faint); text-decoration:line-through}
.log{max-width:100%; text-align:left; color:var(--bone-dim); font-size:.88rem; max-height:34vh; overflow:auto; border:1px solid var(--line); border-radius:8px; padding:14px 18px; background:var(--surface)}
.log p{margin:.3em 0}
</style>
</head>
<body>
<header>
  <span class="brand"><span id="brandIcon"></span><span class="mark">The Clocktower Wakes</span></span>
  <span class="phase" id="phase"></span>
</header>

<div id="reclaimBanner"></div>

<main><div class="view" id="stage"></div></main>

<footer id="controls"></footer>

<script>
/* ------------------------------------------------------------- icons */
// Hand-drawn, single-weight line icons — 24x24, stroke=currentColor. Kept
// to one small dictionary so every icon on the screen shares the same
// stroke width and cap style rather than mismatched glyphs from a library.
const ICON_PATHS = {
  moon: '<path d="M20 14.7A8.5 8.5 0 1 1 9.3 4a7 7 0 0 0 10.7 10.7Z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v3M12 18.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  skull: '<path d="M12 3a7 7 0 0 0-7 7c0 2.5 1.2 3.9 2 4.8V18h2v-1.6h2V18h2v-1.6h2V18h2v-3.2c.8-.9 2-2.3 2-4.8a7 7 0 0 0-7-7Z"/><circle cx="9.4" cy="10" r="1.05" fill="currentColor" stroke="none"/><circle cx="14.6" cy="10" r="1.05" fill="currentColor" stroke="none"/><path d="M11 21h2"/>',
  ghost: '<path d="M6 20V11a6 6 0 0 1 12 0v9l-2.2-1.6L14 20l-2-1.6L10 20l-1.8-1.6L6 20Z"/><circle cx="9.6" cy="10.6" r=".9" fill="currentColor" stroke="none"/><circle cx="14.4" cy="10.6" r=".9" fill="currentColor" stroke="none"/>',
  users: '<circle cx="8.6" cy="8" r="3"/><path d="M2.6 19c0-3.3 2.6-5.4 6-5.4s6 2.1 6 5.4"/><circle cx="16.6" cy="9" r="2.3"/><path d="M15 13.7c2.5.3 4.4 2.3 4.4 5.3"/>',
  check: '<path d="M5 13l4.5 4.5L19 8"/>',
  refresh: '<path d="M4 12a8 8 0 0 1 13.6-5.7M20 12a8 8 0 0 1-13.6 5.7"/><path d="M17.2 2.8v4h-4M6.8 21.2v-4h4"/>',
  eye: '<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.6"/>',
  trend: '<path d="M3 17l5-5 4 4 8.5-9.5"/><path d="M14.5 6h6v6"/>',
  mug: '<path d="M5.5 8h11v7a4 4 0 0 1-4 4h-3a4 4 0 0 1-4-4V8Z"/><path d="M16.5 9.5H18a2.3 2.3 0 0 1 0 4.6h-1.5"/><path d="M8.3 5.6c0-.9.7-1.3.7-2.2M11.7 5.6c0-.9.7-1.3.7-2.2"/>',
  cloud: '<path d="M7 18a4 4 0 0 1-.6-7.95A5.5 5.5 0 0 1 17 9a4.2 4.2 0 0 1-.6 9H7Z"/>',
  bolt: '<path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/>',
  scroll: '<path d="M6 4h11a2 2 0 0 1 2 2v13a1.5 1.5 0 0 1-3 0V6H8"/><path d="M6 4a2 2 0 0 0-2 2v11a2.5 2.5 0 0 0 2.5 2.5H16"/><path d="M8 8h6M8 11.5h6"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.3 2"/>',
  hand: '<path d="M4 22c0-5 2.6-8 5.5-8h5c2.9 0 5.5 3 5.5 8"/><circle cx="12" cy="7" r="4.5"/>',
  arrows: '<path d="M8 3v13M8 16l-3.5-3.5M8 16l3.5-3.5"/><path d="M16 21V8M16 8l-3.5 3.5M16 8l3.5 3.5"/>',
  bulb: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1.1 1.3 1.1 2.2h5c0-.9.5-1.7 1.1-2.2A6 6 0 0 0 12 3Z"/>',
  crosshair: '<circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><path d="M12 1.5v3.2M12 19.3v3.2M1.5 12h3.2M19.3 12h3.2"/>',
  close: '<path d="M5 5l14 14M19 5L5 19"/>',
};
function wrapIcon(name, size) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 24 24');
  s.setAttribute('class', 'icon');
  if (size) { s.style.width = size + 'px'; s.style.height = size + 'px'; }
  s.innerHTML = ICON_PATHS[name] || '';
  return s;
}

let S = null;
let SCRIPTS = null;
let spoken = '';
let TOKENS = {};
let JOIN_ADDR = null;
let SCRIPT_CHARS = null; // the current script's own roster, for the reference grid
let TRIVIA = [];
let triviaFact = null; // the line currently on screen — rerolled on its own timer, not on every render

const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
const withIcon = (btn, name) => { btn.prepend(wrapIcon(name, 15)); return btn; };

function speak(line, { dread = false } = {}) {
  if (!line || line === spoken) return;
  spoken = line;
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(line);
  u.rate = dread ? 0.78 : 0.86;
  u.pitch = dread ? 0.5 : 0.65;
  u.volume = 1;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function post(url, body) {
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  }).then(r => r.json());
}

/** A player's own color as a light tint (blended toward white) for an
    avatar's fill, keeping the full-strength hex for the border and the
    text — border and letter read as "their color," the fill just gives it
    somewhere to sit without turning the whole badge into a solid block. */
function lightenHex(hex, amount) {
  const n = parseInt(hex.replace('#', ''), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const light = c => Math.round(c + (255 - c) * amount);
  return `rgb(${light(r)}, ${light(g)}, ${light(b)})`;
}

/* The town square, laid out in the same circle the players actually sit in —
   the one shared visual everyone at the table looks at together. Once the
   game is revealed, each seat shows that player's real character token
   instead of their colored initial, with a dark "shroud" veil over anyone
   dead — the same idea as the physical shroud token laid over a role at
   the real table, not a different picture swapped in for a dead one. */
function ringSeats(players, { revealed = false } = {}) {
  const wrap = el('div', 'ring' + (players.length > 10 ? ' dense' : ''));
  const n = players.length;
  players.forEach((p, i) => {
    const angle = (i / n) * 2 * Math.PI - Math.PI / 2;
    const left = 50 + 41 * Math.cos(angle);
    const top = 50 + 41 * Math.sin(angle);
    const s = el('div', 'rseat' + (p.alive ? '' : ' dead') + (p.connected ? '' : ' offline'));
    s.style.left = left + '%';
    s.style.top = top + '%';

    const avatar = el('div', 'rseat-avatar');
    const showFallbackInitial = () => {
      avatar.textContent = (p.name[0] || '?').toUpperCase();
      if (p.color && p.connected) {
        avatar.style.borderColor = p.color.hex;
        avatar.style.background = lightenHex(p.color.hex, 0.78);
        avatar.style.color = p.color.hex;
      }
    };

    if (revealed) {
      const src = TOKENS[p.characterId];
      if (src) {
        const img = document.createElement('img');
        img.className = 'rseat-token';
        img.src = src;
        img.alt = '';
        img.onerror = () => { img.remove(); showFallbackInitial(); };
        avatar.append(img);
        if (p.color) avatar.style.borderColor = p.color.hex;
        if (!p.alive) avatar.classList.add('shrouded');
        if (p.team) {
          const teamBadge = document.createElement('img');
          teamBadge.className = 'team-badge';
          teamBadge.src = '/team-icons/' + p.team + '.png';
          teamBadge.alt = '';
          teamBadge.onerror = () => teamBadge.remove();
          avatar.append(teamBadge);
        }
      } else {
        showFallbackInitial();
      }
    } else if (!p.alive) {
      // Dead reads as a genuinely different shape (a skull, not just a
      // smaller/greyer version of the same badge) — legible from across a
      // real room, not just up close. A chosen color only shows through in
      // the normal alive-and-connected state, so it never masks a problem
      // (dead or disconnected) worth noticing.
      avatar.append(wrapIcon('skull', 26));
    } else {
      showFallbackInitial();
    }
    s.append(avatar, el('span', 'rseat-name', p.name));
    wrap.append(s);
  });
  return wrap;
}

/** The ring always owns the center. Left and right use the exact same
    column width whenever both are present, so the center track — and the
    ring inside it — sits genuinely in the middle of the screen rather than
    just the middle of whatever's left over between two mismatched panels. */
function dashboardLayout({ left, main, right }) {
  const dash = el('div', 'dashboard');
  const cols = [];
  // The side columns pin to the screen's edges at a comfortable reading
  // width; the ring's own 1fr track is what actually absorbs a wide TV's
  // remaining space, same effect as flex's justify-content:space-between
  // would give a 3-up row, but with a middle track that can grow.
  if (left) cols.push('minmax(300px,400px)');
  cols.push('1fr');
  if (right) cols.push('minmax(300px,400px)');
  dash.style.gridTemplateColumns = cols.join(' ');
  if (left) dash.append(left);
  dash.append(main);
  if (right) dash.append(right);
  return dash;
}

function sidepanelCard(iconName, title) {
  const card = el('div', 'sidepanel-card');
  const t = el('div', 'sidepanel-title');
  t.append(wrapIcon(iconName, 13), el('span', null, title));
  card.append(t);
  return card;
}

function dayCounterLabel(text) {
  const label = el('div', 'daycounter');
  label.append(wrapIcon(text.startsWith('Night') ? 'moon' : 'sun', 14), el('span', null, text));
  return label;
}

/** Whichever facts actually apply to tonight's script — a Bad Moon Rising
    game has no business surfacing a Trouble Brewing character's trivia. */
function eligibleTrivia() {
  return TRIVIA.filter(t => !t.scripts || t.scripts.includes(S.script));
}

function voteIsOpen() {
  return !!(S && S.nominations.some(n => n.day === S.nightNumber && !n.closed));
}

/** Rerolled on its own timer (see the interval near the bottom of this
    file), not on every render — a fact that changed every time someone cast
    a vote would be more distracting than idle time ever was. */
function rollTrivia() {
  const pool = eligibleTrivia();
  if (!pool.length) { triviaFact = null; return; }
  if (pool.length === 1) { triviaFact = pool[0].fact; return; }
  let next;
  do { next = pool[Math.floor(Math.random() * pool.length)].fact; } while (next === triviaFact);
  triviaFact = next;
}

function triviaLine() {
  if (!triviaFact) rollTrivia();
  if (!triviaFact) return null;
  const box = el('div', 'trivia');
  box.append(wrapIcon('bulb', 15), el('span', null, triviaFact));
  return box;
}

/** Every character that could possibly turn up this game — not who's
    actually holding them, just the script's own roster, laid out as small
    portraits. Fills what would otherwise be an empty side of the screen,
    and doubles as a reference the table can glance at all night. Fetched
    once per script and cached, same pattern as TOKENS/SCRIPTS. */
const TEAM_LABELS = { townsfolk: 'Townsfolk', outsider: 'Outsiders', minion: 'Minions', demon: 'Demons' };
const TEAM_ORDER = ['townsfolk', 'outsider', 'minion', 'demon'];

/** The whole left panel, once nothing else shares it with this card — worth
    isolating by type rather than one flat grid, so "how many minions are
    even in this script" is a glance instead of a count. */
function scriptRosterCard() {
  const card = sidepanelCard('scroll', `In this script${SCRIPT_CHARS ? ' (' + SCRIPT_CHARS.length + ')' : ''}`);
  if (!SCRIPT_CHARS) { card.append(el('div', 'roster-grid')); return card; }

  const byTeam = {};
  SCRIPT_CHARS.forEach(c => { (byTeam[c.team] = byTeam[c.team] || []).push(c); });

  TEAM_ORDER.filter(team => byTeam[team] && byTeam[team].length).forEach(team => {
    const heading = el('div', 'roster-group-title');
    heading.append(el('span', null, TEAM_LABELS[team] || team), el('span', 'roster-group-count', String(byTeam[team].length)));
    card.append(heading);

    const grid = el('div', 'roster-grid');
    byTeam[team].forEach(c => {
      const src = TOKENS[c.id];
      let node;
      if (src) {
        node = document.createElement('img');
        node.className = 'roster-token';
        node.src = src;
        node.alt = c.name;
        node.title = c.name;
        node.onerror = () => { node.replaceWith(fallbackToken(c.name)); };
      } else {
        node = fallbackToken(c.name);
      }
      grid.append(node);
    });
    card.append(grid);
  });
  return card;
}

function fallbackToken(name) {
  const f = el('div', 'roster-token-fallback', name);
  f.title = name;
  return f;
}

/** Reveal-everything / new-game live at the top of whatever control panel
    the phase has, not in a separate footer bar competing for attention
    with the actual primary action underneath it — same bordered button
    look as everything below, so the whole panel reads as one stack. */
function controlPanelRow() {
  const row = el('div', 'control-panel');
  const reveal = withIcon(el('button', null, 'Reveal'), 'eye');
  reveal.onclick = () => confirm('End the game and reveal every role?') && post('/api/table/reveal');
  const reset = withIcon(el('button', null, 'New game'), 'refresh');
  reset.onclick = () => confirm('Clear the table and start over?') && post('/api/table/reset').then(() => location.reload());
  row.append(reveal, reset);
  return row;
}

/* --------------------------------------------------------- script cards */
const SCRIPT_ICON = { tb: 'mug', bmr: 'cloud', sv: 'eye' };

function scriptCard(meta, active) {
  const locked = meta.playable === false;
  const card = el('div', 'script-card' + (active ? ' active' : '') + (locked ? ' locked' : ''));

  const head = el('div', 'card-head');
  const badge = el('div', 'icon-badge');
  // The real script logo when one's been dropped in; the hand-drawn icon
  // is the fallback, not a second thing shown alongside it.
  const logoImg = document.createElement('img');
  logoImg.src = '/scripts/' + meta.id + '.png';
  logoImg.alt = '';
  logoImg.onerror = () => { logoImg.remove(); badge.prepend(wrapIcon(SCRIPT_ICON[meta.id] || 'scroll', 22)); };
  badge.append(logoImg);
  const titleWrap = el('div');
  titleWrap.append(el('h3', null, meta.name));
  const diff = el('div', 'difficulty');
  const dots = el('div', 'dots');
  for (let i = 1; i <= 3; i++) dots.append(el('span', 'dot' + (i <= meta.difficulty ? ' on' : '')));
  diff.append(dots, el('span', null, ['', 'Easy', 'Medium', 'Hard'][meta.difficulty] || ''));
  titleWrap.append(diff);
  head.append(badge, titleWrap);
  card.append(head);

  card.append(el('div', 'desc', meta.description || ''));

  const stats = el('div', 'script-stats');
  const charStat = el('div', 'script-stat');
  charStat.append(wrapIcon('scroll', 14), el('b', null, String(meta.characterCount || 0)), el('span', null, ' characters'));
  const gamesStat = el('div', 'script-stat');
  gamesStat.append(wrapIcon('users', 14), el('b', null, String(meta.gamesPlayed || 0)), el('span', null, meta.gamesPlayed === 1 ? ' game played' : ' games played'));
  const countsRow = el('div', 'script-counts');
  countsRow.append(charStat, gamesStat);
  stats.append(countsRow);

  if (meta.goodWinRate != null) {
    const goodPct = Math.round(meta.goodWinRate * 100);
    const evilPct = 100 - goodPct;
    const chips = el('div', 'winchips');
    const good = el('div', 'winchip good');
    good.append(el('span', 'n', goodPct + '%'), el('span', null, 'Good wins'));
    const evil = el('div', 'winchip evil');
    evil.append(el('span', 'n', evilPct + '%'), el('span', null, 'Evil wins'));
    chips.append(good, evil);
    stats.append(chips);
  }
  card.append(stats);

  const corner = el('div', 'badge-corner');
  if (locked) {
    corner.append(el('span', 'badge-soon', 'Coming soon'));
  } else if (active) {
    const chk = el('div', 'badge-check');
    chk.append(wrapIcon('check', 12));
    corner.append(chk);
  }
  card.append(corner);

  if (!locked) {
    card.onclick = () => post('/api/table/script', { script: meta.id }).then(r => r.error && alert(r.error));
  }
  return card;
}

/* Everything here is already public at the table — nobody's role, just the
   shape of the day. Same rule the rest of this screen already follows. */
function dayReport() {
  const executedToday = S.deaths.find(d => d.night === S.nightNumber && d.cause === 'execution');
  const dead = S.players.filter(p => !p.alive);
  const box = el('div', 'dayreport');
  const title = el('div', 'dayreport-title');
  title.append(wrapIcon('sun', 14), el('span', null, `Day ${S.nightNumber} report`));
  box.append(title);
  const rows = el('div', 'dayreport-rows');
  [
    ['Seated', S.players.length],
    ['Alive', S.players.filter(p => p.alive).length],
    ['Executed today', executedToday ? executedToday.name : '—'],
    ['Ghost votes spent', `${dead.filter(p => p.ghostVoteUsed).length} / ${dead.length}`],
  ].forEach(([lbl, val]) => {
    const stat = el('div', 'stat');
    stat.append(el('div', 'stat-n mono', String(val)), el('div', 'stat-lbl', lbl));
    rows.append(stat);
  });
  box.append(rows);
  return box;
}

/** How the whole game actually went, not just today — same tile layout as
    dayReport(), built from the gameSummary the server only ever sends once
    revealed (voting accuracy, who voted which way, is all otherwise kept
    close, same as any character info). */
function gameSummaryCard(gs) {
  const box = el('div', 'dayreport');
  const title = el('div', 'dayreport-title');
  title.append(wrapIcon('scroll', 14), el('span', null, 'This game'));
  box.append(title);
  const rows = el('div', 'dayreport-rows');
  const survivor = gs.longestSurvivingEvil;
  const survivorText = survivor ? `${survivor.name}${survivor.survived ? ' — made it' : ' — fell N' + survivor.night}` : '—';
  [
    ['Nominations', String(gs.nominations), true],
    ['Town accuracy', gs.voteAccuracy == null ? '—' : Math.round(gs.voteAccuracy * 100) + '%', true],
    ['Ghost votes used', `${gs.ghostVotesUsed} / ${gs.ghostVotesEligible}`, true],
    ['Longest-lived evil', survivorText, false],
  ].forEach(([lbl, val, mono]) => {
    const stat = el('div', 'stat');
    stat.append(el('div', 'stat-n' + (mono ? ' mono' : ''), val), el('div', 'stat-lbl', lbl));
    rows.append(stat);
  });
  box.append(rows);
  return box;
}

/** Tonight's own mini-leaderboard, fetched once — self-removing if there's
    only this one game so far, since it has nothing to compare against yet. */
function sessionStatsCard() {
  const card = sidepanelCard('trend', 'Tonight');
  fetch('/api/session/current').then(r => r.json()).then(s => {
    if (!s.gamesPlayed || s.gamesPlayed <= 1) { card.remove(); return; }
    const rows = el('div', 'dayreport-rows');
    [
      ['Games played', s.gamesPlayed],
      ['Good wins', s.goodWins],
      ['Evil wins', s.evilWins],
    ].forEach(([lbl, val]) => {
      const stat = el('div', 'stat');
      stat.append(el('div', 'stat-n mono', String(val)), el('div', 'stat-lbl', lbl));
      rows.append(stat);
    });
    card.append(rows);

    if (s.players.length) {
      const list = el('div', 'rosterlist');
      s.players.slice(0, 6).forEach(p => {
        const row = el('div', 'rosterrow');
        const top = el('div', 'rosterrow-top');
        top.append(el('strong', null, p.name), el('span', 'rosterrole', `${p.wins}W / ${p.gamesPlayed}`));
        row.append(top);
        list.append(row);
      });
      card.append(list);
    }
  }).catch(() => card.remove());
  return card;
}

/** An <img> for this character's token, falling back to a plain circle
    (too small at power-log scale for a readable initial) if the art is
    missing or fails to load. */
function tokenOrFallback(characterId, imgClass, fallbackClass) {
  const src = TOKENS[characterId];
  if (src) {
    const img = document.createElement('img');
    img.className = imgClass;
    img.src = src;
    img.alt = '';
    img.onerror = () => img.replaceWith(el('div', fallbackClass));
    return img;
  }
  return el('div', fallbackClass);
}

/** Every real "choose a player" moment of the whole game, one row per
    character, one column per night/day — a full-screen lightbox rather
    than a sidepanel card, since a long game with a full table makes for a
    genuinely wide/tall grid that needs its own scrollable space instead of
    competing with the fixed-height dashboard for room. Both the acting
    role and every target get their actual token art, not just a name —
    text alone was hard to scan at a glance. */
function powerLogOverlay() {
  const overlay = el('div', 'powerlog-overlay');

  const header = el('div', 'powerlog-header');
  header.append(el('h2', null, 'Power log'));
  const close = withIcon(el('button', 'ghostbtn', 'Close'), 'close');
  close.onclick = () => overlay.remove();
  header.append(close);
  overlay.append(header);

  const body = el('div', 'powerlog-body');
  const table = el('table', 'powerlog-table');

  const nights = [];
  for (let n = 1; n <= S.nightNumber; n++) nights.push(n);

  const headRow = el('tr');
  headRow.append(el('th', null, 'Role'));
  nights.forEach(n => headRow.append(el('th', null, `Night ${n}`), el('th', null, `Day ${n}`)));
  table.append(headRow);

  const playersByName = {};
  S.players.forEach(p => { playersByName[p.name] = p; });

  S.players.forEach(p => {
    const row = el('tr');
    const label = el('td');
    const roleCell = el('div', 'powerlog-role-cell');
    roleCell.append(tokenOrFallback(p.characterId, 'powerlog-token', 'powerlog-token-fallback'));
    const text = el('div');
    text.append(el('span', 'powerlog-role', p.character || 'Unknown'), el('span', 'powerlog-name', p.name));
    roleCell.append(text);
    label.append(roleCell);
    row.append(label);

    nights.forEach(n => {
      ['night', 'day'].forEach(phase => {
        const entries = S.actionLog.filter(a => a.playerId === p.id && a.night === n && a.phase === phase);
        const cell = el('td', entries.length ? 'used' : 'empty');
        if (entries.length) {
          entries.forEach((e, ei) => {
            if (ei > 0) cell.append(document.createTextNode('; '));
            e.targets.forEach((name, ti) => {
              if (ti > 0) cell.append(document.createTextNode(' & '));
              const targetPlayer = playersByName[name];
              const chip = el('span', 'powerlog-target');
              chip.append(
                tokenOrFallback(targetPlayer && targetPlayer.characterId, 'powerlog-target-token', 'powerlog-target-token-fallback'),
                document.createTextNode(name),
              );
              cell.append(chip);
            });
          });
        } else {
          cell.textContent = '—';
        }
        row.append(cell);
      });
    });
    table.append(row);
  });

  body.append(table);
  overlay.append(body);
  document.body.append(overlay);
}

/* The host still declares who nominated whom — that part stays a live,
   spoken thing at the table. Voting itself now happens on each player's own
   phone over a timed window; this panel just shows the shared read of the
   room (the live tally) while that's running, same as everyone watching
   hands go up together. */
function nominationPanel() {
  const box = el('div', 'nompanel');
  const title = el('div', 'dayreport-title');
  title.append(wrapIcon('hand', 14), el('span', null, 'Nominations'));
  box.append(title);

  const todays = S.nominations.filter(n => n.day === S.nightNumber);
  if (todays.length) {
    const list = el('div', 'nomlist');
    todays.forEach(n => {
      const yesCount = n.closed ? n.yesCount : n.votes.filter(v => v.vote === 'yes').length;
      const status = n.closed ? `${yesCount} yes` : 'voting…';
      const line = el('div', 'nomline');
      if (n.virginFired) line.append(wrapIcon('bolt', 13));
      line.append(el('span', null, `${n.nominatorName} → ${n.nomineeName} — ${status}` + (n.virginFired ? '  —  Virgin fired, nominator executed' : '')));
      list.append(line);
    });
    box.append(list);
  }

  const openNom = todays.find(n => !n.closed);
  if (openNom) {
    const eligible = S.players.filter(p => p.alive || !p.ghostVoteUsed).length;
    const yes = openNom.votes.filter(v => v.vote === 'yes').length;
    const no = openNom.votes.length - yes;
    box.append(countdown(openNom.windowEndsAt, S.config.voteWindowSeconds));
    box.append(el('div', 'sub', `${yes} yes · ${no} no · ${eligible - openNom.votes.length} not yet voted`));
    return box;
  }

  const living = S.players.filter(p => p.alive);
  if (living.length < 2) { box.append(el('p', 'sub', 'Need at least two living players.')); return box; }

  const nominatorSel = el('select');
  const nomineeSel = el('select');
  living.forEach(p => { nominatorSel.append(new Option(p.name, p.id)); nomineeSel.append(new Option(p.name, p.id)); });
  const row = el('div', 'nomrow');
  row.append(nominatorSel, wrapIcon('arrows', 16), nomineeSel);
  box.append(row);

  const submit = withIcon(el('button', null, 'Open for voting'), 'check');
  submit.onclick = () => {
    post('/api/table/nominate', { nominatorId: nominatorSel.value, nomineeId: nomineeSel.value }).then(r => {
      if (r.error) { alert(r.error); return; }
      if (r.virginFired) alert('The Virgin was nominated by a Townsfolk — the nominator is executed immediately.');
    });
  };
  box.append(submit);
  return box;
}

function countdown(windowEndsAt, total) {
  if (!windowEndsAt) return null;
  total = total || 1;
  const left = Math.max(0, Math.ceil((windowEndsAt - Date.now()) / 1000));
  const frac = Math.max(0, Math.min(1, left / total));
  const urgent = left <= 10;

  // A fixed viewBox with the actual rendered size left to CSS (100% of
  // whatever box this lands in) — needed so this can shrink to fit inside
  // the seating ring instead of forcing its own fixed pixel footprint.
  const size = 200, stroke = 10, r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const wrap = el('div', 'clockwrap');
  wrap.innerHTML =
    `<svg viewBox="0 0 ${size} ${size}" class="ring-svg${urgent ? ' urgent' : ''}">
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}"/>
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="currentColor" stroke-width="${stroke}"
        stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - frac)).toFixed(1)}"
        transform="rotate(-90 ${size / 2} ${size / 2})"/>
    </svg>`;
  wrap.append(el('div', 'clock' + (urgent ? ' urgent' : ''), String(left)));
  return wrap;
}

/* Renders are debounced through a brief fade whenever the phase itself
   changes, so dusk-to-night reads as a ritual rather than a page reload.
   A countdown re-render each second is not a phase change and skips this. */
/* Not gated by the phase-fade debounce below — a reconnect request can land
   mid-night and someone needs to see it immediately, not after the next
   phase change. */
function renderReclaimBanner() {
  const box = document.getElementById('reclaimBanner');
  box.innerHTML = '';
  (S.pendingReclaims || []).forEach(r => {
    const row = el('div', 'reclaim');
    const ask = el('span', 'ask');
    ask.append(wrapIcon('users', 15), el('span', null, `A new device wants to reconnect as ${r.name}.`));
    row.append(ask);
    const btns = el('div', 'btns');
    const approve = withIcon(el('button', 'primary', 'Approve'), 'check');
    approve.onclick = () => post('/api/table/reclaim/approve', { requestId: r.requestId });
    const deny = el('button', null, 'Deny');
    deny.onclick = () => post('/api/table/reclaim/deny', { requestId: r.requestId });
    btns.append(approve, deny);
    row.append(btns);
    box.append(row);
  });
}

let lastScriptFetched = null;
function syncScriptChars() {
  if (S.script === lastScriptFetched) return;
  lastScriptFetched = S.script;
  SCRIPT_CHARS = null;
  fetch('/api/script').then(r => r.json()).then(data => {
    if (data.edition !== S.script) return; // stale response for a script we've since left
    SCRIPT_CHARS = data.characters;
    render();
  }).catch(() => {});
}

/** A slain Demon that ends the game plays this in place of the usual fade —
    the sequencing check in render() below guarantees it only ever fires
    once for a given ending, the same instant that ending is first seen. */
function playSlayerFlash(targetName, onDone) {
  const overlay = el('div', 'slayer-flash');
  overlay.append(wrapIcon('crosshair', 88), el('div', 'slayer-flash-text', `${targetName} falls.`));
  document.body.append(overlay);
  requestAnimationFrame(() => overlay.classList.add('show'));
  setTimeout(() => {
    overlay.classList.remove('show');
    setTimeout(() => { overlay.remove(); onDone(); }, 380);
  }, 2200);
}

let lastPhaseKey = '';
function render() {
  if (!S) return;
  syncScriptChars();
  renderReclaimBanner();
  const stage = document.getElementById('stage');
  const controls = document.getElementById('controls');
  const key = `${S.phase}:${S.nightNumber}:${S.wave}`;
  const changed = key !== lastPhaseKey;
  lastPhaseKey = key;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // The Slayer's shot is the one way to end the game with a single public,
  // named action — everything else that can end it (an execution, a night
  // kill) already had its own build-up over the whole day/night; this is
  // the one moment that happens in an instant and deserves its own beat.
  if (changed && S.phase === 'over' && !reduceMotion) {
    const lastDeath = S.deaths[S.deaths.length - 1];
    if (lastDeath && lastDeath.cause === 'slayer') {
      playSlayerFlash(lastDeath.name, renderNow);
      return;
    }
  }

  if (changed && !reduceMotion && stage.childNodes.length) {
    stage.classList.add('fading');
    controls.classList.add('fading');
    setTimeout(() => { renderNow(); stage.classList.remove('fading'); controls.classList.remove('fading'); }, 380);
  } else {
    renderNow();
  }
}

function renderNow() {
  const stage = document.getElementById('stage');
  const controls = document.getElementById('controls');
  stage.innerHTML = '';
  controls.innerHTML = '';

  // The room's own color read shifts to match who actually won, once the
  // game is over — good tilts the whole screen blue, evil stays (and
  // sharpens) the oxblood it's had all along. Reverts the moment a new
  // game starts, since nothing sets it outside this one condition.
  const root = document.documentElement;
  if (S.phase === 'over' && S.victory) {
    root.style.setProperty('--primary', S.victory.winner === 'good' ? 'var(--good)' : 'var(--oxblood-hi)');
    root.style.setProperty('--primary-hi', S.victory.winner === 'good' ? 'var(--good-hi)' : '#c23438');
  } else {
    root.style.removeProperty('--primary');
    root.style.removeProperty('--primary-hi');
  }

  const brandIcon = document.getElementById('brandIcon');
  brandIcon.innerHTML = '';
  brandIcon.append(wrapIcon(S.phase === 'night' ? 'moon' : 'sun', 22));

  const phaseEl = document.getElementById('phase');
  phaseEl.innerHTML = '';
  const phaseLabel =
    S.phase === 'night' ? `Night ${S.nightNumber}${S.wave === 2 ? ' — again' : ''}`
    : S.phase === 'day' ? `Day ${S.nightNumber}`
    : S.phase;
  phaseEl.append(wrapIcon(S.phase === 'night' ? 'moon' : S.phase === 'day' ? 'sun' : 'clock', 14), el('span', null, phaseLabel));

  if (S.phase === 'lobby') {
    stage.append(el('div', 'narration', S.players.length ? 'The town gathers.' : 'The town is still empty.'));

    const joinbar = el('div', 'joinbar');
    const lbl = el('span', 'lbl');
    lbl.append(wrapIcon('users', 16), el('span', null, 'Join at'));
    // Always the server's real LAN address, never derived from this
    // browser's own location — the TV is very often just pointed at
    // localhost, which means nothing on anyone's phone but their own.
    joinbar.append(lbl, el('span', 'joinaddr', JOIN_ADDR || 'finding the address…'));
    stage.append(joinbar);

    if (SCRIPTS) {
      const grid = el('div', 'script-grid');
      SCRIPTS.forEach(meta => grid.append(scriptCard(meta, meta.id === S.script)));
      stage.append(grid);
    }

    const room = el('div', 'waitingroom');
    const roomTitle = el('div', 'waitingroom-title');
    roomTitle.append(wrapIcon('users', 14), el('span', null, `${S.players.length} seated`));
    room.append(roomTitle);
    if (S.players.length) room.append(ringSeats(S.players));
    else room.append(el('div', 'sub', 'Open that address on your phone to take a seat.'));
    stage.append(room);

    const SCRIPT_NAMES = {};
    (SCRIPTS || []).forEach(m => { SCRIPT_NAMES[m.id] = m.name; });
    const deal = withIcon(el('button', 'primary', `Deal ${SCRIPT_NAMES[S.script] || S.script} to ${S.players.length}`), 'moon');
    deal.disabled = S.players.length < 5;
    deal.onclick = () => post('/api/table/deal').then(r => r.error && alert(r.error));
    controls.append(deal);

    const clearLobby = withIcon(el('button', 'ghostbtn', 'Clear the lobby'), 'close');
    clearLobby.disabled = !S.players.length;
    clearLobby.onclick = () => confirm(`Remove all ${S.players.length} seated player${S.players.length === 1 ? '' : 's'} and start the count over?`) &&
      post('/api/table/clear-lobby').then(r => r.error && alert(r.error));
    controls.append(clearLobby);

    const history = withIcon(el('button', 'ghostbtn', 'Game history'), 'scroll');
    history.onclick = () => window.open('/games', '_blank');
    controls.append(history);
  }

  if (S.phase === 'reveal') {
    speak('Look at your hands. Learn what you are.', { dread: true });

    const main = el('div', 'stage-main');
    main.append(
      el('div', 'narration dread', 'Look at your hands.'),
      el('div', 'sub', 'Each of you now knows only yourself. No one in this room knows the rest.'),
      ringSeats(S.players),
    );

    const left = el('div', 'sidepanel');
    left.append(scriptRosterCard());

    const right = el('div', 'sidepanel');
    right.append(controlPanelRow());
    const go = withIcon(el('button', 'primary', 'Night falls'), 'moon');
    go.onclick = () => post('/api/table/night');
    const actions = el('div', 'sidepanel-actions');
    actions.append(go);
    right.append(actions);

    stage.append(dashboardLayout({ left, main, right }));
  }

  if (S.phase === 'night') {
    const line = S.wave === 2
      ? 'Something is not finished.'
      : 'Close your eyes. The town sleeps.';
    speak(line, { dread: S.wave === 2 });
    const acted = S.players.filter(p => p.submitted).length;
    const living = S.players.filter(p => p.alive).length;

    const main = el('div', 'stage-main');
    main.append(
      dayCounterLabel(`Night ${S.nightNumber}${S.wave === 2 ? ' — again' : ''}`),
      el('div', 'narration dread', line),
      ringSeats(S.players),
    );
    const nightTrivia = triviaLine();
    if (nightTrivia) main.append(nightTrivia);

    const left = el('div', 'sidepanel');
    left.append(scriptRosterCard());

    const right = el('div', 'sidepanel');
    right.append(controlPanelRow());
    const timerCard = sidepanelCard('clock', S.wave === 2 ? 'Second window' : 'Night window');
    const timer = countdown(S.windowEndsAt, S.wave === 2 ? S.config.wave2Seconds : S.config.windowSeconds);
    if (timer) { timer.classList.add('timerbox'); timerCard.append(timer); }
    timerCard.append(el('div', 'sub', `${acted} of ${living} have answered.`));
    right.append(timerCard);

    stage.append(dashboardLayout({ left, main, right }));
  }

  if (S.phase === 'day') {
    const lastNight = S.deaths.filter(d => d.night === S.nightNumber && d.cause !== 'execution');
    const line = lastNight.length
      ? `${lastNight.map(d => d.name).join(' and ')} did not wake.`
      : 'Everyone wakes. That should worry you.';
    speak(line, { dread: !!lastNight.length });

    const main = el('div', 'stage-main');
    main.append(dayCounterLabel(`Day ${S.nightNumber}`), el('div', 'narration', 'Dawn.'));
    const deathsLine = el('div', 'deaths');
    if (lastNight.length) deathsLine.append(wrapIcon('skull', 18));
    deathsLine.append(el('span', null, line));
    main.append(deathsLine);

    if (S.mastermindExtraDay) {
      const h = el('div', 'hint');
      h.append(wrapIcon('bolt', 16), el('span', null, 'The Demon has fallen — but the Mastermind\'s power lingers. Play one more day. If a good player is executed now, evil wins. If evil is, good does.'));
      main.append(h);
    }
    // The Storyteller hint used to render here — pulled for now, since a
    // long one could push the ring itself out of the viewport. Revisiting
    // with a layout that can't do that (a fixed-height slot, a toast,
    // something outside the flex column the ring lives in) rather than
    // just shrinking the text and hoping.
    main.append(ringSeats(S.players));

    const anyOpen = voteIsOpen();
    // Only worth killing time over while there's actually a wait — the rest
    // of the day is nominations and talk, not idle hands on phones.
    if (anyOpen) {
      const dayTrivia = triviaLine();
      if (dayTrivia) main.append(dayTrivia);
    }

    // The left panel is reference-only now (the script's own roster) — every
    // interactive thing, nominations included, lives on the right with the
    // rest of the controls, instead of splitting the day's actions in half.
    const left = el('div', 'sidepanel');
    left.append(scriptRosterCard());

    const right = el('div', 'sidepanel');
    right.append(controlPanelRow(), nominationPanel(), dayReport());

    const actions = el('div', 'sidepanel-actions');
    const tally = withIcon(el('button', 'primary', 'Tally the votes'), 'skull');
    tally.disabled = anyOpen;
    tally.onclick = () => post('/api/table/tally').then(r => r.error && alert(r.error));
    const nightBtn = withIcon(el('button', null, 'Night falls'), 'moon');
    nightBtn.disabled = anyOpen;
    nightBtn.onclick = () => post('/api/table/night');
    actions.append(tally, nightBtn);

    // A quiet correction path, not the primary flow — for when what the
    // phones tallied doesn't match what actually happened in the room.
    const sel = el('select');
    sel.append(new Option('Override: no execution', ''));
    S.players.filter(p => p.alive).forEach(p => sel.append(new Option(p.name, p.id)));
    const override = withIcon(el('button', 'ghostbtn', 'Force this instead'), 'skull');
    override.disabled = anyOpen;
    override.onclick = () => {
      if (confirm('Override the digital tally and manually record who was executed?')) {
        post('/api/table/execute', { playerId: sel.value || null });
      }
    };
    actions.append(sel, override);
    right.append(actions);

    stage.append(dashboardLayout({ left, main, right }));
  }

  if (S.phase === 'over' || S.revealed) {
    stage.innerHTML = '';

    const main = el('div', 'stage-main');
    main.append(el('div', 'narration', 'The truth, then.'));
    if (S.victory) {
      const banner = el('div', 'victory-banner');
      const badge = el('div', 'icon-badge');
      badge.append(wrapIcon(S.victory.winner === 'good' ? 'sun' : 'skull', 24));
      const text = el('div');
      text.append(el('div', 'who', S.victory.winner === 'good' ? 'Good wins' : 'Evil wins'), el('div', null, S.victory.reason));
      banner.append(badge, text);
      main.append(banner);
    }
    // Same ring the table's watched all game — avatars swap for the real
    // token art now that it's revealed, with a shroud over anyone who died.
    main.append(ringSeats(S.players, { revealed: true }));

    const left = el('div', 'sidepanel');
    if (S.gameSummary) left.append(gameSummaryCard(S.gameSummary));
    const logCard = sidepanelCard('scroll', 'What actually happened');
    const log = el('div', 'log');
    S.log.forEach(l => log.append(el('p', null, `Night ${l.night}: ${l.text}`)));
    logCard.append(log);
    left.append(logCard);

    const right = el('div', 'sidepanel');
    right.append(controlPanelRow());
    if (S.actionLog && S.actionLog.length) {
      const powerLogBtn = withIcon(el('button', null, 'Power log'), 'scroll');
      powerLogBtn.onclick = () => powerLogOverlay();
      right.append(powerLogBtn);
    }
    // Only worth a card once there's a second game tonight to compare
    // against — sessionStatsCard() removes itself if there isn't one.
    right.append(sessionStatsCard());
    const rosterCard = sidepanelCard('users', 'Full roster');
    const list = el('div', 'rosterlist');
    S.players.forEach(p => {
      const row = el('div', 'rosterrow');
      if (p.color) row.style.borderLeftColor = p.color.hex;
      const top = el('div', 'rosterrow-top');
      top.append(
        el('strong', p.alive ? null : 'deadname', p.name),
        el('span', 'rosterrole', p.character || 'unknown'),
      );
      const career = el('div', 'career');
      // A game just got written to this name's record — show the updated line.
      fetch('/api/profile?name=' + encodeURIComponent(p.name)).then(r => r.json()).then(r => {
        if (r.found && r.stats && r.stats.gamesPlayed) {
          career.append(wrapIcon('trend', 12), el('span', null, `${r.stats.gamesPlayed} games · ${Math.round((r.stats.winRate || 0) * 100)}% win rate`));
        }
      }).catch(() => {});
      row.append(top, career);
      list.append(row);
    });
    rosterCard.append(list);
    right.append(rosterCard);

    stage.append(dashboardLayout({ left, main, right }));
  }
}

fetch('/api/tokens')
  .then(r => r.json())
  .then(t => { TOKENS = t; render(); })
  .catch(() => {});

fetch('/api/scripts')
  .then(r => r.json())
  .then(s => { SCRIPTS = s; render(); })
  .catch(() => {});

// Whatever address loaded this very page is, by definition, one every
// other device can already reach it by too — true whether that's the LAN
// IP typed in directly, or a tunnel's public hostname (Cloudflare/ngrok/etc)
// for a game hosted online. The one address that's *not* usable elsewhere
// is localhost/127.0.0.1 — the TV's own loopback, meaningless to a phone —
// so that's the only case that still asks the server for the real LAN IP.
if (/^(localhost|127\.0\.0\.1|\[::1\])(:\d+)?$/.test(location.host)) {
  fetch('/api/join-address')
    .then(r => r.json())
    .then(r => { JOIN_ADDR = r.url; render(); })
    .catch(() => {});
} else {
  JOIN_ADDR = location.origin;
}

fetch('/trivia.json')
  .then(r => r.json())
  .then(t => { TRIVIA = t; })
  .catch(() => {});

function pollHostState() {
  fetch('/api/host-state').then(r => r.json()).then(data => { S = data; render(); }).catch(() => {});
}

let hostLiveMessageReceived = false;
const es = new EventSource('/host-events');
es.onmessage = e => { hostLiveMessageReceived = true; S = JSON.parse(e.data); render(); };
// A proxy in front of this server (a tunnel, most likely) can hold this
// connection open without ever delivering anything — the TV would just sit
// on "finding the address…" forever with no sign anything's actually wrong.
setTimeout(() => {
  if (hostLiveMessageReceived) return;
  es.close();
  pollHostState();
  setInterval(pollHostState, 1500);
}, 4000);
// Also covers a day with an open vote — that countdown used to only tick
// forward on an SSE push (someone actually casting a vote), not every
// second, and it's the same redraw the trivia rotation below needs anyway.
setInterval(() => { if (S && (S.phase === 'night' || voteIsOpen())) render(); }, 1000);
// Rerolled independently of the render cycle so it doesn't change every
// time someone casts a vote — only ever while it's actually on screen.
setInterval(() => {
  if (!S || !(S.phase === 'night' || voteIsOpen())) return;
  triviaFact = null;
  render();
}, 14000);
</script>
</body>
</html>
